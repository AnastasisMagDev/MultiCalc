<!DOCTYPE html>
<!--
  MODULE-16 · Acids, Bases & pH Lab  (Chemistry chapter)
  Standalone module — open this file directly; nothing here is registered in the host app yet.
  v2.1 (16 Oct 2026) — audit fixes: real-ion ledger for the ionic strength (H₂SO₄ double count removed), signed-derivative chart, Ideal/Real-consistent
  buffer capacity, 25 °C scope note, high-I warnings in all tabs, lazy/chunked start-up with timings, ~4 000 + new independent checks. Calculations: 25 °C only.
  Folder:  MODULE-16-ACIDS-BASES-PH-LAB.html   screen + CSS (all .phl-* namespaced) + UI glue
           ph-engine.js   exact pH solver (charge balance, ideal + Davies activities), buffers, titrations — no DOM
           ph-data.js     76 compounds (acids, bases, salts, amino acids, Good's buffers), indicators, reference values
           ph-text.js     this module's own el/en/es dictionary
           ph-steps.js    tutor mode: general + detailed solutions (solution, buffer, titration point)
           ph-viz.js      colour model + the beaker (ions, stir bar, electrode, burette, drops)
           ph-plot.js     precise scientific plots (distribution, Sillén, pH–log c, capacity, titration …)
           ph-boot.js     the real loading screen (pH wheel) — runs the internal consistency checks; the pH–log c tables are warmed in the background
           dev/           developer tools, NOT loaded by the app: run-tests.js (node), ui-test.js / ui-sweep.js (Playwright), see dev/README.md
  Dev flags: ?phl-noboot skips the loading screen (tests / quick iteration) · ?phl-bench=5 runs the real start-up 5 times and prints median / p95 /
             worst frame gap on screen (use it on the tablet). The boot depth is PHLabBoot.DEPTH (ph-boot.js).
  Screen id: scr-phlab  ·  language: window.MultiCalc.state.currentLang (EL/EN/ES) or the EL/EN/ES switch when standalone
  Globals:   PHLabEngine, PHLabData, PHLabText, PHLabSteps, PHLabViz, PHLabPlot, PHLabBoot, PHLabCache, PHLab (state/refresh hook)
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acids, Bases &amp; pH Lab</title>
<style>
/* ===== MODULE-16 · Acids, Bases & pH Lab ===== every selector is namespaced (.phl-*) — the host injects <style> globally */
.phl-root,.phl-root *{box-sizing:border-box}
.phl-root [hidden]{display:none!important}
.phl-root{
  --phl-border:rgba(128,138,158,.34);--phl-soft:rgba(128,138,158,.12);--phl-soft2:rgba(128,138,158,.22);--phl-dim:.74;
  --phl-sa:#e5533d;--phl-wa:#dd8a22;--phl-sb:#3f7de0;--phl-wb:#7a5fd0;--phl-salt:#2a9d68;--phl-bio:#c04f93;--phl-custom:#7f8794;
  position:relative;max-width:1180px;margin:0 auto;padding:12px 12px 28px;color:inherit;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;text-align:left}
html.phl-standalone body{margin:0;min-height:100vh;background:#0e1520;color:#e9eef6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:light){html.phl-standalone body{background:#f3f5f9;color:#17202c}}
html.phl-standalone .screen{display:block}
html.phl-standalone .back-btn{display:none}

.phl-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.phl-head{flex:1;min-width:0}
.phl-title{font-size:1.42rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.phl-sub{margin:4px 0 0;opacity:var(--phl-dim);font-size:.86rem}
.phl-lang{display:flex;gap:4px}
.phl-lang button{border:1px solid var(--phl-border);background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit;font-size:.8rem;cursor:pointer}
.phl-lang button[aria-pressed=true]{background:var(--phl-soft2);font-weight:700}

.phl-tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;border-bottom:1px solid var(--phl-border)}
.phl-tabs::-webkit-scrollbar{display:none}
.phl-tab{flex:1 0 auto;background:none;border:0;color:inherit;font:inherit;padding:11px 10px;cursor:pointer;opacity:.68;position:relative;white-space:nowrap;min-height:44px}
.phl-tab[aria-selected=true]{opacity:1;font-weight:650}
.phl-tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,#d61c24,#f47c26,#f6c42a,#3cb05c,#2868c4,#962896)}

.phl-layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.phl-layout{grid-template-columns:372px minmax(0,1fr);align-items:start}.phl-stage{position:sticky;top:8px}}

.phl-stage{container-type:inline-size;border:1px solid var(--phl-border);border-radius:20px;padding:10px 14px 14px;background:linear-gradient(160deg,var(--phl-soft2),var(--phl-soft))}
.phl-stage-row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:8px;align-items:center}
.phl-beaker{display:block;width:100%;height:232px;color:inherit;transition:height .3s}
.phl-beaker.tall{height:300px}
.phl-readout{min-width:0}
.phl-ph{display:block}
.phl-ph-label{display:block;font-size:.95rem;opacity:.7;line-height:1}
.phl-ph-val{display:block;font-size:2.7rem;font-size:clamp(2.1rem,13.5cqw,3.5rem);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.phl-cls{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600;font-size:.92rem}
.phl-cls::before{content:"";flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:var(--chip,#888);box-shadow:0 0 0 2px var(--phl-border)}
.phl-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:.8rem;opacity:.88}
.phl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.phl-dot.h{background:#ff6a3d}.phl-dot.oh{background:#3d9bff}
.phl-cap{font-size:.78rem;opacity:.72;margin-top:6px}
.phl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.phl-gauge{position:relative;margin:12px 9px 0}
.phl-gauge-bar{height:10px;border-radius:6px;background:linear-gradient(90deg,#d61c24 0%,#e83e28 14.3%,#f47c26 25%,#f6c42a 35.7%,#a8cc34 44.3%,#3cb05c 50%,#20a0aa 57.1%,#2868c4 67.9%,#4c46b0 78.6%,#7834a4 89.3%,#962896 100%)}
.phl-mk{position:absolute;top:-4px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:3px solid #1b2433;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:left .38s cubic-bezier(.2,.8,.2,1)}
.phl-mk.ghost{background:transparent;border:2px dashed currentColor;box-shadow:none;opacity:.7}
.phl-gauge-scale{display:flex;justify-content:space-between;font-size:.72rem;opacity:.62;margin-top:7px}
.phl-model{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.phl-model>span{font-size:.8rem;opacity:.78}
.phl-model .phl-seg{margin:0;flex:1;min-width:150px}
.phl-model .phl-seg button{min-height:36px;padding:6px 8px;font-size:.86rem}
.phl-mstat{font-size:.76rem;opacity:.74;margin-top:6px;font-variant-numeric:tabular-nums}

.phl-panel{min-width:0;counter-reset:phlh}
.phl-h{display:flex;align-items:baseline;gap:8px;font-size:.78rem;font-weight:650;letter-spacing:.02em;opacity:.78;margin:20px 0 9px}
.phl-h::before{counter-increment:phlh;content:counter(phlh);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--phl-soft2);font-size:.72rem;font-weight:700;opacity:1}
.phl-panel>.phl-h:first-child{margin-top:2px}
.phl-field{display:flex;flex-direction:column;gap:5px;margin:0 0 11px;min-width:0}
.phl-field>span{font-size:.82rem;opacity:.8}
.phl-root input[type=text],.phl-root select{width:100%;min-height:44px;padding:9px 12px;font:inherit;font-size:16px;color:inherit;background-color:var(--phl-soft);border:1px solid var(--phl-border);border-radius:12px;-webkit-appearance:none;appearance:none}
.phl-root select{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.phl-root select option,.phl-root select optgroup{color:#111;background:#fff}
.phl-root :focus-visible{outline:2px solid #4d8dff;outline-offset:2px}
.phl-root .phl-invalid{border-color:#e5533d!important;box-shadow:0 0 0 1px #e5533d}
.phl-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px;align-items:end}
.phl-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px;align-items:end}
.phl-hint{font-size:.82rem;opacity:.74;margin:2px 0 10px}

.phl-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.phl-chips::-webkit-scrollbar{display:none}
.phl-chips.wrap{flex-wrap:wrap;overflow:visible}
.phl-chip{flex:0 0 auto;border:1px solid var(--phl-border);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer;min-height:38px}
.phl-chip[aria-pressed=true]{background:var(--c,#4d8dff);border-color:var(--c,#4d8dff);color:#fff;font-weight:650}
.phl-seg{display:flex;border:1px solid var(--phl-border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.phl-seg button{flex:1;padding:11px 8px;font:inherit;background:transparent;color:inherit;border:0;cursor:pointer;min-height:44px}
.phl-seg button+button{border-left:1px solid var(--phl-border)}
.phl-seg button[aria-pressed=true]{background:var(--c,#4d8dff);color:#fff;font-weight:650}
.phl-btn{border:1px solid var(--phl-border);background:var(--phl-soft2);color:inherit;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.phl-btn.primary{background:#3f7de0;border-color:#3f7de0;color:#fff}

.phl-root input[type=range]{width:100%;height:32px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.phl-root input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:var(--phl-soft2)}
.phl-root input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--phl-soft2)}
.phl-root input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid #3f7de0;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.phl-root input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #3f7de0;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.phl-root input[type=range].phl-spectrum::-webkit-slider-runnable-track{background:linear-gradient(90deg,#d61c24 0%,#e83e28 14.3%,#f47c26 25%,#f6c42a 35.7%,#a8cc34 44.3%,#3cb05c 50%,#20a0aa 57.1%,#2868c4 67.9%,#4c46b0 78.6%,#7834a4 89.3%,#962896 100%)}
.phl-root input[type=range].phl-spectrum::-moz-range-track{background:linear-gradient(90deg,#d61c24 0%,#e83e28 14.3%,#f47c26 25%,#f6c42a 35.7%,#a8cc34 44.3%,#3cb05c 50%,#20a0aa 57.1%,#2868c4 67.9%,#4c46b0 78.6%,#7834a4 89.3%,#962896 100%)}
.phl-ticks{display:flex;justify-content:space-between;font-size:.72rem;opacity:.62;margin:-2px 4px 8px}

.phl-meta{font-size:.86rem;opacity:.85;margin:-2px 0 11px;min-height:1.2em}
.phl-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.phl-res{border:1px solid var(--phl-border);background:var(--phl-soft);border-radius:12px;padding:9px 12px;min-width:0}
.phl-res.wide{grid-column:1/-1}
.phl-res-l{display:block;font-size:.76rem;opacity:.74}
.phl-res-v{display:block;font-size:1.12rem;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.phl-res-v small{font-size:.78rem;font-weight:500;opacity:.8}
.phl-warn,.phl-info{padding:9px 12px;border-radius:10px;font-size:.88rem;margin:8px 0}
.phl-warn{border-left:4px solid #e0a02c;background:rgba(224,160,44,.15)}
.phl-info{border-left:4px solid #4d8dff;background:rgba(77,141,255,.12)}
.phl-bad{border-left-color:#e5533d;background:rgba(229,83,61,.14)}
.phl-ok{border-left-color:#2a9d68;background:rgba(42,157,104,.14)}

.phl-card{border:1px solid var(--phl-border);border-radius:14px;padding:12px 14px;background:var(--phl-soft);margin-top:12px}
.phl-card h3{margin:0 0 8px;font-size:.98rem;font-weight:650}
.phl-sp{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) minmax(58px,auto);gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.phl-sp-bar{height:10px;border-radius:6px;background:var(--phl-soft2);overflow:hidden}
.phl-sp-bar i{display:block;height:100%;border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.phl-sp-v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.phl-plot{display:block;width:100%;height:290px;color:inherit;touch-action:pan-y;cursor:crosshair;margin-top:4px}
.phl-plotcap{font-size:.8rem;opacity:.78;margin:8px 2px 0}

.phl-steps{margin-top:6px;border:1px solid var(--phl-border);border-radius:14px;background:var(--phl-soft)}
.phl-steps>summary{cursor:pointer;padding:13px 14px;font-weight:650;list-style:none;min-height:44px}
.phl-steps>summary::-webkit-details-marker{display:none}
.phl-steps>summary::after{content:"+";float:right;opacity:.75;font-weight:400;font-size:1.2rem;line-height:1}
.phl-steps[open]>summary::after{content:"\2212"}
.phl-steps>summary small{font-weight:400;opacity:.7;margin-left:6px}
.phl-lvl{display:flex;gap:10px;align-items:center;padding:0 14px 6px;flex-wrap:wrap}
.phl-lvl .phl-seg{margin:0;flex:1;min-width:190px}
.phl-lvl .phl-seg button{min-height:38px;padding:7px 8px}
.phl-lvlhint{font-size:.78rem;opacity:.72;padding:0 14px 8px}
.phl-steps ol{margin:0;padding:2px 14px 6px;list-style:none;counter-reset:phls}
.phl-sec{margin:14px -4px 6px;padding:7px 10px;border-radius:9px;background:var(--phl-soft2);font-weight:700;font-size:.9rem}
.phl-step{counter-increment:phls;position:relative;padding:2px 0 14px 36px;min-width:0}
.phl-step::before{content:counter(phls);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--phl-soft2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.phl-step::after{content:"";position:absolute;left:12px;top:30px;bottom:3px;width:1px;background:var(--phl-border)}
.phl-step:last-child::after{display:none}
.phl-step-t{font-weight:650;padding-top:2px}
.phl-math{margin:6px 0;padding:7px 11px;background:var(--phl-soft);border-radius:9px;font-variant-numeric:tabular-nums;overflow-x:auto;overflow-wrap:anywhere}
.phl-note{font-size:.86rem;opacity:.88;margin-top:5px}
.phl-scroll{overflow-x:auto;margin:7px 0}
.phl-tbl{border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums;min-width:100%}
.phl-tbl th,.phl-tbl td{border:1px solid var(--phl-border);padding:5px 9px;text-align:center;white-space:nowrap}
.phl-tbl th{background:var(--phl-soft);font-weight:650}
.phl-tbl td:first-child,.phl-tbl th:first-child{text-align:left}
.phl-tbl tr.hi td{background:rgba(77,141,255,.14);font-weight:650}
.phl-assume{font-size:.8rem;opacity:.68;margin:14px 0 0}
.phl-tempnote{font-size:.74rem;opacity:.8;margin-top:6px;padding:5px 9px;border-radius:8px;border:1px solid rgba(128,160,220,.35);background:rgba(77,141,255,.08)}
.phl-inv{display:block;color:#e5533d;font-size:.78rem;margin-top:3px}
.phl-failbadge{margin-top:8px;font-size:.78rem}

.phl-volrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.phl-volread{font-variant-numeric:tabular-nums}
.phl-keys{margin:0;padding:0;list-style:none}
.phl-keys li{padding:8px 0;border-top:1px solid var(--phl-border);font-size:.9rem;font-variant-numeric:tabular-nums}
.phl-keys li:first-child{border-top:0}
.phl-keys b{font-weight:650}
.phl-sw{display:flex;align-items:center;gap:12px;padding:6px 0}
.phl-sw-c{width:36px;height:36px;border-radius:50%;border:1px solid var(--phl-border);flex:0 0 auto;transition:background .25s}
.phl-sw-n{flex:1;min-width:0}
.phl-sw-r{font-size:.78rem;opacity:.7}
.phl-ev{display:inline-flex;gap:7px;align-items:baseline}
.phl-ev small{opacity:.75;font-variant-numeric:tabular-nums}

/* ---- loading screen: the pH wheel ---- */
.phl-boot{position:absolute;left:0;right:0;bottom:0;top:var(--phl-boot-top,76px);z-index:40;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#12305e 0%,#0a1a36 55%,#07111f 100%);color:#eaf2ff;transition:opacity .7s ease}
.phl-boot.out{opacity:0;pointer-events:none}
.phl-boot-inner{position:sticky;top:3vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 28px;text-align:center}
.phl-boot-title{font-size:1.15rem;font-weight:650;letter-spacing:.01em;margin-bottom:6px}
.phl-boot-wheel{width:min(86vw,440px);max-height:70vh}
.phl-boot-svg{display:block;width:100%;height:auto;overflow:visible}
.phl-boot-svg path,.phl-boot-svg circle{transition:fill-opacity .3s}
.phl-boot-msg{min-height:2.7em;margin-top:6px;font-size:.92rem;opacity:.92;max-width:34em}
.phl-boot-sum{font-size:.8rem;opacity:.7;margin-top:4px;font-variant-numeric:tabular-nums}

@media (max-width:420px){.phl-beaker{height:214px}.phl-beaker.tall{height:270px}.phl-stage{padding:8px 10px 12px}.phl-plot{height:260px}}
@media (prefers-reduced-motion:reduce){.phl-root *{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="scr-phlab" class="screen active phl-root">

  <header class="phl-top" id="phl-top">
    <button class="back-btn" type="button" aria-label="Back">&#8592;</button>
    <div class="phl-head">
      <h1 class="phl-title" data-i18n="title"></h1>
      <p class="phl-sub" data-i18n="subtitle"></p>
    </div>
    <div class="phl-lang" id="phl-lang" hidden>
      <button type="button" data-lang="el">EL</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
    </div>
  </header>

  <nav class="phl-tabs" id="phl-tabs" role="tablist">
    <button class="phl-tab" role="tab" data-tab="sol" data-i18n="tabSol"></button>
    <button class="phl-tab" role="tab" data-tab="buf" data-i18n="tabBuf"></button>
    <button class="phl-tab" role="tab" data-tab="tit" data-i18n="tabTit"></button>
    <button class="phl-tab" role="tab" data-tab="scale" data-i18n="tabScale"></button>
  </nav>

  <div class="phl-layout">
    <aside class="phl-stage">
      <div class="phl-stage-row">
        <canvas id="phl-beaker" class="phl-beaker" role="img"></canvas>
        <div class="phl-readout">
          <div class="phl-ph"><span class="phl-ph-label">pH</span><span class="phl-ph-val" id="phl-phval">7.00</span></div>
          <div class="phl-cls" id="phl-cls"></div>
          <div class="phl-legend" id="phl-legend">
            <span><i class="phl-dot h"></i>H<sub>3</sub>O<sup>+</sup></span><span><i class="phl-dot oh"></i>OH<sup>&minus;</sup></span>
            <span data-i18n="stageIons" style="flex-basis:100%;opacity:.8"></span>
          </div>
          <div class="phl-cap" id="phl-cap"></div>
          <span class="phl-sr" id="phl-sr" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="phl-gauge">
        <div class="phl-gauge-bar"></div>
        <i class="phl-mk ghost" id="phl-mk2" hidden></i><i class="phl-mk" id="phl-mk"></i>
        <div class="phl-gauge-scale"><span>0</span><span>7</span><span>14</span></div>
      </div>
      <div class="phl-model"><span data-i18n="modelLabel"></span>
        <div class="phl-seg" id="phl-model"><button type="button" data-m="ideal" data-i18n="modelIdeal"></button><button type="button" data-m="real" data-i18n="modelReal"></button></div>
      </div>
      <div class="phl-mstat" id="phl-mstat"></div>
      <div class="phl-tempnote" id="phl-tnote" data-i18n="tempNote"></div>
      <div class="phl-warn phl-failbadge" id="phl-failbadge" role="alert" hidden></div>
    </aside>

    <main class="phl-main">

    ['b-ca', 'b-cb', 'b-target', 'b-total', 'b-vol'].forEach(function (id) { on(id, 'input', renderBuffer); });
    on('bkind', 'click', function (e) { var b = e.target.closest('button'); if (!b) return; S.buf.kind = b.getAttribute('data-k'); renderBuffer(); });
    on('b-amt', 'input', function () { var v = parsePos($('b-amt'), true, 1e6); S.buf.amt = isFinite(v) ? v : 0; renderBuffer(); });
    on('b-amt-sl', 'input', function () { var v = Number(Number($('b-amt-sl').value).toPrecision(3)); S.buf.amt = v; $('b-amt').value = String(v); setInvalid($('b-amt'), false); renderBuffer(); });
    on('buf-pm', 'click', function (e) { var b = e.target.closest('.phl-chip'); if (b) { S.buf.plot = b.getAttribute('data-pm'); renderBuffer(); } });
    // titration
    on('t-comp', 'change', function () { S.tit.id = $('t-comp').value; var sp = E.titrationSpec(byId(S.tit.id), famOf(byId(S.tit.id))); S.tit.dir = sp.def; S.tit.v = 0; lastTitV = 0; stopPlay(); renderTitration(true); });
    on('t-dir', 'click', function (e) { var b = e.target.closest('button'); if (!b || b.disabled) return; S.tit.dir = b.getAttribute('data-d'); S.tit.v = 0; lastTitV = 0; stopPlay(); renderTitration(true); });
    ['t-ca', 't-va', 't-ct'].forEach(function (id) { on(id, 'input', function () { stopPlay(); renderTitration(true); }); });
    on('t-ind', 'change', function () { S.tit.ind = $('t-ind').value; renderTitration(false); });
    on('t-sl', 'input', function () { stopPlay(); if (curve) setTitVolume(Number($('t-sl').value) / 1000 * curve.vmax); });
    on('t-play', 'click', function () { if (S.tit.playing) stopPlay(); else startPlay(); });
    on('t-reset', 'click', function () { stopPlay(); lastTitV = 0; setTitVolume(0, 'quiet'); });
    on('tit-pm', 'click', function (e) { var b = e.target.closest('.phl-chip'); if (b) { S.tit.plot = b.getAttribute('data-pm'); renderTitration(true); } });
    // scale
    on('s-sl', 'input', function () { S.scale.pH = Number($('s-sl').value); renderScale(); });
    on('s-ev', 'click', function (e) { var b = e.target.closest('.phl-chip'); if (b) { S.scale.pH = Number(b.getAttribute('data-ph')); renderScale(); } });
    var conv = { ph: function (v) { return v; }, poh: function (v) { return 14 - v; }, h: function (v) { return -log10(v); }, oh: function (v) { return 14 + log10(v); } };
    Object.keys(conv).forEach(function (k) {
      on('cv-' + k, 'input', function () { var el = $('cv-' + k), v = E.parseNum(el.value), bad = !isFinite(v) || ((k === 'h' || k === 'oh') && v <= 0); setInvalid(el, bad, (k === 'h' || k === 'oh') ? 'invalid' : 'invalidNum'); if (bad) return; S.scale.pH = conv[k](v); renderScale(el); });
    });
  }

  /* ---------- the real loading screen ---------- */
  function whenVisible(cb) {
    var done = false, test = function () { var r = root.getBoundingClientRect(); if (!done && r.width > 0 && r.height > 0) { done = true; if (ro) ro.disconnect(); cb(); } }, ro = null;
    if (window.ResizeObserver) { ro = new window.ResizeObserver(test); ro.observe(root); }
    test();
  }
  function showCheckStatus() {
    var b = $('failbadge'), f = CACHE && CACHE.checks ? CACHE.checks.failed : [];
    if (!b) return;
    if (!f.length) { b.hidden = true; b.textContent = ''; return; }
    b.hidden = false; b.textContent = PT('failBadge', { k: f.length }) + ' (' + f.slice(0, 4).map(function (x) { return x.name || x; }).join(', ') + (f.length > 4 ? ', \u2026' : '') + ')';
  }
  function startBoot() {
    var skip = /[?&]phl-noboot\b/.test(location.search);
    if (CACHE.ready || skip || !BT) { window.PHLab.ready = true; showCheckStatus(); return; }
    var ov = $('boot'); ov.hidden = false; ov.classList.remove('out');
    root.style.setProperty('--phl-boot-top', ($('top').offsetHeight + 12) + 'px');
    var bm = /[?&]phl-bench=(\d+)/.exec(location.search);
    if (bm && BT.bench) {                                   // on-device measurement: n real start-ups, result shown on screen + console
      var host = $('boot-inner'); host.innerHTML = '<pre style="white-space:pre-wrap;font-size:.8rem;padding:12px" id="phl-bench-out">benchmark \u2026</pre>';
      BT.bench(Math.max(1, Math.min(20, +bm[1])), { T: PT }).then(function (r) {
        $('bench-out').textContent = 'start-up ms: median ' + Math.round(r.startupMedianMs) + ' \u00b7 p95 ' + Math.round(r.startupP95Ms) + ' \u00b7 max ' + Math.round(r.startupMaxMs) + '\nworst frame gap ms: ' + Math.round(r.worstFrameGapMs) + ' (stalls > 100 ms: ' + r.stallsOver100ms + ')\nheaviest unit: ' + r.heaviestUnit + ' ' + r.heaviestUnitMs.toFixed(1) + ' ms\nfailed checks: ' + r.failedChecks + '\nruns (ms): ' + r.runs.map(function (x) { return Math.round(x.elapsedMs); }).join(', ');
        window.PHLab.ready = true; showCheckStatus();
      });
      return;
    }
    BT.run({ T: PT, host: $('boot-inner') }).then(function (r) {
      window.PHLab.bootInfo = r; showCheckStatus();
      setTimeout(function () { ov.classList.add('out'); setTimeout(function () { ov.hidden = true; window.PHLab.ready = true; renderCurrent(); if (beaker) beaker.start(); }, 720); }, 700);
    });
  }

  function init() {
    inApp = !!(window.MultiCalc && window.MultiCalc.modules && window.MultiCalc.modules.loaded);
    if (!inApp) { document.documentElement.classList.add('phl-standalone'); $('lang').hidden = false; var nl = (navigator.language || 'el').slice(0, 2); S.lang = (nl === 'en' || nl === 'es') ? nl : 'el'; }
    window.PHLab = { version: '2.1', checkStatus: showCheckStatus, state: S, refresh: renderCurrent, setTab: setTab, ready: false };
    beaker = new V.Beaker($('beaker')); plotSol = new PL.Plot($('plot-sol')); plotBuf = new PL.Plot($('plot-buf')); plotTit = new PL.Plot($('plot-tit'));
    bind(); applyI18n(); setTab('sol');
    whenVisible(startBoot);
    if (typeof window.navTo === 'function' && !window.navTo.__phl) {
      var orig = window.navTo; window.navTo = function (id) { var r = orig.apply(this, arguments); if (id === ROOT_ID) onEnter(); return r; }; window.navTo.__phl = true;
    }
  }

  // Boot: tolerant of injection order — waits for the screen and every sibling script.
  var tries = 0;
  function boot() {
    root = document.getElementById(ROOT_ID); E = window.PHLabEngine; D = window.PHLabData; X = window.PHLabText; ST = window.PHLabSteps; V = window.PHLabViz; PL = window.PHLabPlot; BT = window.PHLabBoot; CACHE = window.PHLabCache;
    if (!root || !E || !D || !X || !ST || !V || !PL || !BT || !CACHE) { if (tries++ < 300) setTimeout(boot, 50); else if (window.console) console.error('[MODULE-16] dependencies did not load'); return; }
    if (root.__phlInit) return; root.__phlInit = true;
    try { window.MultiCalc = window.MultiCalc || {}; } catch (e) { }
    init();
  }
  boot();
})();
</script>
