<title>MODULE 11 — Themes</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
html{background:#0f172a;min-height:100%;}
body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1a1f3a 100%);min-height:100dvh;min-height:100vh;color:white;overflow-x:hidden;transition:background 0.4s ease;}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
body::before{width:420px;height:420px;background:radial-gradient(circle,rgba(99,102,241,0.09) 0%,transparent 70%);top:-80px;left:-80px;}
body::after{width:360px;height:360px;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);bottom:40px;right:-60px;}
.screen{display:none;padding:20px;padding-bottom:170px;min-height:100dvh;min-height:100vh;position:relative;z-index:1;}
.screen.active{display:block;animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}
@keyframes screenIn{from{opacity:0;transform:scale3d(0.96,0.96,1) translateY(10px);}to{opacity:1;transform:scale3d(1,1,1) translateY(0);}}
.header{text-align:center;padding:40px 20px 20px;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;color:#fff;box-shadow:0 8px 24px rgba(99,102,241,0.3);position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);animation:shimmer 3s infinite;}
@keyframes shimmer{0%{transform:translate(-100%,-100%);}100%{transform:translate(100%,100%);}}
.logo-text{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#fff,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo span{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{color:#94a3b8;font-size:0.95rem;margin-top:5px;}
.back-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#94a3b8;font-size:0.95rem;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);}
.back-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.1);transform:translateX(-3px);}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:rgba(15,23,42,0.3);}::-webkit-scrollbar-thumb{background:rgba(71,85,105,0.5);border-radius:4px;}
.unit-converter-container{max-width:600px;margin:0 auto;background:rgba(15,23,42,0.4);border:1px solid rgba(71,85,105,0.3);border-radius:25px;padding:30px;}
.unit-title{font-size:1.5rem;font-weight:600;margin-bottom:25px;}
/* MODULE 11 */
#theme-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.25s ease;background:#000;}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:600px;margin:20px auto;}
.theme-card{aspect-ratio:16/9;border-radius:15px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s ease;border:3px solid transparent;}
.theme-card:hover{transform:scale(1.05);}
.theme-card.active{border-color:#fbbf24;box-shadow:0 0 20px rgba(251,191,36,0.5);}
.theme-group-header{grid-column:1/-1;font-size:0.78rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:2.5px;padding:10px 4px 6px;border-bottom:1px solid rgba(255,255,255,0.08);margin-top:8px;display:flex;align-items:center;gap:8px;}
.theme-label{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:4px 12px;border-radius:8px;font-size:0.85rem;color:white;white-space:nowrap;}
@media(max-width:600px){.theme-grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
@media(max-width:480px){.screen{padding:15px;padding-bottom:140px;}}

/* ── Light-theme contrast overrides (auto-added) ── */
body.theme-light .back-btn{background:#1e293b;border-color:#334155;color:#f1f5f9;}
body.theme-light .back-btn:hover{background:#334155;border-color:#475569;color:#ffffff;}
body.theme-light .subtitle{color:#475569;}
body.theme-light .logo-text{background:linear-gradient(135deg,#1e293b,#334155);-webkit-background-clip:text;background-clip:text;}
body.theme-light .unit-converter-container{background:rgba(15,23,42,0.88);}
body.theme-light{color:#1e293b;}
body.theme-light .theme-group-header{color:#475569;border-bottom-color:rgba(30,41,59,0.15);}
body.theme-light .theme-label{background:rgba(15,23,42,0.75);}
.theme-tabs{display:flex;gap:10px;margin-bottom:15px;}
.theme-tab{flex:1;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#94a3b8;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s ease;-webkit-tap-highlight-color:transparent;}
.theme-tab.active{background:rgba(99,102,241,0.28);border-color:rgba(99,102,241,0.55);color:#fff;}
.theme-card.live-card .theme-label{display:flex;align-items:center;gap:4px;}
.live-preview{position:absolute;inset:0;background:#02040a;}
.live-preview iframe{width:100%;height:100%;border:0;display:block;pointer-events:none;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#f87171;display:inline-block;box-shadow:0 0 6px #f87171;animation:liveDotPulse 1.4s ease-in-out infinite;}
@keyframes liveDotPulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.theme-card.live-loading{animation:liveLoadPulse 0.9s ease-in-out infinite;filter:saturate(0.5);}
@keyframes liveLoadPulse{0%,100%{opacity:0.55;}50%{opacity:0.9;}}
.theme-card{box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);}
.theme-empty{grid-column:1/-1;text-align:center;color:#94a3b8;font-size:0.9rem;padding:28px 10px;}
body.theme-light .theme-empty{color:#475569;}
.theme-card.active{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(0,0,0,0.75),0 0 20px rgba(251,191,36,0.5);}
.theme-tabs.sub{margin-bottom:12px;}
.theme-tabs.sub .theme-tab{padding:8px;font-size:0.82rem;}
.contrast-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px;}
.contrast-toggle{padding:9px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#94a3b8;font-size:0.85rem;font-weight:600;cursor:pointer;}
.contrast-toggle.active{background:rgba(99,102,241,0.28);border-color:rgba(99,102,241,0.55);color:#fff;}
.contrast-note{font-size:0.78rem;color:#94a3b8;}

/* ═══ § 4 · DATA — LIVE THEMES REGISTRY ═══
   Empty on purpose: the Live tab stays, the live themes are deleted.
   To add one later: { id:'x', label:'🌌 NAME', src:'<full HTML document>' }
   (inside src, write every closing script tag with a backslash: <\/script>). */
const LIVE_THEMES=[];

/* ═══ § 5 · BUILD — lookups ═══
   kind: 'gradient' → 3 stops · 'solid' → 1 color · 'duo' → 2 colors.
   Each theme gets its css background AND a descriptor for the contrast system. */
function themeBg(kind,c){
    if(kind==='solid')return 'linear-gradient(135deg,'+c[0]+','+c[0]+','+c[0]+')';
    if(kind==='duo')return 'linear-gradient('+DUO_ANGLE+'deg,'+c[0]+' 0%,'+c[0]+' 50%,'+c[1]+' 50%,'+c[1]+' 100%)';
    return 'linear-gradient(135deg,'+c.join(',')+')';
}
function themeDesc(kind,c){
    if(kind==='solid')return {flat:c[0]};
    if(kind==='duo')return {angle:DUO_ANGLE,stops:[[c[0],0],[c[0],0.5],[c[1],0.5],[c[1],1]]};
    return {angle:135,stops:c.map(function(x,i){return [x,c.length>1?i/(c.length-1):0];})};
}
const THEME_GROUPS=[
    {tab:'glossy',sub:'',    grid:'glossy-theme-grid',kind:'gradient',cats:GLOSSY_CATEGORIES},
    {tab:'simple',sub:'single',grid:'simple-theme-grid',kind:'solid',   cats:SIMPLE_CATEGORIES},
    {tab:'simple',sub:'duo',   grid:'duo-theme-grid',   kind:'duo',     cats:DUO_CATEGORIES}
];
const themes={};
THEME_GROUPS.forEach(function(g){
    g.cats.forEach(function(c){
        c.themes.forEach(function(t){
            const colors=t.slice(2);
            themes[t[0]]={bg:themeBg(g.kind,colors),desc:themeDesc(g.kind,colors),label:t[1],cat:c.key,tab:g.tab,sub:g.sub};
        });
    });
});
const liveThemeSources={};
LIVE_THEMES.forEach(function(t){liveThemeSources[t.id]=t.src;});

const THEME_UI_TEXT={
    liveEmpty:{el:'Δεν υπάρχουν live themes ακόμα.',en:'No live themes yet.',es:'Aún no hay temas en vivo.'},
    contrast:{el:'Αυτόματη αντίθεση',en:'Auto contrast',es:'Contraste automático'},
    on:{el:'ΕΝΕΡΓΗ',en:'ON',es:'ACTIVO'},
    off:{el:'ΑΝΕΝΕΡΓΗ',en:'OFF',es:'APAGADO'},
    fixes:{el:'διορθώσεις',en:'fixes',es:'ajustes'},
    missing:{el:'το theme-contrast.js δεν φορτώθηκε',en:'theme-contrast.js not loaded',es:'theme-contrast.js no cargado'},
    errors:{el:'σφάλματα',en:'errors',es:'errores'},
    legacy:{el:'ο παλιός guard είναι ενεργός',en:'old guard still active',es:'la guardia antigua sigue activa'}
};
function themeUiText(key){
    let lang='el';
    try{lang=(window.MultiCalc&&window.MultiCalc.state&&window.MultiCalc.state.currentLang)||'el';}catch(e){}
    const o=THEME_UI_TEXT[key];
    return o[lang]||o.el;
}
let currentThemeId='default';

/* ═══ § 6 · UI — grid rendering ═══ */
function markActiveCard(){
    document.querySelectorAll('.theme-card.active').forEach(function(c){c.classList.remove('active');});
    const card=document.getElementById('theme-'+currentThemeId);
    if(card)card.classList.add('active');
}
function renderGrid(g){
    const grid=document.getElementById(g.grid);
    if(!grid)return false;
    grid.textContent='';
    g.cats.forEach(function(c){
        const h=document.createElement('div');
        h.className='theme-group-header';
        h.id='theme-cat-'+g.grid.split('-')[0]+'-'+c.key;
        h.textContent=c.icon+' '+c.name;
        grid.appendChild(h);
        c.themes.forEach(function(t){
            const card=document.createElement('div');
            card.className='theme-card';
            card.id='theme-'+t[0];
            card.style.background=themes[t[0]].bg;
            card.setAttribute('onclick',"setTheme('"+t[0]+"')");
            const lab=document.createElement('span');
            lab.className='theme-label';
            lab.textContent=t[1];
            card.appendChild(lab);
            grid.appendChild(card);
        });
    });
    return true;
}
function renderStaticGrids(){
    let ok=true;
    THEME_GROUPS.forEach(function(g){if(!renderGrid(g))ok=false;});
    markActiveCard();
    return ok;
}
function renderLiveGrid(){
    const grid=document.getElementById('live-theme-grid');
    if(!grid)return false;
    grid.textContent='';
    if(!LIVE_THEMES.length){
        const e=document.createElement('div');
        e.className='theme-empty';
        e.textContent=themeUiText('liveEmpty');
        grid.appendChild(e);
        return true;
    }
    LIVE_THEMES.forEach(function(t){
        const card=document.createElement('div');
        card.className='theme-card live-card';
        card.id='theme-live-'+t.id;
        card.setAttribute('onclick',"setLiveTheme('"+t.id+"')");
        const prev=document.createElement('div');
        prev.className='live-preview';
        prev.id='preview-'+t.id;
        const lab=document.createElement('span');
        lab.className='theme-label';
        const dot=document.createElement('span');
        dot.className='live-dot';
        lab.appendChild(dot);
        lab.appendChild(document.createTextNode(t.label));
        card.appendChild(prev);
        card.appendChild(lab);
        grid.appendChild(card);
    });
    return true;
}

/* ═══ § 7 · APPLY — static themes (glossy / simple / duo) ═══ */
function setTheme(name){
    if(!themes[name])return;
    stopLiveTheme();
    currentThemeId=name;
    const overlay=document.getElementById('theme-overlay');
    function apply(){
        document.body.style.background=themes[name].bg;
        document.documentElement.style.background=themes[name].bg;
        markActiveCard();
        if(overlay)overlay.style.opacity='0';
        if(typeof mcCheckThemeLightness==='function')mcCheckThemeLightness();
        notifyContrast(themes[name].desc);
    }
    if(overlay){overlay.style.opacity='1';setTimeout(apply,200);}
    else apply();
    try{localStorage.setItem('multicalc_theme',name);}catch(e){}
}

/* ═══ § 8 · LIVE — generic engine (no live themes inside) ═══ */
function ensureLiveLayer(){
    let el=document.getElementById('live-theme-layer');
    if(!el){
        el=document.createElement('iframe');
        el.id='live-theme-layer';
        el.title='Live theme background';
        el.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;';
        document.body.appendChild(el);
    }
    return el;
}
function stopLiveTheme(){
    const el=document.getElementById('live-theme-layer');
    if(el)el.remove();
}
function setLiveTheme(id){
    if(!liveThemeSources[id])return;
    unloadLivePreviews();
    currentThemeId='live-'+id;
    document.querySelectorAll('.theme-card.active,.theme-card.live-loading').forEach(function(c){c.classList.remove('active','live-loading');});
    const card=document.getElementById('theme-live-'+id);
    if(card)card.classList.add('active','live-loading');
    try{localStorage.setItem('multicalc_theme','live:'+id);}catch(e){}
    /* Double requestAnimationFrame: the browser paints the card's "loading"
       state BEFORE the heavy iframe mount starts, so the tap feels instant. */
    requestAnimationFrame(function(){
        requestAnimationFrame(function(){
            const el=ensureLiveLayer();
            el.onload=function(){ if(card)card.classList.remove('live-loading'); };
            el.srcdoc=liveThemeSources[id];
            document.body.style.background='#02040a';
            document.documentElement.style.background='#02040a';
            if(typeof mcCheckThemeLightness==='function')mcCheckThemeLightness();
            notifyContrast({flat:'#02040a'});
        });
    });
}
let livePreviewObserver=null;
function loadLivePreviews(){
    if(livePreviewObserver||!LIVE_THEMES.length)return;
    livePreviewObserver=new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
            const holder=entry.target;
            const id=holder.id.replace('preview-','');
            if(entry.isIntersecting){
                if(!holder.firstChild&&liveThemeSources[id]){
                    const f=document.createElement('iframe');
                    f.title=id+' live preview';
                    f.srcdoc=liveThemeSources[id];
                    holder.appendChild(f);
                }
            }else{
                holder.innerHTML='';
            }
        });
    },{root:null,rootMargin:'100px',threshold:0.1});
    Object.keys(liveThemeSources).forEach(function(id){
        const holder=document.getElementById('preview-'+id);
        if(holder)livePreviewObserver.observe(holder);
    });
}
function unloadLivePreviews(){
    if(!livePreviewObserver)return;
    livePreviewObserver.disconnect();
    livePreviewObserver=null;
    Object.keys(liveThemeSources).forEach(function(id){
        const holder=document.getElementById('preview-'+id);
        if(holder)holder.innerHTML='';
    });
}

/* ═══ § 9 · TABS — Glossy / Simple (Single | Duo) / Live ═══ */
function showThemeTab(tab){
    if(tab==='static')tab='glossy';                       /* legacy name */
    const panels={glossy:'panel-glossy',simple:'panel-simple',live:'panel-live'};
    if(!panels[tab])return;
    if(!document.getElementById(panels[tab]))return;
    Object.keys(panels).forEach(function(k){
        const p=document.getElementById(panels[k]),b=document.getElementById('tab-'+k);
        if(p)p.style.display=(k===tab)?'':'none';
        if(b){if(k===tab)b.classList.add('active');else b.classList.remove('active');}
    });
    if(tab==='live'){renderLiveGrid();loadLivePreviews();}
    else unloadLivePreviews();
}
function showSimpleSub(sub){
    const single=document.getElementById('simple-theme-grid'),duo=document.getElementById('duo-theme-grid');
    const bs=document.getElementById('sub-single'),bd=document.getElementById('sub-duo');
    if(!single||!duo)return;
    const isDuo=(sub==='duo');
    single.style.display=isDuo?'none':'';
    duo.style.display=isDuo?'':'none';
    if(bs){if(isDuo)bs.classList.remove('active');else bs.classList.add('active');}
    if(bd){if(isDuo)bd.classList.add('active');else bd.classList.remove('active');}
}

/* ═══ § 10 · CONTRAST — link to theme-contrast.js ═══
   The engine lives in its own file and works on the whole app. If it loads
   later than this script the background is parked in window.__mcContrastPending
   and the engine picks it up when it starts. */
function notifyContrast(desc){
    try{
        if(window.MCContrast&&typeof window.MCContrast.setTheme==='function')window.MCContrast.setTheme(desc);
        else window.__mcContrastPending=desc;
    }catch(e){}
}
function contrastEnabled(){
    if(window.MCContrast&&typeof window.MCContrast.isEnabled==='function')return window.MCContrast.isEnabled();
    try{return localStorage.getItem('multicalc_contrast')!=='off';}catch(e){return true;}
}
function setIfChanged(el,text){if(el.textContent!==text)el.textContent=text;}
function renderContrastRow(){
    const btn=document.getElementById('contrast-toggle'),note=document.getElementById('contrast-note');
    if(!btn||!note)return false;
    const on=contrastEnabled();
    setIfChanged(btn,'🎚️ '+themeUiText('contrast')+': '+themeUiText(on?'on':'off'));
    if(on!==btn.classList.contains('active')){if(on)btn.classList.add('active');else btn.classList.remove('active');}
    let n='';
    if(!window.MCContrast)n=themeUiText('missing');
    else if(on){
        const r=window.MCContrast.report();
        if(r){
            n=r.fixes+' '+themeUiText('fixes')+' · '+r.ms+' ms';
            if(r.errors)n+=' · ⚠ '+r.errors+' '+themeUiText('errors')+(r.firstError?' ('+String(r.firstError).slice(0,40)+')':'');
            if(r.legacy&&r.legacy.gaveUp)n+=' · ⚠ '+themeUiText('legacy');
        }
    }
    setIfChanged(note,n);
    return true;
}
function toggleContrast(){
    const on=contrastEnabled();
    if(window.MCContrast&&typeof window.MCContrast.setEnabled==='function')window.MCContrast.setEnabled(!on);
    else{try{if(on)localStorage.setItem('multicalc_contrast','off');else localStorage.removeItem('multicalc_contrast');}catch(e){}}
    renderContrastRow();
}
let contrastHooked=false;
function hookContrast(){
    if(contrastHooked||!window.MCContrast||typeof window.MCContrast.onPass!=='function')return;
    contrastHooked=true;
    window.MCContrast.onPass(function(){renderContrastRow();});
}

/* ═══ § 11 · BOOT ═══
   In-app this script can run before the screen is injected and the module's
   own DOMContentLoaded never fires, so the UI is rendered with a short retry. */
function applySavedTheme(){
    try{
        const s=localStorage.getItem('multicalc_theme');
        if(!s)return;
        if(s.indexOf('live:')===0){
            const id=s.slice(5);
            if(liveThemeSources[id]){setLiveTheme(id);showThemeTab('live');}
            else localStorage.removeItem('multicalc_theme');   /* saved live theme no longer exists */
        }else if(themes[s]){
            setTheme(s);
        }
    }catch(e){}
}
function bootThemesUI(tries){
    hookContrast();
    if(renderStaticGrids()&&renderLiveGrid()&&renderContrastRow()){
        try{
            const s=localStorage.getItem('multicalc_theme');
            if(s&&themes[s]){showThemeTab(themes[s].tab);if(themes[s].sub)showSimpleSub(themes[s].sub);}
        }catch(e){}
        return;
    }
    if(tries>0)setTimeout(function(){bootThemesUI(tries-1);},50);
}
applySavedTheme();
bootThemesUI(60);
