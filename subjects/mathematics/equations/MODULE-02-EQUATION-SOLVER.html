/* ── Generic Gaussian elimination with partial pivoting — small
   (≤8×8) systems only, used to recover a polynomial's own
   coefficients below. Returns null on a singular/near-singular
   system rather than dividing by a near-zero pivot. ── */
function gaussSolve(Ain, bin) {
    var n=bin.length;
    var A=Ain.map(function(r){return r.slice();}), b=bin.slice();
    for (var col=0; col<n; col++) {
        var piv=col;
        for (var r=col+1;r<n;r++) if (Math.abs(A[r][col])>Math.abs(A[piv][col])) piv=r;
        if (Math.abs(A[piv][col])<1e-9) return null;
        if (piv!==col) { var tmp=A[piv];A[piv]=A[col];A[col]=tmp; var tb=b[piv];b[piv]=b[col];b[col]=tb; }
        for (var r2=col+1;r2<n;r2++) {
            var factor=A[r2][col]/A[col][col];
            if (factor===0) continue;
            for (var c2=col;c2<n;c2++) A[r2][c2]-=factor*A[col][c2];
            b[r2]-=factor*b[col];
        }
    }
    var x=new Array(n);
    for (var i=n-1;i>=0;i--) {
        var s=b[i];
        for (var j=i+1;j<n;j++) s-=A[i][j]*x[j];
        x[i]=s/A[i][i];
    }
    return x;
}

/* Recovers a polynomial's own coefficients (highest-degree-first),
   generalizing extractCubicCoeffs above to any degree up to maxDeg.
   Fits a candidate degree d via a Vandermonde solve on d+1 sample
   points, then — because a polynomial with several small integer
   roots near the origin (a common textbook pattern, e.g.
   x(x-1)(x+1)(x-2)(x+2)) can make a WRONG lower degree look correct
   if only 1-2 neighboring points are checked — validates that fit
   against every integer across a wide band before accepting it.
   Returns the smallest degree that survives. */
function extractPolyCoeffs(fn, maxDeg) {
    maxDeg = maxDeg || 7;
    var checkRange = maxDeg + 3;
    for (var d=1; d<=maxDeg; d++) {
        var half=Math.ceil(d/2);
        var xs=[]; for (var k=-half; xs.length<d+1; k++) xs.push(k);
        var A=[], b=[], ok=true;
        xs.forEach(function(xv){
            var row=[]; for (var p=d;p>=0;p--) row.push(Math.pow(xv,p));
            A.push(row);
            var fv=fn(xv);
            if (!isFinite(fv)) ok=false;
            b.push(fv);
        });
        if (!ok) continue;
        var coeffs=gaussSolve(A,b);
        if (!coeffs) continue;
        var allMatch=true;
        for (var vx=-checkRange; vx<=checkRange && allMatch; vx++) {
            var act=fn(vx);
            if (!isFinite(act)) continue;
            var pred=evalPolyArr(coeffs,vx);
            var tol=1e-4*Math.max(1,Math.abs(act));
            if (!isFinite(pred) || Math.abs(pred-act)>tol) allMatch=false;
        }
        if (allMatch) {
            while (coeffs.length>1 && Math.abs(coeffs[0])<1e-6*Math.max(1,Math.abs(coeffs[1]||1))) coeffs.shift();
            return {valid:true, degree:coeffs.length-1, coeffs:coeffs};
        }
    }
    return {valid:false};
}

/* Synthetic division by (x−root) for a coefficient array of any
   length (highest-degree-first) — generalizes the by-hand deflation
   already used for cubics (there, folded directly into
   completeCubicRoots) to arbitrary degree. */
function syntheticDivideGeneral(coeffs, root) {
    var n=coeffs.length, out=[coeffs[0]];
    for (var i=1;i<n-1;i++) out.push(coeffs[i]+out[i-1]*root);
    var remainder = coeffs[n-1]+out[n-2]*root;
    return {quotient:out, remainder:remainder};
}

function fmtCoeffList(coeffs) { return coeffs.map(fmtNum).join(', '); }

/* Method 2 for Polynomial: Rational Root Theorem, generalized from
   Cubic's version to any recovered degree. Entirely self-contained
   (works straight from fn via extractPolyCoeffs) — knownRoots is used
   ONLY for the final match-confirmation line, so this is a genuine
   second way of finding a root, not a restatement of Method 1. */
function buildPolyRRTAltSteps(fn, knownRoots) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    var r=extractPolyCoeffs(fn,7);
    alt.push({ title:TT(NT('polyalt_step1_title')), why:NT('polyalt_step1_why'),
        work: r.valid ? fillTpl(NT('polyalt_model_found'),{deg:r.degree,coeffs:fmtCoeffList(r.coeffs)}) : NT('polyalt_not_applicable') });
    if (!r.valid) return alt;

    var lead=r.coeffs[0], cst=r.coeffs[r.coeffs.length-1];
    if (!isNearInt(lead) || !isNearInt(cst) || Math.round(lead)===0) {
        alt.push({ title:'', why:'', work: NT('polyalt_not_integer') });
        return alt;
    }

    var cands=rationalRootCandidates(Math.round(lead), Math.round(cst));
    var displayCands=cands.slice(0,10);
    var found=null;
    for (var i=0;i<cands.length;i++){ if (Math.abs(evalPolyArr(r.coeffs,cands[i]))<1e-4) { found=cands[i]; break; } }
    var candWork=fillTpl(NT('polyalt_candidates_lead'), {list: displayCands.map(fmtNum).join(', ')+(cands.length>displayCands.length?', …':'')});
    alt.push({ title:TT(NT('polyalt_step2_title')), why:NT('polyalt_step2_why'), work: candWork });

    if (found===null) {
        alt.push({ title:'', why:'', work: NT('polyalt_no_rational') });
        return alt;
    }

    var sd=syntheticDivideGeneral(r.coeffs, found);
    alt.push({ title:TT(NT('polyalt_step3_title')), why:NT('polyalt_step3_why'),
        work: fillTpl(NT('polyalt_found_lead'),{r:fmtNum(found)})+'<br>'+fmtCoeffList(sd.quotient)+' (deg '+(sd.quotient.length-1)+')' });

    var matchOk=knownRoots.some(function(kr){return Math.abs(kr-found)<1e-3;});
    alt.push({ title:'', why:'', work: matchOk?NT('polyalt_match_ok'):'' });
    return alt;
}

function solvePolynomial(input,result) {
    var p=splitOnOp(input); if(!p) throw new Error('bad_poly');
    var fn=function(x){try{return safeEval(p.left,x)-safeEval(p.right,x);}catch(e){return NaN;}};

    if (p.op !== '=') {
        var criticalP=findFunctionCriticalPoints(fn,-500,500,0.1);
        var segsP=buildSignChartSegments(fn,criticalP,p.op);
        var intervalP=formatIntervalUnion(segsP, T('eqNoSolutionSet'));
        var rootsP=criticalP.filter(function(c){return c.kind==='root';});
        var htmlP='<div class="eq-answer">'+T('eqPolyIneqTitle')+'</div>';
        htmlP+='<div class="eq-answer">'+intervalP+'</div>';
        if (rootsP.length) htmlP+='<div class="eq-block">'+T('eq_roots')+': '+KX(rootsP.map(function(r,i){return 'x_'+(i+1)+'='+fmtNumTex(r.x);}).join(',\\ '))+'</div>';
        var polyIneqMain=buildGenericIneqTutorSteps('poly', fn, criticalP, p.op, p.left, p.right);
        var polyIneqAlt=buildPolyRRTAltSteps(fn, rootsP.map(function(r){return r.x;}));
        displaySteps(polyIneqMain, polyIneqAlt, NT('polyalt_title'), NT('polyalt_intro'));
        result.innerHTML=htmlP; revealEqResult(result);
        hideEqPlot();
        return;
    }

    var dfn=makeNumericDeriv(fn);
    var roots=[];
    var scan=function(from,to,step){
        for(var x=from;x<to;x+=step){
            var y1=fn(x),y2=fn(x+step);
            if(isFinite(y1)&&isFinite(y2)&&y1*y2<0){
                var r=x+step/2;
                for(var i=0;i<60;i++){var fv=fn(r),d=dfn(r);if(Math.abs(fv)<1e-12)break;if(Math.abs(d)<1e-14)break;r-=fv/d;}
                r=Math.round(r*1e9)/1e9;
                if(isFinite(r)&&roots.every(function(e){return Math.abs(e-r)>1e-5;})) roots.push(r);
            }
        }
    };
    scan(-50,50,0.05); scan(-500,-50,0.5); scan(50,500,0.5);
    if(!roots.length){
        displaySteps(buildNumericNoRootSteps('poly', p.left, p.right, '='));
        result.innerHTML='<div class="eq-answer eq-nosol">'+(T('eqPolyNoSol')||'No real roots found')+'</div><div class="eq-block">'+(T('eqPolyOnlyComplex')||'Only complex roots.')+'</div>';revealEqResult(result);return;
    }
    roots.sort(function(a,b){return a-b;});
    var polyMain=buildNumericEqTutorSteps('poly', fn, p.left, p.right, '=', roots, [], verifyFmt);
    var polyAlt=buildPolyRRTAltSteps(fn, roots);
    displaySteps(polyMain, polyAlt, NT('polyalt_title'), NT('polyalt_intro'));
    var titleFn=T('eqPolyTitle');
    var html='<div class="eq-answer">'+(typeof titleFn==='function'?titleFn(roots.length):(titleFn||'Found '+roots.length+' root(s)'))+'</div>';
    roots.forEach(function(r,i){html+='<div class="eq-answer">'+KX((roots.length>1?'x_'+(i+1):'x')+' = '+fmtNumTex(r),true)+'</div>';});
    html+='<div class="eq-block"><small>'+(T('eqPolyMethod')||'Newton-Raphson')+'</small></div>';
    finishEqResult(result, html);
    plotEquation(p.left,p.right);
}

/* ── Parametric (λ) linear equations ──────────────────────────
   Solves A(λ)x + B(λ) = 0 where A and B are recovered numerically
   (no symbolic parsing) — same finite-difference approach as
   extractCubicCoeffs(), extended to two variables. For a fixed λ the
   equation must be linear in x, so A(λ),B(λ) come from 2 x-samples.
   A(λ),B(λ) themselves are allowed up to QUADRATIC in λ — plain-
   linear coefficients cover most textbook problems, but the classic
   identity-producing pattern "(λ-1)x = λ² - 1" needs a quadratic
   B(λ), and a quadratic A(λ) can legitimately produce two critical λ
   values (e.g. "(λ²-1)x = λ-1"). A 4th sample point cross-checks the
   fit and flags anything of genuinely higher degree (or non-
   polynomial, like sin(λ)) as unsupported rather than guessing. ── */
function safeEvalParam(expr, xv, lv) {
    var s = expr
        .replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**')
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/(\d)(x)/g,'$1*$2').replace(/(\d)(λ)/g,'$1*$2')
        .replace(/x/g,'('+xv+')').replace(/λ/g,'('+lv+')');
    return Function('"use strict"; return (' + fixImplicitMult(s) + ')')();
}

function fitQuadratic(f0,f1,f2) {
    var c0=f0, c2=(f2-2*f1+f0)/2, c1=(f1-f0)-c2;
    return {c2:c2,c1:c1,c0:c0};
}

function evalPoly2(co,lam){ return co.c2*lam*lam+co.c1*lam+co.c0; }

function extractParamModel(p) {
    function evalDiff(xv,lv){ return safeEvalParam(p.left,xv,lv)-safeEvalParam(p.right,xv,lv); }
    function AB(lv){ var f0=evalDiff(0,lv), f1=evalDiff(1,lv); return {A:f1-f0, B:f0}; }
    var s0=AB(0), s1=AB(1), s2=AB(2);
    var Ac=fitQuadratic(s0.A,s1.A,s2.A), Bc=fitQuadratic(s0.B,s1.B,s2.B);
    var s3=AB(3);
    var predA3=evalPoly2(Ac,3), predB3=evalPoly2(Bc,3);
    var tolA=1e-6*Math.max(1,Math.abs(s3.A)), tolB=1e-6*Math.max(1,Math.abs(s3.B));
    var valid=Math.abs(predA3-s3.A)<tolA && Math.abs(predB3-s3.B)<tolB;
    return {A:Ac, B:Bc, valid:valid};
}

/* Formats c2λ²+c1λ+c0 as LaTeX, omitting zero terms and 1/-1 coefficients. */
function fmtPoly2Lambda(co) {
    var c2=co.c2,c1=co.c1,c0=co.c0, terms=[];
    if (Math.abs(c2)>1e-9) {
        if (Math.abs(c2-1)<1e-9) terms.push('\\lambda^2');
        else if (Math.abs(c2+1)<1e-9) terms.push('-\\lambda^2');
        else terms.push(fmtNumTex(c2)+'\\lambda^2');
    }
    if (Math.abs(c1)>1e-9) {
        var piece;
        if (Math.abs(c1-1)<1e-9) piece='\\lambda';
        else if (Math.abs(c1+1)<1e-9) piece='-\\lambda';
        else piece=fmtNumTex(c1)+'\\lambda';
        if (terms.length && piece[0]!=='-') terms.push(' + '+piece);
        else if (terms.length) terms.push(' '+piece);
        else terms.push(piece);
    }
    if (Math.abs(c0)>1e-9 || terms.length===0) {
        if (terms.length===0) terms.push(fmtNumTex(c0));
        else terms.push((c0>=0?' + ':' - ')+fmtNumTex(Math.abs(c0)));
    }
    return terms.join('');
}

/* Real λ roots of c2λ²+c1λ+c0=0 (0, 1, or 2 of them), ascending. */
function findCriticalLambdas(co) {
    var c2=co.c2,c1=co.c1,c0=co.c0;
    if (Math.abs(c2)<1e-9) {
        if (Math.abs(c1)<1e-9) return [];
        return [-c0/c1];
    }
    var disc=c1*c1-4*c2*c0;
    if (disc<-1e-9) return [];
    disc=Math.max(disc,0);
    var sq=Math.sqrt(disc), r1=(-c1+sq)/(2*c2), r2=(-c1-sq)/(2*c2);
    if (Math.abs(r1-r2)<1e-9) return [r1];
    return r1<r2 ? [r1,r2] : [r2,r1];
}

var _paramState = null;

/* ── Parametric (λ) tutor-mode helpers ──────────────────────────
   Tutor-step 'work' fields never use KX()/LaTeX anywhere else in this
   file (only the main answer HTML does), so fmtPoly2Lambda/
   fmtPolyLambda above — which emit \lambda LaTeX source — aren't
   reusable inside a step card without rendering raw backslash-commands
   as literal text. These plain-text twins mirror them exactly (same
   coefficient logic) but with a literal λ/λ² character and fmtNum
   instead of fmtNumTex, matching every other tutor step's plain-text
   style. */
function fmtPoly2LambdaPlain(co) {
    var c2=co.c2,c1=co.c1,c0=co.c0, terms=[];
    if (Math.abs(c2)>1e-9) {
        if (Math.abs(c2-1)<1e-9) terms.push('λ²');
        else if (Math.abs(c2+1)<1e-9) terms.push('-λ²');
        else terms.push(fmtNum(c2)+'λ²');
    }
    if (Math.abs(c1)>1e-9) {
        var piece;
        if (Math.abs(c1-1)<1e-9) piece='λ';
        else if (Math.abs(c1+1)<1e-9) piece='-λ';
        else piece=fmtNum(c1)+'λ';
        if (terms.length && piece[0]!=='-') terms.push(' + '+piece);
        else if (terms.length) terms.push(' '+piece);
        else terms.push(piece);
    }
    if (Math.abs(c0)>1e-9 || terms.length===0) {
        if (terms.length===0) terms.push(fmtNum(c0));
        else terms.push((c0>=0?' + ':' - ')+fmtNum(Math.abs(c0)));
    }
    return terms.join('');
}

/* Picks a handful of "nice" concrete λ values that avoid the critical
   set, for Method 2's worked examples below. */
function pickConcreteLambdas(criticals, count) {
    var picks=[], candidates=[0,1,2,-1,3,-2,4,-3,5,-4];
    for (var i=0;i<candidates.length && picks.length<count;i++) {
        var lam=candidates[i];
        var isCritical=criticals.some(function(c){return Math.abs(c-lam)<1e-6;});
        if (!isCritical) picks.push(lam);
    }
    return picks;
}
/* Substitutes a concrete λ value into an expression string for DISPLAY
   purposes only (showing the student the resulting concrete equation)
   — separate from safeEvalParam's internal numeric substitution. */
function fillLambdaLiteral(expr, lam) { return expr.replace(/λ/g, '('+fmtNum(lam)+')'); }
/* verifyFmt-equivalent for parametric equations: safeEval has no
   notion of λ, so — same reasoning as trigVerifyFmt/absVerifyFmt
   elsewhere in this file — this evaluates both sides directly via
   safeEvalParam(expr, x, λ) at a fixed, already-substituted λ. */
function paramVerifyFmt(left, right, xv, lam) {
    try {
        var lv=safeEvalParam(left,xv,lam), rv=safeEvalParam(right,xv,lam);
        var ok=Math.abs(lv-rv)<1e-6;
        return '<span class="'+(ok?'eq-check':'eq-warn')+'">'+(ok?'✓':'≈')+' '+(T('verification')||'Verification')+': '+parseFloat(lv.toFixed(6))+' = '+parseFloat(rv.toFixed(6))+'</span>';
    } catch(e){ return ''; }
}

/* Method 1: standard form, when a unique solution exists, the
   critical-λ case analysis, the general formula, then a concrete-value
   verification (which doubles as the worked example Method 2 below
   builds on). */
function buildParamLinearTutorSteps(p, A, B, criticals) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(PT('step1_title')), why:PT('step1_why'), work: p.left+' = '+p.right });
    main.push({ title:TT(PT('step2_title')), why:PT('step2_why'),
        work: '('+fmtPoly2LambdaPlain(A)+')x + ('+fmtPoly2LambdaPlain(B)+') = 0' });
    main.push({ title:TT(PT('step3_title')), why:PT('step3_why'), work:'' });

    if (!criticals.length) {
        main.push({ title:TT(PT('step4_title')), why:PT('step4_why'), work: PT('step4_none') });
    } else {
        main.push({ title:TT(PT('step4_title')), why:PT('step4_why'),
            work: criticals.map(function(lc){return 'λ = '+fmtNum(lc);}).join(',&nbsp;&nbsp;') });
        var caseWork=criticals.map(function(lc){
            var Bval=evalPoly2(B,lc);
            var kind=Math.abs(Bval)<1e-6 ? T('eqIdentityTrue') : T('eqParamImpossible');
            return 'λ = '+fmtNum(lc)+':&nbsp; '+kind;
        }).join('<br>');
        main.push({ title:TT(PT('step5_title')), why:PT('step5_why'), work: caseWork });
    }

    main.push({ title:TT(PT('step6_title')), why:PT('step6_why'),
        work: 'x(λ) = −('+fmtPoly2LambdaPlain(B)+') / ('+fmtPoly2LambdaPlain(A)+')' });

    var picks=pickConcreteLambdas(criticals,1);
    if (picks.length) {
        var lam=picks[0];
        var Aval=evalPoly2(A,lam), Bval=evalPoly2(B,lam), xAt=-Bval/Aval;
        main.push({ title:TT(PT('step7_title')), why:PT('step7_why'),
            work: 'λ = '+fmtNum(lam)+':&nbsp; x = −('+fmtNum(Bval)+')/('+fmtNum(Aval)+') = '+fmtNum(xAt)+'<br>'+paramVerifyFmt(p.left,p.right,xAt,lam) });
    }
    return main;
}

/* Method 2: instead of deriving A(λ),B(λ) symbolically for every λ at
   once, pick a couple of concrete, non-critical λ values and solve the
   resulting ordinary linear equation the normal way — genuinely
   re-deriving A,B by evaluating the ORIGINAL expression at that fixed
   λ (via safeEvalParam), not by reading off the already-fitted
   A(λ)/B(λ) model — so a match against the general formula is a real
   independent cross-check, not a tautology. */
function buildParamConcreteAltSteps(p, A, B, criticals) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var picks=pickConcreteLambdas(criticals, 2);
    var alt=[];
    picks.forEach(function(lam){
        var f0=safeEvalParam(p.left,0,lam)-safeEvalParam(p.right,0,lam);
        var f1=safeEvalParam(p.left,1,lam)-safeEvalParam(p.right,1,lam);
        var Adir=f1-f0, Bdir=f0;
        var xDir = Math.abs(Adir)>1e-9 ? -Bdir/Adir : null;
        var subLeft=fillLambdaLiteral(p.left,lam), subRight=fillLambdaLiteral(p.right,lam);
        var work = subLeft+' = '+subRight+'&nbsp;&nbsp;→&nbsp;&nbsp;'+fmtNum(Adir)+'x + ('+fmtNum(Bdir)+') = 0';
        if (xDir!==null) work += '&nbsp;&nbsp;→&nbsp;&nbsp;x = '+fmtNum(xDir)+'<br>'+paramVerifyFmt(p.left,p.right,xDir,lam);
        alt.push({ title:TT(fillTpl(PT('alt_step_title'),{lam:fmtNum(lam)})), why:fillTpl(PT('alt_step_why'),{lam:fmtNum(lam)}), work: work });
        if (xDir!==null) {
            var general=-evalPoly2(B,lam)/evalPoly2(A,lam);
            var matchOk=Math.abs(xDir-general)<1e-4;
            alt.push({ title:'', why:'', work: matchOk?fillTpl(PT('alt_match_ok'),{lam:fmtNum(lam)}):'' });
        }
    });
    return alt;
}

function solveParametric(input, result) {
    var p=splitOnOp(input);
    if (!p || p.op!=='=') {
        showEqWarning(result, 'eqParamOnlyEquation');
        _paramState=null; _paramQuadState=null; return;
    }

    /* Try the quadratic-in-x model first. If it fits AND a(λ) isn't
       identically zero, this really is a quadratic-in-x parametric
       equation — hand off entirely to the quadratic branch. If a(λ)
       IS identically zero, the equation is genuinely linear-in-x, so
       reuse b(λ),c(λ) as this (unchanged) branch's A(λ),B(λ) rather
       than re-deriving them with a second finite-difference pass. */
    var quadModel;
    try { quadModel=extractParamModelQuad(p); } catch(e) { quadModel={valid:false}; }
    var quadAIsZeroPoly = quadModel.valid && Math.abs(quadModel.a.c2)<1e-9 && Math.abs(quadModel.a.c1)<1e-9 && Math.abs(quadModel.a.c0)<1e-9;

    if (quadModel.valid && !quadAIsZeroPoly) {
        _paramState=null;
        solveParametricQuadX(p, quadModel, result);
        return;
    }

    var model;
    if (quadModel.valid && quadAIsZeroPoly) {
        model = {A:quadModel.b, B:quadModel.c, valid:true};
    } else {
        try { model=extractParamModel(p); } catch(e) { model={valid:false}; }
    }
    if (!model.valid) {
        showEqWarning(result, 'eqParamNotSupported');
        _paramState=null; _paramQuadState=null; return;
    }

    var A=model.A, B=model.B;
    var html='<div class="eq-answer">'+T('eqParamTitle')+'</div>';
    html+='<div class="eq-block">'+KX('\\left('+fmtPoly2Lambda(A)+'\\right)\\cdot x + \\left('+fmtPoly2Lambda(B)+'\\right) = 0')+'</div>';

    var aIsZeroPoly = Math.abs(A.c2)<1e-9 && Math.abs(A.c1)<1e-9 && Math.abs(A.c0)<1e-9;
    var aIsConstant = Math.abs(A.c2)<1e-9 && Math.abs(A.c1)<1e-9;

    if (aIsZeroPoly) {
        var bIsZeroPoly = Math.abs(B.c2)<1e-9 && Math.abs(B.c1)<1e-9 && Math.abs(B.c0)<1e-9;
        html += '<div class="eq-block'+(bIsZeroPoly?'':' eq-warn')+'">'+(bIsZeroPoly?T('eqParamNoXAlwaysIdentity'):T('eqParamNoXTerm'))+'</div>';
        finishEqResult(result, html);
        _paramState=null; _paramQuadState=null; return;
    }

    var criticals = aIsConstant ? [] : findCriticalLambdas(A);
    var generalFormula = 'x(\\lambda) = \\dfrac{-\\left('+fmtPoly2Lambda(B)+'\\right)}{'+fmtPoly2Lambda(A)+'}';

    if (!criticals.length) {
        html += '<div class="eq-block">'+T('eqParamAlwaysUnique')+': '+KX(generalFormula)+'</div>';
    } else {
        criticals.forEach(function(lc){
            var Bval=evalPoly2(B,lc);
            var kind = Math.abs(Bval)<1e-6 ? T('eqIdentityTrue') : T('eqParamImpossible');
            html += '<div class="eq-block">'+T('eqParamSpecialCase')+' ('+KX('\\lambda = '+fmtNumTex(lc))+'): '+kind+'</div>';
        });
        var exclList = criticals.map(function(lc){return fmtNumTex(lc);}).join(',\\ ');
        html += '<div class="eq-block">'+T('eqParamGeneralCase')+' ('+KX('\\lambda \\notin \\{'+exclList+'\\}')+'): '+KX(generalFormula)+'</div>';
    }

    var sliderMin,sliderMax,sliderDefault;
    if (criticals.length) {
        sliderMin=Math.round((Math.min.apply(null,criticals)-5)*10)/10;
        sliderMax=Math.round((Math.max.apply(null,criticals)+5)*10)/10;
        sliderDefault=criticals[0];
    } else {
        sliderMin=-10; sliderMax=10; sliderDefault=0;
    }

    html += '<div class="eq-block eq-slider-block">';
    html += '<div class="eq-muted-label">'+T('eqParamSliderLabel')+' — λ = <strong id="param-lambda-value">'+fmtNum(sliderDefault)+'</strong></div>';
    html += '<input type="range" id="param-lambda-slider" min="'+sliderMin+'" max="'+sliderMax+'" step="0.1" value="'+sliderDefault+'" oninput="updateParamLive(this.value)" class="eq-range">';
    html += '<div id="param-live-readout" class="eq-slider-readout"></div>';
    html += '</div>';

    var paramMain=buildParamLinearTutorSteps(p, A, B, criticals);
    var paramAlt=buildParamConcreteAltSteps(p, A, B, criticals);
    displaySteps(paramMain, paramAlt, PT('alt_title'), PT('alt_intro'));
    finishEqResult(result, html);

    _paramState={A:A,B:B}; _paramQuadState=null;
    updateParamLive(sliderDefault);
}

function updateParamLive(lamStr) {
    var ps=_paramState; if (!ps) return;
    var lam=parseFloat(lamStr);
    var labelEl=document.getElementById('param-lambda-value');
    if (labelEl) labelEl.textContent=fmtNum(lam);
    var readout=document.getElementById('param-live-readout');
    if (!readout) return;
    var Aval=evalPoly2(ps.A,lam), Bval=evalPoly2(ps.B,lam);
    if (Math.abs(Aval)<1e-6) {
        if (Math.abs(Bval)<1e-6) {
            readout.className='eq-block';
            readout.innerHTML=T('eqIdentityTrue');
        } else {
            readout.className='eq-block eq-warn';
            readout.innerHTML='⚠️ '+T('eqParamImpossible');
        }
    } else {
        readout.className='eq-block';
        readout.innerHTML=KX('x = '+fmtNumTex(-Bval/Aval),true);
    }
}
/* ── Parametric (λ) quadratic-in-x equations ──────────────────
   Extends the linear-in-x feature above to a(λ)x² + b(λ)x + c(λ) = 0,
   with a,b,c each recovered up to quadratic in λ (same finite-
   difference approach, one level deeper). solveParametric() below
   dispatches here only when a(λ) is genuinely non-zero; if a(λ)≡0 it
   falls back to the linear branch above unchanged, reusing b(λ),c(λ)
   as that branch's A(λ),B(λ).
   Δ(λ)=b(λ)²−4a(λ)c(λ) is degree ≤4 in λ, so its real roots need a
   real quartic root-finder, not the quadratic formula. A plain sign-
   change scan (as used elsewhere, e.g. solvePolynomial) misses a
   root where Δ(λ) only *touches* zero without crossing — a perfect-
   square family like x²+2λx+λ²=0 has Δ(λ)≡0 for every λ. realRootsPoly
   instead finds the derivative's real roots first (recursing to the
   closed-form quadratic) and tests those directly for a touching
   zero, so it can't miss an even-multiplicity root the way a plain
   scan can. ── */
function evalPolyArr(coeffs, x) {
    var v=0;
    for (var i=0;i<coeffs.length;i++) v=v*x+coeffs[i];
    return v;
}
function cauchyBoundPoly(coeffs) {
    var lead=coeffs[0], maxRatio=0;
    for (var i=1;i<coeffs.length;i++) maxRatio=Math.max(maxRatio,Math.abs(coeffs[i]/lead));
    return 1+maxRatio;
}
function bisectPoly(coeffs, lo, hi, flo) {
    for (var i=0;i<80;i++) {
        var mid=(lo+hi)/2, fm=evalPolyArr(coeffs,mid);
        if (Math.abs(fm)<1e-13) return mid;
        if ((flo<0)===(fm<0)) { lo=mid; flo=fm; } else { hi=mid; }
    }
    return (lo+hi)/2;
}
/* Real roots of a degree≤4 polynomial (coeffs highest-degree-first),
   found via the derivative's own real roots rather than a plain
   scan — see the comment block above for why that matters here. */
function realRootsPoly(coeffsIn) {
    var coeffs=coeffsIn.slice();
    while (coeffs.length>1 && Math.abs(coeffs[0])<1e-12) coeffs.shift();
    var deg=coeffs.length-1;
    if (deg<=0) return [];
    if (deg===1) return [-coeffs[1]/coeffs[0]];
    if (deg===2) {
        var a=coeffs[0],b=coeffs[1],c=coeffs[2], disc=b*b-4*a*c;
        var scale=Math.max(1,a*a,b*b,c*c);
        if (disc<-1e-9*scale) return [];
        disc=Math.max(disc,0);
        var sq=Math.sqrt(disc), r1=(-b+sq)/(2*a), r2=(-b-sq)/(2*a);
        if (Math.abs(r1-r2)<1e-6*Math.max(1,Math.abs(r1))) return [(r1+r2)/2];
        return r1<r2?[r1,r2]:[r2,r1];
    }
    var deriv=[];
    for (var i=0;i<deg;i++) deriv.push(coeffs[i]*(deg-i));
    var crit=realRootsPoly(deriv).sort(function(x,y){return x-y;});
    var B=cauchyBoundPoly(coeffs);
    var bounds=[-B].concat(crit).concat([B]);
    var roots=[];
    function addRoot(r){ if (roots.every(function(e){return Math.abs(e-r)>1e-6*Math.max(1,Math.abs(r));})) roots.push(r); }
    crit.forEach(function(cp){
        var v=evalPolyArr(coeffs,cp), scale=Math.max(1,Math.abs(cp));
        if (Math.abs(v)<1e-6*scale) addRoot(cp);
    });
    for (var k=0;k<bounds.length-1;k++){
        var lo=bounds[k], hi=bounds[k+1];
        var flo=evalPolyArr(coeffs,lo), fhi=evalPolyArr(coeffs,hi);
        if (!isFinite(flo)||!isFinite(fhi)) continue;
        if (Math.abs(flo)<1e-13) { addRoot(lo); continue; }
        if (Math.abs(fhi)<1e-13) { addRoot(hi); continue; }
        if ((flo<0)!==(fhi<0)) addRoot(bisectPoly(coeffs,lo,hi,flo));
    }
    roots.sort(function(x,y){return x-y;});
    return roots;
}

/* Multiplies two λ-quadratics {c2,c1,c0}; returns [λ⁴,λ³,λ²,λ¹,λ⁰]. */
function polyMulQuad(P,Q) {
    return [P.c2*Q.c2, P.c2*Q.c1+P.c1*Q.c2, P.c2*Q.c0+P.c1*Q.c1+P.c0*Q.c2, P.c1*Q.c0+P.c0*Q.c1, P.c0*Q.c0];
}
function computeDeltaCoeffs(a,b,c) {
    var bb=polyMulQuad(b,b), ac=polyMulQuad(a,c), delta=[];
    for (var i=0;i<5;i++) delta.push(bb[i]-4*ac[i]);
    return delta;
}
/* Formats a polynomial-in-λ of any degree as LaTeX (coeffs highest-
   degree-first) — generalizes fmtPoly2Lambda above for Δ(λ), which
   is degree ≤4 rather than exactly 2. */
function fmtPolyLambda(coeffs) {
    var deg=coeffs.length-1, terms=[];
    for (var i=0;i<coeffs.length;i++) {
        var coef=coeffs[i], power=deg-i;
        if (Math.abs(coef)<1e-9) continue;
        var isFirst=terms.length===0;
        var sign=coef<0?(isFirst?'-':' - '):(isFirst?'':' + ');
        var mag=Math.abs(coef);
        var varPart=power===0?'':(power===1?'\\lambda':'\\lambda^'+power);
        var magPart=(Math.abs(mag-1)<1e-9 && power!==0)?'':fmtNumTex(mag);
        terms.push(sign+magPart+varPart);
    }
    return terms.length?terms.join(''):fmtNumTex(0);
}

/* The per-λ (a,b,c) fit used by extractParamModelQuad below, pulled
   out as its own function so Method 2 (buildParamQuadConcreteAltSteps
   further down) can reuse the EXACT same "sample the original
   expression at x=0,1,2,3, fit a quadratic, validate against the 4th
   point" procedure at one concrete λ — genuinely independent of the
   already-fitted a(λ)/b(λ)/c(λ) model, since it goes back to
   safeEvalParam directly, not to the fitted polynomials. */
function paramQuadCoeffsAtLambda(p, lv) {
    function evalDiff(xv){ return safeEvalParam(p.left,xv,lv)-safeEvalParam(p.right,xv,lv); }
    var f0=evalDiff(0), f1=evalDiff(1), f2=evalDiff(2);
    var fit=fitQuadratic(f0,f1,f2);
    var f3=evalDiff(3), pred3=fit.c2*9+fit.c1*3+fit.c0;
    var tol=1e-6*Math.max(1,Math.abs(f3));
    return {a:fit.c2,b:fit.c1,c:fit.c0, xOK:Math.abs(pred3-f3)<tol};
}
function extractParamModelQuad(p) {
    function abcAt(lv){ return paramQuadCoeffsAtLambda(p, lv); }
    var s0=abcAt(0), s1=abcAt(1), s2=abcAt(2), s3=abcAt(3);
    var ac=fitQuadratic(s0.a,s1.a,s2.a), bc=fitQuadratic(s0.b,s1.b,s2.b), cc=fitQuadratic(s0.c,s1.c,s2.c);
    var predA3=evalPoly2(ac,3), predB3=evalPoly2(bc,3), predC3=evalPoly2(cc,3);
    var tolA=1e-6*Math.max(1,Math.abs(s3.a)), tolB=1e-6*Math.max(1,Math.abs(s3.b)), tolC=1e-6*Math.max(1,Math.abs(s3.c));
    var valid = s0.xOK&&s1.xOK&&s2.xOK&&s3.xOK &&
        Math.abs(predA3-s3.a)<tolA && Math.abs(predB3-s3.b)<tolB && Math.abs(predC3-s3.c)<tolC;
    return {a:ac, b:bc, c:cc, valid:valid};
}

var _paramQuadState=null;

/* Special-case text (unique / impossible / identity if a(λ)=0 at this
   point; otherwise a double root) for one isolated critical λ. */
function fmtParamQuadCase(a,b,c,lam) {
    var aVal=evalPoly2(a,lam);
    var head=T('eqParamSpecialCase')+' ('+KX('\\lambda = '+fmtNumTex(lam))+'): ';
    if (Math.abs(aVal)<1e-6) {
        var bVal=evalPoly2(b,lam), cVal=evalPoly2(c,lam);
        if (Math.abs(bVal)>=1e-6) return head+KX('x = '+fmtNumTex(-cVal/bVal),true);
        if (Math.abs(cVal)<1e-6) return head+T('eqIdentityTrue');
        return head+T('eqParamImpossible');
    }
    var bVal=evalPoly2(b,lam);
    return head+T('eqDoubleRoot')+' '+KX('x = '+fmtNumTex(-bVal/(2*aVal)),true);
}

/* Plain-text twin of fmtPolyLambda (see fmtPoly2LambdaPlain above for
   why tutor steps need their own non-LaTeX formatter). */
var _SUPDIGITS=['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
function supIdx(i) { return String(i).split('').map(function(ch){return _SUPDIGITS[+ch]||ch;}).join(''); }
function fmtPolyLambdaPlain(coeffs) {
    var deg=coeffs.length-1, terms=[];
    for (var i=0;i<coeffs.length;i++) {
        var coef=coeffs[i], power=deg-i;
        if (Math.abs(coef)<1e-9) continue;
        var isFirst=terms.length===0;
        var sign=coef<0?(isFirst?'-':' - '):(isFirst?'':' + ');
        var mag=Math.abs(coef);
        var varPart=power===0?'':(power===1?'λ':'λ'+supIdx(power));
        var magPart=(Math.abs(mag-1)<1e-9 && power!==0)?'':fmtNum(mag);
        terms.push(sign+magPart+varPart);
    }
    return terms.length?terms.join(''):fmtNum(0);
}
/* Plain-text twin of fmtParamQuadCase. */
function fmtParamQuadCasePlain(a,b,c,lam) {
    var aVal=evalPoly2(a,lam);
    var head='λ = '+fmtNum(lam)+':&nbsp; ';
    if (Math.abs(aVal)<1e-6) {
        var bVal=evalPoly2(b,lam), cVal=evalPoly2(c,lam);
        if (Math.abs(bVal)>=1e-6) return head+'x = '+fmtNum(-cVal/bVal);
        if (Math.abs(cVal)<1e-6) return head+T('eqIdentityTrue');
        return head+T('eqParamImpossible');
    }
    var bVal=evalPoly2(b,lam);
    return head+T('eqDoubleRoot')+' x = '+fmtNum(-bVal/(2*aVal));
}
/* Resolves ONE critical point from the `crits` list (which mixes
   a(λ)=0 points and Δ(λ)=0 points) into its plain-text explanation —
   an a-type point reuses the special-case logic above; a delta-type
   point (a(λ)≠0 there) is a genuine double root. */
function fmtParamQuadCritPointPlain(a,b,c,cr) {
    if (cr.type==='a') return fmtParamQuadCasePlain(a,b,c,cr.lam);
    var aVal=evalPoly2(a,cr.lam), bVal=evalPoly2(b,cr.lam);
    return 'λ = '+fmtNum(cr.lam)+':&nbsp; '+T('eqDoubleRoot')+' x = '+fmtNum(-bVal/(2*aVal));
}

/* Method 1 only this round (see file-level note above
   buildParamLinearTutorSteps): a genuinely independent Method 2 here
   would need its own arithmetic path the way the linear case's
   concrete-value check does — left for later, same tradeoff already
   made for System 3×3. This narrates exactly the branching
   solveParametricQuadX itself uses (deltaIsZeroPoly vs the general
   interval analysis), just step by step instead of straight to HTML. */
function buildParamQuadTutorSteps(p, a, b, c, crits, deltaCoeffs, deltaIsZeroPoly) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(PT('q_step1_title')), why:PT('q_step1_why'), work: p.left+' = '+p.right });
    main.push({ title:TT(PT('q_step2_title')), why:PT('q_step2_why'),
        work: '('+fmtPoly2LambdaPlain(a)+')x² + ('+fmtPoly2LambdaPlain(b)+')x + ('+fmtPoly2LambdaPlain(c)+') = 0' });
    main.push({ title:TT(PT('q_step3_title')), why:PT('q_step3_why'),
        work: 'Δ(λ) = '+(deltaIsZeroPoly?'0':fmtPolyLambdaPlain(deltaCoeffs)) });

    if (!crits.length) {
        main.push({ title:TT(PT('q_step4_title')), why:PT('q_step4_why'), work: PT('q_step4_none') });
    } else {
        main.push({ title:TT(PT('q_step4_title')), why:PT('q_step4_why'),
            work: crits.map(function(cr){return 'λ = '+fmtNum(cr.lam)+(cr.type==='a'?' (a(λ)=0)':' (Δ(λ)=0)');}).join(',&nbsp;&nbsp;') });
    }

    var rows=[];
    if (deltaIsZeroPoly) {
        rows.push(T('eqParamQuadAlwaysDouble')+': x(λ) = −('+fmtPoly2LambdaPlain(b)+') / (2·('+fmtPoly2LambdaPlain(a)+'))');
        crits.forEach(function(cr){ rows.push(fmtParamQuadCritPointPlain(a,b,c,cr)); });
    } else {
        var n2=crits.length;
        for (var i=0;i<=n2;i++) {
            var loLam=i===0?null:crits[i-1].lam, hiLam=i===n2?null:crits[i].lam;
            var midLam=(loLam===null&&hiLam===null)?0:(loLam===null?hiLam-1:(hiLam===null?loLam+1:(loLam+hiLam)/2));
            var rangeLabel=(loLam===null&&hiLam===null)?'∀λ ∈ ℝ':(loLam===null?'λ < '+fmtNum(hiLam):(hiLam===null?'λ > '+fmtNum(loLam):fmtNum(loLam)+' < λ < '+fmtNum(hiLam)));
            var dVal=evalPolyArr(deltaCoeffs,midLam);
            rows.push(rangeLabel+':&nbsp; Δ '+(dVal>0?'&gt; 0 → 2 '+T('eq_roots'):(Math.abs(dVal)<1e-9?'= 0':'&lt; 0 → '+T('eqNoRealRootsDelta'))));
            if (i<n2) rows.push(fmtParamQuadCritPointPlain(a,b,c,crits[i]));
        }
    }
    main.push({ title:TT(PT('q_step5_title')), why:PT('q_step5_why'), work: rows.join('<br>') });

    var allLams=crits.map(function(cr){return cr.lam;});
    var picks=pickConcreteLambdas(allLams,1);
    if (picks.length) {
        var lam=picks[0];
        var aV=evalPoly2(a,lam), bV=evalPoly2(b,lam), cV=evalPoly2(c,lam);
        var discV=bV*bV-4*aV*cV;
        var workLine='λ = '+fmtNum(lam)+':&nbsp; a='+fmtNum(aV)+', b='+fmtNum(bV)+', c='+fmtNum(cV)+', Δ='+fmtNum(discV);
        if (discV>1e-9) {
            var sq=Math.sqrt(discV), x1=(-bV+sq)/(2*aV), x2=(-bV-sq)/(2*aV);
            workLine += '<br>x = '+fmtNum(x1)+', '+fmtNum(x2);
        } else if (discV>-1e-9) {
            workLine += '<br>x = '+fmtNum(-bV/(2*aV))+' ('+T('eqDoubleRoot')+')';
        } else {
            workLine += '<br>'+T('eqNoRealRootsDelta');
        }
        main.push({ title:TT(PT('q_step6_title')), why:PT('q_step6_why'), work: workLine });
    }
    return main;
}

/* Method 2 (quadratic-in-x parametric): same "concrete values first"
   philosophy as the linear case's Method 2 above — pick a couple of
   non-critical λ, independently re-derive a,b,c at that FIXED λ via
   paramQuadCoeffsAtLambda (fresh sampling of the ORIGINAL expression,
   not the already-fitted a(λ)/b(λ)/c(λ) model), solve the resulting
   ordinary quadratic with the textbook formula, and cross-check both
   the discriminant's sign and the actual root(s) against the general
   model's prediction at that same λ — a real independent
   confirmation, distinct from Method 1's own single concrete-value
   step (which reads a,b,c off the fitted model rather than
   re-deriving them). */
function buildParamQuadConcreteAltSteps(p, a, b, c, crits) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var allLams=crits.map(function(cr){return cr.lam;});
    var picks=pickConcreteLambdas(allLams, 2);
    var alt=[];
    picks.forEach(function(lam){
        var co=paramQuadCoeffsAtLambda(p, lam);
        var subLeft=fillLambdaLiteral(p.left,lam), subRight=fillLambdaLiteral(p.right,lam);
        var work = subLeft+' = '+subRight+'&nbsp;&nbsp;→&nbsp;&nbsp;'+fmtNum(co.a)+'x² + '+fmtNum(co.b)+'x + ('+fmtNum(co.c)+') = 0';

        if (Math.abs(co.a)<1e-9) {
            // Shouldn't happen at a non-critical pick (that would make
            // it a critical λ by definition), but stay safe regardless.
            alt.push({ title:TT(fillTpl(PT('qalt_step_title'),{lam:fmtNum(lam)})), why:fillTpl(PT('qalt_step_why'),{lam:fmtNum(lam)}), work: work });
            return;
        }

        var discV=co.b*co.b-4*co.a*co.c, xVals;
        var rootsWork;
        if (discV>1e-9) {
            var sq=Math.sqrt(discV);
            var x1=(-co.b+sq)/(2*co.a), x2=(-co.b-sq)/(2*co.a);
            rootsWork='Δ = '+fmtNum(discV)+' &gt; 0&nbsp;&nbsp;→&nbsp;&nbsp;x = '+fmtNum(x1)+', '+fmtNum(x2);
            xVals=[x1,x2];
        } else if (discV>-1e-9) {
            var x0=-co.b/(2*co.a);
            rootsWork='Δ = 0&nbsp;&nbsp;→&nbsp;&nbsp;x = '+fmtNum(x0)+' ('+T('eqDoubleRoot')+')';
            xVals=[x0];
        } else {
            rootsWork='Δ = '+fmtNum(discV)+' &lt; 0&nbsp;&nbsp;→&nbsp;&nbsp;'+T('eqNoRealRootsDelta');
            xVals=[];
        }
        alt.push({ title:TT(fillTpl(PT('qalt_step_title'),{lam:fmtNum(lam)})), why:fillTpl(PT('qalt_step_why'),{lam:fmtNum(lam)}), work: work+'<br>'+rootsWork });

        var aG=evalPoly2(a,lam), bG=evalPoly2(b,lam), cG=evalPoly2(c,lam);
        var discG=bG*bG-4*aG*cG;
        var matchOk=(discV>1e-9&&discG>1e-9)||(Math.abs(discV)<1e-9&&Math.abs(discG)<1e-9)||(discV<-1e-9&&discG<-1e-9);
        if (matchOk && xVals.length) {
            var gRoots=[];
            if (discG>1e-9){ var sqg=Math.sqrt(discG); gRoots=[(-bG+sqg)/(2*aG),(-bG-sqg)/(2*aG)]; }
            else if (Math.abs(discG)<1e-9){ gRoots=[-bG/(2*aG)]; }
            matchOk = xVals.every(function(xv){ return gRoots.some(function(gr){return Math.abs(xv-gr)<1e-4;}); });
        }
        alt.push({ title:'', why:'', work: matchOk?fillTpl(PT('qalt_match_ok'),{lam:fmtNum(lam)}):'' });
    });
    return alt;
}

function solveParametricQuadX(p, model, result) {
    var a=model.a, b=model.b, c=model.c;
    var html='<div class="eq-answer">'+T('eqParamQuadTitle')+'</div>';
    html+='<div class="eq-block">'+KX('\\left('+fmtPoly2Lambda(a)+'\\right)x^2 + \\left('+fmtPoly2Lambda(b)+'\\right)x + \\left('+fmtPoly2Lambda(c)+'\\right) = 0')+'</div>';

    var deltaCoeffs=computeDeltaCoeffs(a,b,c);
    var deltaIsZeroPoly=deltaCoeffs.every(function(v){return Math.abs(v)<1e-9;});
    html+='<div class="eq-block">'+KX('\\Delta(\\lambda) = '+(deltaIsZeroPoly?'0':fmtPolyLambda(deltaCoeffs)))+'</div>';

    var aRoots=findCriticalLambdas(a); // reuses the existing quadratic-in-λ root finder
    var deltaRoots=deltaIsZeroPoly?[]:realRootsPoly(deltaCoeffs);

    var crits=[];
    function addCrit(lam,type){
        for (var i=0;i<crits.length;i++){
            if (Math.abs(crits[i].lam-lam)<1e-6*Math.max(1,Math.abs(lam))) { if (type==='a') crits[i].type='a'; return; }
        }
        crits.push({lam:lam,type:type});
    }
    deltaRoots.forEach(function(r){addCrit(r,'delta');});
    aRoots.forEach(function(r){addCrit(r,'a');});
    crits.sort(function(x,y){return x.lam-y.lam;});

    var quadFormula='x(\\lambda) = \\dfrac{-\\left('+fmtPoly2Lambda(b)+'\\right)\\pm\\sqrt{\\Delta(\\lambda)}}{2\\left('+fmtPoly2Lambda(a)+'\\right)}';

    if (deltaIsZeroPoly) {
        html+='<div class="eq-block">'+T('eqParamQuadAlwaysDouble')+': '+KX('x(\\lambda) = \\dfrac{-\\left('+fmtPoly2Lambda(b)+'\\right)}{2\\left('+fmtPoly2Lambda(a)+'\\right)}')+'</div>';
        aRoots.forEach(function(lam){ html+='<div class="eq-block">'+fmtParamQuadCase(a,b,c,lam)+'</div>'; });
    } else {
        var n=crits.length;
        for (var i=0;i<=n;i++) {
            var loLam=i===0?null:crits[i-1].lam, hiLam=i===n?null:crits[i].lam;
            var midLam=(loLam===null&&hiLam===null)?0:(loLam===null?hiLam-1:(hiLam===null?loLam+1:(loLam+hiLam)/2));
            var dVal=evalPolyArr(deltaCoeffs,midLam);
            var rangeLabel=(loLam===null&&hiLam===null)?'\\forall\\,\\lambda\\in\\mathbb{R}':(loLam===null?'\\lambda < '+fmtNumTex(hiLam):(hiLam===null?'\\lambda > '+fmtNumTex(loLam):fmtNumTex(loLam)+' < \\lambda < '+fmtNumTex(hiLam)));
            html+='<div class="eq-block">'+KX(rangeLabel)+': '+(dVal>0?(T('eqParamTwoRootsAlways')+' '+KX(quadFormula)):T('eqNoRealRootsDelta'))+'</div>';
            if (i<n) html+='<div class="eq-block">'+fmtParamQuadCase(a,b,c,crits[i].lam)+'</div>';
        }
    }

    var allLams=crits.map(function(cr){return cr.lam;});
    var sliderMin,sliderMax,sliderDefault;
    if (allLams.length) {
        sliderMin=Math.round((Math.min.apply(null,allLams)-5)*10)/10;
        sliderMax=Math.round((Math.max.apply(null,allLams)+5)*10)/10;
        sliderDefault=allLams[0];
    } else { sliderMin=-10; sliderMax=10; sliderDefault=0; }

    html+='<div class="eq-block eq-slider-block">';
    html+='<div class="eq-muted-label">'+T('eqParamSliderLabel')+' — λ = <strong id="param-quad-lambda-value">'+fmtNum(sliderDefault)+'</strong></div>';
    html+='<input type="range" id="param-quad-lambda-slider" min="'+sliderMin+'" max="'+sliderMax+'" step="0.1" value="'+sliderDefault+'" oninput="updateParamLiveQuad(this.value)" class="eq-range">';
    html+='<div id="param-quad-live-readout" class="eq-slider-readout"></div>';
    html+='</div>';

    var paramQuadMain=buildParamQuadTutorSteps(p, a, b, c, crits, deltaCoeffs, deltaIsZeroPoly);
    var paramQuadAlt=buildParamQuadConcreteAltSteps(p, a, b, c, crits);
    displaySteps(paramQuadMain, paramQuadAlt, PT('qalt_title'), PT('qalt_intro'));
    finishEqResult(result, html);

    _paramQuadState={a:a,b:b,c:c};
    updateParamLiveQuad(sliderDefault);
}

function updateParamLiveQuad(lamStr) {
    var ps=_paramQuadState; if (!ps) return;
    var lam=parseFloat(lamStr);
    var labelEl=document.getElementById('param-quad-lambda-value');
    if (labelEl) labelEl.textContent=fmtNum(lam);
    var readout=document.getElementById('param-quad-live-readout');
    if (!readout) return;
    var aVal=evalPoly2(ps.a,lam), bVal=evalPoly2(ps.b,lam), cVal=evalPoly2(ps.c,lam);
    if (Math.abs(aVal)<1e-6) {
        if (Math.abs(bVal)>=1e-6) { readout.className='eq-block'; readout.innerHTML=KX('x = '+fmtNumTex(-cVal/bVal),true); }
        else if (Math.abs(cVal)<1e-6) { readout.className='eq-block'; readout.innerHTML=T('eqIdentityTrue'); }
        else { readout.className='eq-block eq-warn'; readout.innerHTML='⚠️ '+T('eqParamImpossible'); }
        return;
    }
    var disc=bVal*bVal-4*aVal*cVal;
    if (disc<-1e-9) {
        var re=-bVal/(2*aVal), im=Math.sqrt(-disc)/(2*aVal);
        readout.className='eq-block';
        readout.innerHTML=KX('x_{1,2} = '+fmtNumTex(re)+' \\pm '+fmtNumTex(Math.abs(im))+'i',true)+' <small>'+T('eqNoRealRootsDelta')+'</small>';
    } else if (Math.abs(disc)<1e-9) {
        readout.className='eq-block';
        readout.innerHTML=KX('x = '+fmtNumTex(-bVal/(2*aVal)),true)+' <small>'+T('eqDoubleRoot')+'</small>';
    } else {
        var sq=Math.sqrt(disc), x1=(-bVal+sq)/(2*aVal), x2=(-bVal-sq)/(2*aVal);
        readout.className='eq-block';
        readout.innerHTML=KX('x_1='+fmtNumTex(x1)+',\\ x_2='+fmtNumTex(x2),true);
    }
}

/* ── Parametric (λ) 2×2 linear systems ─────────────────────────
   a1(λ)x + b1(λ)y = c1(λ)
   a2(λ)x + b2(λ)y = c2(λ)
   with all six coefficients up to quadratic in λ — same finite-
   difference approach as the rest of this file, parsing x AND y at
   each sampled λ (via safeEvalParamXY).
   Δ(λ)=a1b2−a2b1, Δx(λ)=c1b2−c2b1, Δy(λ)=a1c2−a2c1 are each degree ≤4
   in λ, same shape as Δ(λ) in the quadratic-in-x branch above, so
   they reuse polyMulQuad + realRootsPoly as-is. Unlike that branch,
   only whether Δ(λ) is zero matters here (not its sign), so one
   general Cramer formula covers every λ outside the critical points
   — matching the simpler structure of the original linear-in-x
   branch rather than the quadratic-in-x one. ── */
function safeEvalParamXY(expr, xv, yv, lv) {
    var s = expr
        .replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**')
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/(\d)(x|y|λ)/g,'$1*$2')
        .replace(/x/g,'('+xv+')').replace(/y/g,'('+yv+')').replace(/λ/g,'('+lv+')');
    return Function('"use strict"; return (' + fixImplicitMult(s) + ')')();
}
function subtractPolyArrays(P,Q) { var r=[]; for (var i=0;i<P.length;i++) r.push(P[i]-Q[i]); return r; }

function extractParamSystemEq(eq) {
    var p=splitOnOp(eq); if (!p) throw new Error('bad');
    function f(xv,yv,lv){ return safeEvalParamXY(p.left,xv,yv,lv)-safeEvalParamXY(p.right,xv,yv,lv); }
    function abcAt(lv){
        var c0=f(0,0,lv), ax=f(1,0,lv)-c0, ay=f(0,1,lv)-c0;
        return {a:ax, b:ay, c:-c0};
    }
    var s0=abcAt(0), s1=abcAt(1), s2=abcAt(2);
    var ac=fitQuadratic(s0.a,s1.a,s2.a), bc=fitQuadratic(s0.b,s1.b,s2.b), cc=fitQuadratic(s0.c,s1.c,s2.c);
    var s3=abcAt(3);
    var predA3=evalPoly2(ac,3), predB3=evalPoly2(bc,3), predC3=evalPoly2(cc,3);
    var tolA=1e-6*Math.max(1,Math.abs(s3.a)), tolB=1e-6*Math.max(1,Math.abs(s3.b)), tolC=1e-6*Math.max(1,Math.abs(s3.c));
    var valid = Math.abs(predA3-s3.a)<tolA && Math.abs(predB3-s3.b)<tolB && Math.abs(predC3-s3.c)<tolC;
    return {a:ac, b:bc, c:cc, valid:valid};
}

var _paramSystemState=null;

function solveParametricSystem(eq1, eq2, result) {
    var m1,m2;
    try { m1=extractParamSystemEq(eq1); } catch(e) { m1={valid:false}; }
    try { m2=extractParamSystemEq(eq2); } catch(e) { m2={valid:false}; }
    if (!m1.valid || !m2.valid) {
        showEqWarning(result, 'eqParamNotSupported');
        _paramSystemState=null; return;
    }
    var a1=m1.a,b1=m1.b,c1=m1.c, a2=m2.a,b2=m2.b,c2=m2.c;
    var D  = subtractPolyArrays(polyMulQuad(a1,b2), polyMulQuad(a2,b1));
    var Dx = subtractPolyArrays(polyMulQuad(c1,b2), polyMulQuad(c2,b1));
    var Dy = subtractPolyArrays(polyMulQuad(a1,c2), polyMulQuad(a2,c1));

    var html='<div class="eq-answer">'+T('eqParamSystemTitle')+'</div>';
    html+='<div class="eq-block">'+KX('\\left('+fmtPoly2Lambda(a1)+'\\right)x + \\left('+fmtPoly2Lambda(b1)+'\\right)y = \\left('+fmtPoly2Lambda(c1)+'\\right)')+'</div>';
    html+='<div class="eq-block">'+KX('\\left('+fmtPoly2Lambda(a2)+'\\right)x + \\left('+fmtPoly2Lambda(b2)+'\\right)y = \\left('+fmtPoly2Lambda(c2)+'\\right)')+'</div>';

    var DIsZeroPoly=D.every(function(v){return Math.abs(v)<1e-9;});
    if (DIsZeroPoly) {
        var DxIsZeroPoly=Dx.every(function(v){return Math.abs(v)<1e-9;});
        var DyIsZeroPoly=Dy.every(function(v){return Math.abs(v)<1e-9;});
        html += DxIsZeroPoly&&DyIsZeroPoly
            ? '<div class="eq-block">'+T('eqParamSystemAlwaysDependent')+'</div>'
            : '<div class="eq-block eq-warn">⚠️ '+T('eqParamNotSupported')+'</div>';
        finishEqResult(result, html);
        _paramSystemState=null; return;
    }

    html+='<div class="eq-block">'+KX('\\Delta(\\lambda) = '+fmtPolyLambda(D))+'</div>';
    html+='<div class="eq-block">'+KX('\\Delta_x(\\lambda) = '+fmtPolyLambda(Dx)+',\\quad \\Delta_y(\\lambda) = '+fmtPolyLambda(Dy))+'</div>';

    var criticals=realRootsPoly(D);
    criticals.forEach(function(lam){
        var dxv=evalPolyArr(Dx,lam), dyv=evalPolyArr(Dy,lam);
        var kind=(Math.abs(dxv)<1e-6 && Math.abs(dyv)<1e-6) ? T('eqInfSolutions') : T('eqParamImpossible');
        html+='<div class="eq-block">'+T('eqParamSpecialCase')+' ('+KX('\\lambda = '+fmtNumTex(lam))+'): '+kind+'</div>';
    });
    var exclList=criticals.map(function(lam){return fmtNumTex(lam);}).join(',\\ ');
    var generalLabel = criticals.length ? (T('eqParamGeneralCase')+' ('+KX('\\lambda \\notin \\{'+exclList+'\\}')+')') : T('eqParamGeneralCase');
    html+='<div class="eq-block">'+generalLabel+': '+KX('x(\\lambda)=\\dfrac{\\Delta_x(\\lambda)}{\\Delta(\\lambda)},\\quad y(\\lambda)=\\dfrac{\\Delta_y(\\lambda)}{\\Delta(\\lambda)}')+'</div>';

    var sliderMin,sliderMax,sliderDefault;
    if (criticals.length) {
        sliderMin=Math.round((Math.min.apply(null,criticals)-5)*10)/10;
        sliderMax=Math.round((Math.max.apply(null,criticals)+5)*10)/10;
        sliderDefault=criticals[0];
    } else { sliderMin=-10; sliderMax=10; sliderDefault=0; }

    html+='<div class="eq-block eq-slider-block">';
    html+='<div class="eq-muted-label">'+T('eqParamSliderLabel')+' — λ = <strong id="param-sys-lambda-value">'+fmtNum(sliderDefault)+'</strong></div>';
    html+='<input type="range" id="param-sys-lambda-slider" min="'+sliderMin+'" max="'+sliderMax+'" step="0.1" value="'+sliderDefault+'" oninput="updateParamLiveSystem(this.value)" class="eq-range">';
    html+='<div id="param-sys-live-readout" class="eq-slider-readout"></div>';
    html+='</div>';

    displaySteps([
        S('step_sys_standard',{eq1:fmtPoly2Lambda(a1)+'x + '+fmtPoly2Lambda(b1)+'y = '+fmtPoly2Lambda(c1), eq2:fmtPoly2Lambda(a2)+'x + '+fmtPoly2Lambda(b2)+'y = '+fmtPoly2Lambda(c2)}),
        S('step_param_sys_det')
    ]);
    finishEqResult(result, html);

    _paramSystemState={a1:a1,b1:b1,c1:c1,a2:a2,b2:b2,c2:c2};
    updateParamLiveSystem(sliderDefault);
}

function updateParamLiveSystem(lamStr) {
    var ps=_paramSystemState; if (!ps) return;
    var lam=parseFloat(lamStr);
    var labelEl=document.getElementById('param-sys-lambda-value');
    if (labelEl) labelEl.textContent=fmtNum(lam);
    var readout=document.getElementById('param-sys-live-readout');
    if (!readout) return;
    var a1=evalPoly2(ps.a1,lam), b1=evalPoly2(ps.b1,lam), c1=evalPoly2(ps.c1,lam);
    var a2=evalPoly2(ps.a2,lam), b2=evalPoly2(ps.b2,lam), c2=evalPoly2(ps.c2,lam);
    var det=a1*b2-a2*b1;
    var dx=c1*b2-c2*b1, dy=a1*c2-a2*c1;
    if (Math.abs(det)<1e-9) {
        if (Math.abs(dx)<1e-6 && Math.abs(dy)<1e-6) {
            readout.className='eq-block'; readout.innerHTML=T('eqInfSolutions');
        } else {
            readout.className='eq-block eq-warn'; readout.innerHTML='⚠️ '+T('eqParamImpossible');
        }
        return;
    }
    readout.className='eq-block';
    readout.innerHTML=KX('x = '+fmtNumTex(dx/det)+',\\quad y = '+fmtNumTex(dy/det),true);
}

/* ── Multi-graph comparison + exact-point click ─────────────────
   Up to 2 extra "compare" curves can be overlaid on the same graph
   as the main equation's f(x)=left−right. Pairwise intersections
   between every shown curve are found with the same sign-change +
   bisection scan plotEquation already uses for the main curve's own
   roots, just applied to the difference of two curves instead of one
   curve vs zero — genuinely the same root-finding machinery, not new.
   _eqGraphCurves keeps each curve's real evaluator (not just its
   0.05-step sampled array) so a later click on the fullscreen graph
   can report the exact value at the clicked x, not whatever the
   nearest plotted sample happened to be. ── */
var _eqCompareCurves = [];
var _eqLastLeft = null, _eqLastRight = null;
var _eqGraphCurves = [];
var _eqCompareColors = ['#f59e0b','#ec4899'];
var _eqClickHighlightAdded = false;

function buildEqGraphFn(expr) {
    return function(x){
        try{
            var s=expr.replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/exp/g,'Math.exp').replace(/log10/g,'Math.log10').replace(/log/g,'Math.log10').replace(/ln/g,'Math.log').replace(/π/g,Math.PI).replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**').replace(/(\d)(x)/g,'$1*$2').replace(/x/g,'('+x+')');
            return Function('"use strict"; return '+fixImplicitMult(s))();
        }catch(e){return NaN;}
    };
}

/* Shared 1D bisection: given g(a)=fa and g(b) already known (or
   implied) to have opposite signs, narrows to g(x)=0 in 40 steps.
   findCurveIntersections, handleEqGraphClick, and
   findLocalExtremumNear each used to inline this same loop
   separately (one of them recomputing fa from scratch every
   iteration instead of caching it, and with a different iteration
   count) — unified here into one implementation all three call. */
function bisect1D(g, a, b, fa) {
    for (var k=0;k<40;k++){
        var m=(a+b)/2, fm=g(m);
        if (!isFinite(fm)) break;
        if (fa*fm<=0){ b=m; } else { a=m; fa=fm; }
    }
    return (a+b)/2;
}

/* Same technique as the root-scan inside plotEquation below, applied
   to fnA(x)-fnB(x) instead of a single curve vs zero. */
function findCurveIntersections(fnA, fnB, minX, maxX, step) {
    var xs=[], prevX=null, prevDiff=null;
    for (var x=minX; x<=maxX+1e-9; x+=step) {
        var rx=Math.round(x*1000)/1000;
        var dA=fnA(rx), dB=fnB(rx);
        if (!isFinite(dA)||!isFinite(dB)) { prevX=null; prevDiff=null; continue; }
        var diff=dA-dB;
        if (Math.abs(diff)<1e-5) {
            if (xs.every(function(r){return Math.abs(r-rx)>0.08;})) xs.push(rx);
        } else if (prevDiff!==null && prevDiff*diff<0) {
            var xc=bisect1D(function(m){return fnA(m)-fnB(m);}, prevX, rx, prevDiff);
            var rr=Math.round(xc*1e6)/1e6;
            if (xs.every(function(e){return Math.abs(e-rr)>0.03;})) xs.push(rr);
        }
        prevX=rx; prevDiff=diff;
    }
    return xs;
}

function renderCompareChips() {
    var box=document.getElementById('eq-compare-chips'); if(!box) return;
    box.innerHTML=_eqCompareCurves.map(function(expr,i){
        return '<span class="eq-example" style="display:inline-flex;align-items:center;gap:6px;cursor:default;">'+expr+
            ' <button type="button" onclick="removeCompareCurve('+i+')" aria-label="remove" '+
            'style="background:none;border:none;color:#f87171;cursor:pointer;font-weight:700;padding:0;font-size:0.95rem;line-height:1;">×</button></span>';

function plotEquation(exprLeft, exprRight) {
    var plotDiv=document.getElementById('eq-plot'); if(!plotDiv) return;
    _eqLastLeft=exprLeft; _eqLastRight=exprRight;
    var render=function(){
        try {
            var t=_eqTranslations[MultiCalc.state.currentLang]||_eqTranslations['en'];
            var fn=function(x){try{var s=exprLeft.replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/exp/g,'Math.exp').replace(/log10/g,'Math.log10').replace(/log/g,'Math.log10').replace(/ln/g,'Math.log').replace(/π/g,Math.PI).replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**').replace(/(\d)(x)/g,'$1*$2').replace(/x/g,'('+x+')');return Function('"use strict"; return '+s)()-safeEval(exprRight,x);}catch(e){return NaN;}};
            var xValues=[],yValues=[],roots=[],minX=-10,maxX=10,step=0.05,prevX=null,prevY=null;
            for(var x=minX;x<=maxX+1e-9;x+=step){
                var rx=Math.round(x*1000)/1000,y=fn(rx),cleanY=isFinite(y)&&Math.abs(y)<1e6?y:null;
                xValues.push(rx); yValues.push(cleanY);
                if(cleanY!==null){
                    if(Math.abs(cleanY)<1e-5){if(roots.every(function(r){return Math.abs(r-rx)>0.08;})) roots.push(rx);}
                    else if(prevY!==null&&prevY*cleanY<0){var a=prevX,b=rx;for(var i=0;i<32;i++){var m=(a+b)/2,fm=fn(m);if(!isFinite(fm))break;if(fn(a)*fm<=0)b=m;else a=m;}var rr=Math.round(((a+b)/2)*1e6)/1e6;if(roots.every(function(e){return Math.abs(e-rr)>0.03;})) roots.push(rr);}
                    prevX=rx; prevY=cleanY;
                } else {prevX=null;prevY=null;}
            }
            var curveTrace={x:xValues,y:yValues,type:'scatter',mode:'lines',line:{color:'#6366f1',width:5,shape:'spline',smoothing:0.6},fill:'tozeroy',fillcolor:'rgba(99,102,241,0.05)',name:(t.graph_fx||'f(x) = left − right'),hovertemplate:'x=%{x:.3f}<br>f(x)=%{y:.5f}<extra></extra>'};
            var zeroTrace={x:[minX,maxX],y:[0,0],type:'scatter',mode:'lines',line:{color:'rgba(34,211,238,0.55)',width:2,dash:'dot'},name:(t.graph_zero||'y = 0'),hoverinfo:'skip'};
            var plotData=[zeroTrace,curveTrace];
            if(roots.length) plotData.push({x:roots,y:roots.map(function(){return 0;}),type:'scatter',mode:'markers+text',marker:{size:12,color:'#22d3ee',line:{color:'#f8fafc',width:2},symbol:'circle'},text:roots.map(function(r){return 'x='+fmtNum(r);}),textposition:'top center',textfont:{color:'#e0f2fe',size:12},name:(t.eq_roots||'Roots'),hovertemplate:'root x=%{x:.6f}<extra></extra>'});

            _eqGraphCurves=[{fn:fn,name:(t.graph_fx||'f(x)')}];
            _eqCompareCurves.forEach(function(expr,ci){
                var cfn=buildEqGraphFn(expr), cx=[], cy=[];
                for(var xi=minX;xi<=maxX+1e-9;xi+=step){
                    var rxi=Math.round(xi*1000)/1000, yi=cfn(rxi);
                    cx.push(rxi); cy.push(isFinite(yi)&&Math.abs(yi)<1e6?yi:null);
                }
                var color=_eqCompareColors[ci%_eqCompareColors.length];
                plotData.push({x:cx,y:cy,type:'scatter',mode:'lines',line:{color:color,width:3,dash:'dash',shape:'spline',smoothing:0.6},name:expr,hovertemplate:'x=%{x:.3f}<br>y=%{y:.5f}<extra></extra>'});
                _eqGraphCurves.push({fn:cfn,name:expr});
            });
            /* Pairwise intersections among every currently-shown curve —
               same sign-change+bisection scan as the roots loop above,
               just on the difference of two curves instead of one
               curve vs zero (see findCurveIntersections above). */
            var allIntersections=[];
            for(var ii=0; ii<_eqGraphCurves.length; ii++){
                for(var jj=ii+1; jj<_eqGraphCurves.length; jj++){
                    var fnA=_eqGraphCurves[ii].fn, fnB=_eqGraphCurves[jj].fn;
                    findCurveIntersections(fnA,fnB,minX,maxX,step).forEach(function(px){
                        if(allIntersections.every(function(e){return Math.abs(e.x-px)>0.05;})) allIntersections.push({x:px,y:fnA(px)});
                    });
                }
            }
            if(allIntersections.length){
                plotData.push({x:allIntersections.map(function(p){return p.x;}),y:allIntersections.map(function(p){return p.y;}),type:'scatter',mode:'markers',marker:{size:13,color:'#fbbf24',line:{color:'#1e293b',width:2},symbol:'star'},name:(t.eqIntersections||'Intersections'),hovertemplate:'x=%{x:.4f}, y=%{y:.4f}<extra></extra>'});
            }

            plotDiv.dataset.graphTitle=exprLeft+' = '+exprRight;
            /* IMPORTANT: make the container visible BEFORE Plotly measures it.
               Previously display was set to 'block' AFTER Plotly.newPlot(), so
               Plotly measured a display:none (zero-size) box and fell back to
               its default ~700px-wide layout — which then rendered wider than
               the actual card once the container appeared, spilling past the
               rounded border. Ordering this correctly removes the mismatch at
               the source; the resize call below is just a safety net for any
               remaining layout settling (e.g. right after the screen's own
               entrance animation). */
            plotDiv.style.display='block';
            var cmpBox=document.getElementById('eq-compare-box'); if(cmpBox) cmpBox.style.display='block';
            window.Plotly.newPlot(plotDiv,plotData,getEquationGraphLayout(320,''),getEquationPlotConfig(false));
            requestAnimationFrame(function(){
                requestAnimationFrame(function(){
                    try{window.Plotly.Plots.resize(plotDiv);}catch(e){}
                });
            });
        } catch(e){plotDiv.style.display='none';}
    };
    if (window.Plotly) render();
    else plotDiv.style.display='none';
}

/* Scans a small window around clickedX for a local max/min of fn —
   central-difference derivative, sign-change detection, bisection to
   pin down f'(x)=0 — same scan-then-bisect shape as
   findCurveIntersections above, just on fn's derivative instead of
   two curves' difference. Returns null if the curve is monotonic
   throughout the window (the common case — most clicks aren't near
   a turning point). */
function findLocalExtremumNear(fn, clickedX, halfWindow, step) {
    var h = (step||0.05)/2;
    function deriv(x){ return (fn(x+h)-fn(x-h))/(2*h); }
    var lo=clickedX-halfWindow, hi=clickedX+halfWindow, n=40, dx=(hi-lo)/n;
    var prevX=null, prevD=null, found=null;
    for (var i=0;i<=n;i++){
        var x=lo+i*dx, d=deriv(x);
        if (!isFinite(d)) { prevX=null; prevD=null; continue; }
        if (prevD!==null && prevD*d<0) {
            var xc=bisect1D(deriv, prevX, x, prevD);
            var yc=fn(xc);
            if (isFinite(yc)) {
                var kind = prevD>0 ? 'max' : 'min'; // derivative + -> - is a peak, - -> + is a trough
                if (!found || Math.abs(xc-clickedX)<Math.abs(found.x-clickedX)) found={x:xc,y:yc,kind:kind};
            }
        }
        prevX=x; prevD=d;
    }
    return found;
}

/* Called on plotly_click in the fullscreen graph. clickData.points
   gives the nearest SAMPLED point Plotly matched (accurate only to
   the 0.05-step grid); this re-evaluates the real curve(s) at that x
   for an exact value, and — if the click landed where two curves are
   close together — refines to their precise intersection via a local
   bisection on fnA(x)-fnB(x) (same technique as findCurveIntersections
   above, narrowed to a small window instead of the whole graph). A
   click not near an intersection is also checked for a nearby local
   max/min (findLocalExtremumNear) before falling back to a plain
   exact point. */
function handleEqGraphClick(clickData, plotDivEl) {
    var pts=clickData.points||[]; if(!pts.length || !_eqGraphCurves.length) return;
    var clickedX=pts[0].x;

    var vals=_eqGraphCurves.map(function(c){ return {name:c.name, y:c.fn(clickedX)}; }).filter(function(v){return isFinite(v.y);});
    if (!vals.length) return;

    var exactX=clickedX, exactY, label;
    var best=null;
    for (var i=0;i<vals.length;i++){
        for (var j=i+1;j<vals.length;j++){
            var d=Math.abs(vals[i].y-vals[j].y);
            if (!best || d<best.d) best={i:i,j:j,d:d};
        }
    }
    var closeTol=0.15;
    if (best && best.d<closeTol) {
        var curveA=_eqGraphCurves.filter(function(c){return c.name===vals[best.i].name;})[0];
        var curveB=_eqGraphCurves.filter(function(c){return c.name===vals[best.j].name;})[0];
        var fnA=curveA.fn, fnB=curveB.fn;
        var a=clickedX-0.1, b=clickedX+0.1, fa=fnA(a)-fnB(a), fb=fnA(b)-fnB(b);
        if (isFinite(fa)&&isFinite(fb)&&fa*fb<0){
            exactX=bisect1D(function(m){return fnA(m)-fnB(m);}, a, b, fa);
            exactY=fnA(exactX);
        } else { exactY=vals[best.i].y; }
        label=T('eqIntersectionPoint');
    } else {
        var clickY=pts[0].y;
        var nearest=vals.reduce(function(p,c){return (Math.abs(c.y-clickY)<Math.abs(p.y-clickY))?c:p;});
        var curveObj=_eqGraphCurves.filter(function(c){return c.name===nearest.name;})[0];
        var ext = curveObj ? findLocalExtremumNear(curveObj.fn, clickedX, 1.0, 0.05) : null;
        if (ext) {
            exactX=ext.x; exactY=ext.y;
            label = ext.kind==='max' ? T('eqLocalMax') : T('eqLocalMin');
        } else {
            exactY=nearest.y;
            label=T('eqExactPoint');
        }
    }

    try{
        if (_eqClickHighlightAdded && plotDivEl.data && plotDivEl.data.length) window.Plotly.deleteTraces(plotDivEl, plotDivEl.data.length-1);
        window.Plotly.addTraces(plotDivEl, {x:[exactX],y:[exactY],type:'scatter',mode:'markers',marker:{size:16,color:'#34d399',symbol:'x',line:{color:'#f8fafc',width:2}},hoverinfo:'skip',showlegend:false});
        _eqClickHighlightAdded=true;
    }catch(e){}

    var readout=document.getElementById('eq-graph-click-readout');
    if (readout) readout.innerHTML='<div class="eq-block" style="margin:0;">'+label+': '+KX('('+fmtNumTex(exactX)+',\\ '+fmtNumTex(exactY)+')',true)+'</div>';
}

/* ── Drag modal ── */
var _modalDrag = (function(){
    var state={ox:0,oy:0,active:false,sx:0,sy:0,moved:false};
    function getShell(){return document.querySelector('.graph-fullscreen-shell');}
    function applyToShell(){
        var shell=getShell(); if(!shell) return;
        var isOpen=document.getElementById('fullscreen-modal')&&document.getElementById('fullscreen-modal').classList.contains('active');
        var scale=isOpen?1:0.92;
        shell.style.transform='translate(calc(-50% + '+state.ox+'px), calc(-50% + '+state.oy+'px)) scale('+scale+')';
    }
    function reset(){state.ox=0;state.oy=0;state.active=false;state.moved=false;applyToShell();}
    document.addEventListener('DOMContentLoaded',function(){
        var modal=document.getElementById('fullscreen-modal'); if(!modal) return;
        modal.addEventListener('pointerdown',function(e){
            var onBackdrop=!e.target.closest('.graph-fullscreen-shell');
            var onHeader=!!e.target.closest('.graph-fullscreen-header')&&!e.target.closest('.graph-fullscreen-close');
            var onShellEdge=!!e.target.closest('.graph-fullscreen-shell')&&!e.target.closest('#fullscreen-plot')&&!e.target.closest('.graph-fullscreen-close');
            if(!onBackdrop&&!onHeader&&!onShellEdge) return;
            if(!modal.classList.contains('active')) return;
            state.active=true; state.moved=false; state.sx=e.clientX-state.ox; state.sy=e.clientY-state.oy;
            modal.style.cursor='grabbing'; try{modal.setPointerCapture(e.pointerId);}catch(err){} e.preventDefault();
        },{passive:false});
        modal.addEventListener('pointermove',function(e){
            if(!state.active) return;
            var dx=e.clientX-state.sx,dy=e.clientY-state.sy;
            if(Math.abs(dx-state.ox)>1||Math.abs(dy-state.oy)>1) state.moved=true;
            state.ox=dx; state.oy=dy; applyToShell();
        },{passive:false});
        function stopDrag(e){if(!state.active)return;state.active=false;modal.style.cursor='';var shell=getShell();if(shell)shell.style.cursor='';if(!state.moved&&!e.target&&!e.target.closest('.graph-fullscreen-shell'))closeFullScreen();}
        modal.addEventListener('pointerup',stopDrag); modal.addEventListener('pointercancel',stopDrag);
    });
    return {reset:reset,applyToShell:applyToShell};
})();

/* ── Apply translations to static UI text that setEqExample() never
   touches (header title, type chips, Solve button, fullscreen-graph
   button + modal chrome, quick-examples heading). These were plain
   hardcoded strings in the HTML, so they never respected the active
   app language — this brings them into the same _eqTranslations/T()
   system already used for the input labels and step messages. ── */
/* ── Random exercise generator ───────────────────────────────
   Fills the input with a freshly generated equation for whichever
   chip is active, then stops — this module has no live-as-you-type
   solving (only the Solve button / Enter key trigger it, same as the
   Quick Example buttons), so generating a problem genuinely sets up
   practice rather than handing over the answer.
   Quadratic/cubic/poly are built FROM chosen integer roots and
   expanded, so they stay factorable; the rest use small random
   integer coefficients directly — KaTeX + exact fractions already
   make any resulting answer render cleanly, integer or not, so
   there's no need to force niceness everywhere. ── */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randNonZero(min,max){ var v; do{ v=randInt(min,max); }while(v===0); return v; }
function randDistinct(min,max,avoid){ var v; do{ v=randInt(min,max); }while(v===avoid); return v; }

function fmtPolyTerms(terms) {
    // terms: [{coef, varStr}], highest degree first; varStr e.g. 'x²','x','' — reused for quadratic/cubic/poly.
    var parts=[];
    terms.forEach(function(t){
        if (t.coef===0) return;
        var mag=Math.abs(t.coef);
        var magStr=(mag===1 && t.varStr) ? '' : String(mag);
        var piece=magStr+t.varStr;
        parts.push(parts.length ? ((t.coef<0?' - ':' + ')+piece) : ((t.coef<0?'-':'')+piece));
    });
    return parts.length?parts.join(''):'0';
}
function appendConst(base, konst) {
    if (konst===0) return base;
    return base+(konst>0?' + ':' - ')+Math.abs(konst);
}
function fmtAffine(coefVar, varLabel, konst) {
    var vPart = coefVar===0?'':(coefVar===1?varLabel:(coefVar===-1?'-'+varLabel:coefVar+varLabel));
    return vPart ? appendConst(vPart,konst) : String(konst);
}
function fmtLinearSide(coefX, konst){ return fmtAffine(coefX,'x',konst); }
function fmtTwoVarSide(coefX, coefY, varX, varY){
    var parts=[];
    if (coefX!==0) parts.push((coefX===1?'':(coefX===-1?'-':coefX))+varX);
    if (coefY!==0) {
        var piece=(Math.abs(coefY)===1?'':String(Math.abs(coefY)))+varY;
        parts.push(parts.length ? ((coefY<0?' - ':' + ')+piece) : ((coefY<0?'-':'')+piece));
    }
    return parts.length?parts.join(''):'0';
}
function fmtThreeVarSide(a,b,c,vx,vy,vz){
    var parts=[];
    [[a,vx],[b,vy],[c,vz]].forEach(function(pair){
        var coef=pair[0], v=pair[1];
        if (coef===0) return;
        var piece=(Math.abs(coef)===1?'':String(Math.abs(coef)))+v;
        parts.push(parts.length ? ((coef<0?' - ':' + ')+piece) : ((coef<0?'-':'')+piece));
    });
    return parts.length?parts.join(''):'0';
}

function genLinear(){
    var x0=randInt(-9,9);
    var a1=randNonZero(2,9), b1=randInt(-15,15);
    var a2=randDistinct(-9,9,a1);
    var d2=(a1-a2)*x0+b1;
    return fmtLinearSide(a1,b1)+' = '+fmtLinearSide(a2,d2);
}
function genQuadratic(){
    var r1=randInt(-6,6), r2=randInt(-6,6);
    var A=randInt(1,2);
    return fmtPolyTerms([{coef:A,varStr:'x²'},{coef:-A*(r1+r2),varStr:'x'},{coef:A*r1*r2,varStr:''}])+' = 0';
}
function genCubic(){
    var r1=randInt(-4,4), r2=randInt(-4,4), r3=randInt(-4,4);
    var b=-(r1+r2+r3), c=r1*r2+r1*r3+r2*r3, d=-r1*r2*r3;
    return fmtPolyTerms([{coef:1,varStr:'x³'},{coef:b,varStr:'x²'},{coef:c,varStr:'x'},{coef:d,varStr:''}])+' = 0';
}
function genAbsolute(){
    var a=randNonZero(1,6), b=randInt(-10,10), c=randInt(1,15);
    return '|'+fmtLinearSide(a,b)+'| = '+c;
}
function genRational(){
    var x0=randInt(-6,6);
    var c=randNonZero(1,5), d=randDistinct(-10,10,-c*x0);
    var e=randNonZero(-5,5);
    var a; do{ a=randNonZero(1,5); }while(a===e*c); // a===e*c makes numerator = e*denominator identically -> infinite solutions, not a proper single-answer exercise
    var b=e*(c*x0+d)-a*x0;
    return '('+fmtLinearSide(a,b)+')/('+fmtLinearSide(c,d)+') = '+e;
}
function genInequality(){
    var ops=['>','<','>=','<='];
    if (Math.random()<0.5) {
        var eq=genLinear().split(' = ');
        return eq[0]+' '+ops[randInt(0,3)]+' '+eq[1];
    }
    var r1=randInt(-6,6), r2=randDistinct(-6,6,r1);
    var terms=[{coef:1,varStr:'x²'},{coef:-(r1+r2),varStr:'x'},{coef:r1*r2,varStr:''}];
    return fmtPolyTerms(terms)+' '+ops[randInt(0,3)]+' 0';
}
function genSystem(){
    var x0=randInt(-6,6), y0=randInt(-6,6);
    var a1,b1,a2,b2,det;
    do {
        a1=randNonZero(-6,6); b1=randNonZero(-6,6);
        a2=randNonZero(-6,6); b2=randNonZero(-6,6);
        det=a1*b2-a2*b1;
    } while (det===0);
    var c1=a1*x0+b1*y0, c2=a2*x0+b2*y0;
    return [fmtTwoVarSide(a1,b1,'x','y')+' = '+c1, fmtTwoVarSide(a2,b2,'x','y')+' = '+c2];
}
function genSystem3(){
    function det3(m){
        return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
             - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
             + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
    }
    var x0=randInt(-5,5), y0=randInt(-5,5), z0=randInt(-5,5);
    var rows,det;
    do {
        rows=[[randNonZero(-5,5),randNonZero(-5,5),randNonZero(-5,5)],
              [randNonZero(-5,5),randNonZero(-5,5),randNonZero(-5,5)],
              [randNonZero(-5,5),randNonZero(-5,5),randNonZero(-5,5)]];
        det=det3(rows);
    } while (det===0);
    var rhs=rows.map(function(r){ return r[0]*x0+r[1]*y0+r[2]*z0; });
    return rows.map(function(r,i){ return fmtThreeVarSide(r[0],r[1],r[2],'x','y','z')+' = '+rhs[i]; });
}
function genTrig(){
    var fns=['sin','cos','tan'];
    var fn=fns[randInt(0,2)];
    var niceVals={sin:[0,0.5,-0.5,1,-1,0.7071,-0.7071,0.866,-0.866],cos:[0,0.5,-0.5,1,-1,0.7071,-0.7071,0.866,-0.866],tan:[0,1,-1]};
    var vals=niceVals[fn];
    return fn+'(x) = '+vals[randInt(0,vals.length-1)];
}
function genExp(){
    var bases=[2,3,5,10];
    var a=bases[randInt(0,3)], x0=randInt(1,4);
    return a+'^x = '+Math.pow(a,x0);
}
function genLog(){
    var useLn=Math.random()<0.5, v=randInt(0,3);
    return (useLn?'ln(x)':'log(x)')+' = '+v;
}
function genPoly(){
    if (Math.random()<0.5) {
        var squares=[1,4,9,16,25];
        var i1=randInt(0,4), i2=randDistinct(0,4,i1);
        var p=squares[i1], q=squares[i2];
        return fmtPolyTerms([{coef:1,varStr:'x^4'},{coef:-(p+q),varStr:'x²'},{coef:p*q,varStr:''}])+' = 0';
    }
    var kk=[1,4,9][randInt(0,2)];
    return 'x^5 - '+kk+'x = 0';
}
function genParam(){
    var pick=randInt(0,2);
    if (pick===0) {
        var k=randNonZero(-6,6), m=randInt(-9,9), n=randDistinct(-9,9,m);
        var lhs=appendConst('('+appendConst('λ',-k)+')x', m);
        return lhs+' = '+appendConst('λ',n);
    }
    if (pick===1) {
        var k2=randNonZero(-6,6);
        return '('+appendConst('λ',-k2)+')x = λ² - '+(k2*k2);
    }
    var k3=randInt(-6,6);
    var mid = Math.random()<0.5 ? 'x² + λx' : 'x² - λx';
    return appendConst(mid,k3)+' = 0';
}

function generateRandomExercise(){
    var mode=MultiCalc.state.eqMode;
    var t=_eqTranslations[MultiCalc.state.currentLang]||_eqTranslations['en'];
    if (mode==='system') {

            rational:genRational,inequality:genInequality,trig:genTrig,exp:genExp,log:genLog,poly:genPoly,param:genParam};
