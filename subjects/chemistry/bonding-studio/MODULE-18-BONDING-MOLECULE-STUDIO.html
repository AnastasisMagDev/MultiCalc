<title>Bonding &amp; Molecule Studio</title>
<style>
/* MODULE-18 · Bonding & Molecule Studio — every selector is prefixed bs- so nothing leaks into the host app.
   Surfaces are semi-transparent and text colour is inherited, so the module follows the app's light/dark theme. */
body.bs-standalone{margin:0;background:#0c1118;color:#e7edf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.bs-standalone .back-btn{position:sticky;top:0;z-index:5}
.bs-root{--acc:#2fd0b5;--acc2:#ffb020;--card:rgba(127,140,160,.11);--card2:rgba(127,140,160,.18);--line:rgba(127,140,160,.30);--ion:#ff8a5c;--pol:#4da3ff;--non:#62d684;--met:#b79cff;--neg:#ff6b6b;--pos:#5aa9ff;
  max-width:1180px;margin:0 auto;padding:12px 14px 40px;box-sizing:border-box;font-size:15px;line-height:1.45;color:inherit}
.bs-root *{box-sizing:border-box}
.bs-root h1{margin:0;font-size:1.42rem;letter-spacing:.2px;background:linear-gradient(90deg,var(--acc),var(--pol));-webkit-background-clip:text;background-clip:text;color:transparent}
.bs-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin:4px 0 10px}

.bs-lang{display:flex;gap:4px;flex:none}
.bs-lg{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:700;cursor:pointer}
.bs-lg.on{background:var(--acc);border-color:var(--acc);color:#04201b}
.bs-tabs{display:flex;gap:6px;margin:8px 0 14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.bs-tab{flex:1 1 0;min-width:max-content;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:11px 14px;font-weight:650;font-size:.92rem;cursor:pointer;transition:.18s}
.bs-tab.on{background:linear-gradient(135deg,rgba(47,208,181,.28),rgba(77,163,255,.22));border-color:var(--acc);box-shadow:0 0 0 1px rgba(47,208,181,.25) inset}
.bs-panel{animation:bsIn .28s ease both}
@keyframes bsIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bs-hint,.bs-note,.bs-cap{opacity:.78;font-size:.85rem;margin:6px 0}
.bs-empty{padding:18px;border:1px dashed var(--line);border-radius:12px;opacity:.8;text-align:center;margin:10px 0}
.bs-h3{font-size:1rem;margin:18px 0 8px}
.bs-btn{border:1px solid var(--line);background:var(--card2);color:inherit;border-radius:10px;padding:8px 12px;font-weight:650;font-size:.85rem;cursor:pointer}
.bs-btn.sm{padding:5px 9px;font-size:.78rem}.bs-btn.on{background:var(--acc);border-color:var(--acc);color:#04201b}
.bs-btn:active,.bs-tab:active,.bs-card:active,.bs-li:active{transform:scale(.98)}
/* periodic table */
.bs-ptwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--card)}
.bs-pt{display:grid;grid-template-columns:repeat(18,minmax(31px,1fr));grid-template-rows:repeat(7,auto) 8px repeat(2,auto);gap:3px;min-width:600px}
.bs-t{position:relative;border:1px solid transparent;border-radius:7px;padding:3px 0 2px;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.8rem;background:rgba(127,140,160,.16);transition:.12s}
.bs-t b{font-size:.84rem}.bs-t i{font-style:normal;font-size:.55rem;opacity:.65}
.bs-t[data-cat=alkali]{background:rgba(255,107,107,.28)}.bs-t[data-cat=alkaline]{background:rgba(255,166,87,.28)}.bs-t[data-cat=transition]{background:rgba(255,214,102,.22)}
.bs-t[data-cat=post]{background:rgba(136,200,150,.25)}.bs-t[data-cat=metalloid]{background:rgba(95,205,190,.27)}.bs-t[data-cat=nonmetal]{background:rgba(90,169,255,.28)}
.bs-t[data-cat=noble]{background:rgba(183,156,255,.27)}.bs-t[data-cat=lanthanide]{background:rgba(255,130,200,.22)}.bs-t[data-cat=actinide]{background:rgba(220,120,170,.22)}
.bs-t:hover{border-color:var(--acc)}.bs-t.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 16px rgba(47,208,181,.55);transform:scale(1.07);z-index:2}
.bs-selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bs-selchip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--acc);border-radius:20px;padding:5px 12px;font-weight:650;background:rgba(47,208,181,.12)}
.bs-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.35)}
/* chips, badges, cards */
.bs-chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:.74rem;margin:2px 4px 2px 0;background:var(--card)}
.bs-chip.ok{border-color:var(--non);color:var(--non)}.bs-chip.pr{border-color:var(--acc2);color:var(--acc2)}.bs-chip.io{border-color:var(--pol);color:var(--pol)}
.bs-chip.po{border-color:var(--ion);color:var(--ion)}.bs-chip.np{border-color:var(--non);color:var(--non)}.bs-chip.neg{border-color:var(--neg);color:var(--neg)}.bs-chip.pos{border-color:var(--pos);color:var(--pos)}
.bs-badge{display:inline-block;border-radius:8px;padding:2px 9px;font-size:.76rem;font-weight:700;margin-left:6px;color:#0a1118}
.bs-b-ion{background:var(--ion)}.bs-b-pol{background:var(--pol)}.bs-b-non{background:var(--non)}.bs-b-met{background:var(--met)}

.bs-card-f{font-size:1.35rem;font-weight:800}.bs-card-n{opacity:.8;font-size:.85rem;margin:2px 0 6px}

.bs-prof-h,.bs-pair-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bs-prof-h small{display:block;opacity:.7}
.bs-sym{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bs-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:8px 0}

.bs-gl{display:flex;justify-content:space-between;font-size:.68rem;opacity:.7;margin-top:6px}
/* studio */
.bs-search{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}

.bs-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
.bs-cat{flex:none;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:16px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.bs-cat.on{background:var(--acc);border-color:var(--acc);color:#04201b;font-weight:700}
.bs-list{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.bs-li{flex:none;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:7px 11px;text-align:left;cursor:pointer;min-width:84px;max-width:170px;font:inherit}
.bs-li b{display:block;font-size:1rem}.bs-li small{display:block;opacity:.7;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bs-mhead{display:flex;gap:14px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.bs-mf{font-size:2.1rem;font-weight:850;letter-spacing:.5px}.bs-mn{font-size:1.05rem;font-weight:650}
.bs-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.bs-grid2>*,.bs-root section,.bs-det,.bs-det-b{min-width:0}.bs-root{overflow-x:hidden}

.bs-viewcard{border:1px solid var(--line);border-radius:16px;background:radial-gradient(120% 90% at 30% 15%,rgba(77,163,255,.14),rgba(10,16,24,.0) 60%),var(--card);overflow:hidden}
.bs-cv{display:block;width:100%;height:340px;color:inherit}
.bs-tb{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
.bs-segs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bs-seg{border:0;background:transparent;color:inherit;padding:7px 10px;font-size:.78rem;cursor:pointer;font-weight:600}.bs-seg.on{background:var(--acc);color:#04201b}
.bs-tgs{display:flex;gap:5px;flex-wrap:wrap}.bs-tg{border:1px solid var(--line);background:transparent;color:inherit;border-radius:14px;padding:5px 10px;font-size:.76rem;cursor:pointer}.bs-tg.on{border-color:var(--acc);background:rgba(47,208,181,.18);color:var(--acc)}
.bs-acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.bs-tbg{display:flex;flex-direction:column;gap:4px;min-width:0}.bs-tbg>small{font-size:.64rem;opacity:.62;text-transform:uppercase;letter-spacing:.05em;font-weight:700}.bs-n{display:flex;gap:8px;align-items:center;font-size:.8rem}.bs-n input{width:120px}
.bs-cnt{padding:0 12px 10px;font-size:.75rem;opacity:.7}
.bs-det{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.bs-det summary{cursor:pointer;padding:11px 14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:11px}.bs-det summary::before{counter-increment:bsp;content:counter(bsp);flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;background:rgba(47,208,181,.16);color:#2fd0b5;border:1px solid rgba(47,208,181,.45)}.bs-dt{display:flex;flex-direction:column;min-width:0}.bs-dt small{font-weight:400;opacity:.68;font-size:.76rem;line-height:1.35;margin-top:1px}[id^="bs-p-"]{counter-reset:bsp}.bs-sum{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px;background:linear-gradient(135deg,rgba(47,208,181,.11),rgba(77,163,255,.06))}.bs-sum-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;opacity:.7;font-weight:800;margin-bottom:8px}.bs-sum-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px 10px}.bs-sum-g small{display:block;font-size:.68rem;opacity:.65;line-height:1.25}.bs-sum-g b{font-size:.98rem;line-height:1.3}.bs-lead{margin:2px 0 14px;font-size:.88rem;line-height:1.5;opacity:.85;border-left:3px solid #2fd0b5;padding:2px 0 2px 11px}
.bs-det summary::-webkit-details-marker{display:none}.bs-det summary::after{content:"＋";opacity:.6;margin-left:auto}.bs-det[open] summary::after{content:"－"}

.bs-lw{display:flex;justify-content:center;color:inherit}.bs-lw.big{margin:6px 0}
.bs-forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}.bs-fm{position:relative;border:1px solid var(--line);border-radius:12px;padding:6px 2px;background:var(--card)}.bs-fn{position:absolute;left:8px;top:5px;font-size:.7rem;opacity:.6;font-weight:700}
.bs-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;opacity:.85;margin:8px 0}
.bs-legend i{display:inline-block;vertical-align:middle;margin-right:5px}.bs-ldot{width:6px;height:6px;border-radius:50%;background:#4da3ff;box-shadow:8px 0 #4da3ff;margin-right:14px!important}
.bs-lline{width:20px;height:2px;background:currentColor}.bs-lfc{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--neg)}
.bs-states{margin:6px 0}
.bs-tbl{overflow-x:auto}.bs-tbl table{border-collapse:collapse;width:100%;font-size:.8rem}

.bs-pick{display:flex;gap:8px;align-items:center;margin-bottom:8px}.bs-pick select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:10px;padding:10px;font-size:.88rem}

@media(max-width:560px){.bs-tabs{gap:4px}.bs-tab{min-width:0;padding:9px 5px;font-size:.76rem;white-space:normal;text-align:center;line-height:1.2}.bs-root h1{font-size:1.12rem}.bs-head p{font-size:.78rem}.bs-ptwrap{padding:4px}.bs-pt{min-width:0;gap:2px;grid-template-columns:repeat(18,1fr)}.bs-t{padding:4px 0;border-radius:5px}.bs-t b{font-size:.62rem}.bs-t i{display:none}.bs-t.on{transform:scale(1.35)}.bs-cv{height:310px}.bs-root{padding:8px 10px 40px}.bs-mf{font-size:1.8rem}.bs-acts{margin-left:0}}
