<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODULE 15 — Element Rush (voice game)</title>
<style>
/* ═══ MODULE-15 Element Rush — every selector / keyframe is namespaced er- / erush- (styles are global in-app) ═══ */
html.erush-standalone{background:#0f172a;}
html.erush-standalone body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(1200px 700px at 85% -10%,#2a1b52 0%,transparent 60%),linear-gradient(135deg,#0f172a,#1e293b 55%,#1a1f3a);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
html.erush-standalone .screen{display:none;padding:20px;}
html.erush-standalone .screen.active{display:block;}

.erush-root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--fg:#f1f5f9;--mut:#9fb0c7;--line:rgba(148,163,184,.22);--glass:linear-gradient(160deg,rgba(30,41,59,.84),rgba(15,23,42,.92));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);}
body.theme-light .erush-root{--fg:#0f172a;--mut:#475569;}
.erush-root *{box-sizing:border-box;}
.erush-root button{font-family:inherit;}
#scr-erush.erush-root{padding-left:12px;padding-right:12px;}
.er-wrap{max-width:1100px;margin:0 auto;}
.er-top{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin:0 0 16px;text-align:left;padding:0;}
.er-brand h1{margin:0;font-size:1.7rem;font-weight:800;line-height:1.1;letter-spacing:-.01em;background:linear-gradient(135deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;}
.er-brand p{margin:3px 0 0;color:var(--mut);font-size:.9rem;}
.er-btn{white-space:nowrap;padding:10px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(30,41,59,.78);color:#f1f5f9;font-size:.95rem;font-weight:600;cursor:pointer;transition:transform .35s var(--spring),background .3s,border-color .3s;}
.er-btn:active{transform:scale(.93);}
.er-btn:focus-visible,.er-mc:focus-visible,.er-dc:focus-visible,.er-lang:focus-visible,.er-cta:focus-visible,.er-orb:focus-visible,.er-in:focus-visible,.er-ib:focus-visible,.er-seg button:focus-visible{outline:2px solid #a5b4fc;outline-offset:2px;}
.er-main{display:flex;flex-direction:column;}
.er-sec{display:none;}
.erush-st-setup .er-s-setup,.erush-st-lang .er-s-lang,.erush-st-preview .er-s-preview,.erush-st-count .er-s-count,.erush-st-play .er-s-play,.erush-st-play .er-s-ctrl,.erush-st-result .er-s-result{display:block;}
.er-s-setup,.er-s-play,.er-s-result,.er-s-lang,.er-s-preview,.er-s-count{order:1;}
.er-playslot{order:2;display:none;}
.erush-st-play .er-playslot,.erush-st-result .er-playslot{display:block;}
.er-s-ctrl{order:3;}
.erush-st-play .fun-facts-slot,.erush-st-preview .fun-facts-slot,.erush-st-count .fun-facts-slot,.erush-st-lang .fun-facts-slot{display:none;}
.fun-facts-slot{order:9;}
.er-h{margin:22px 0 11px;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:10px;}
.er-step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#f0abfc);color:#0b1220;font-size:.82rem;font-weight:800;}
@keyframes er-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ── menu: stats ── */
.er-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.er-sc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);animation:er-rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms);}
.er-sc svg{flex:none;width:30px;height:30px;padding:6px;border-radius:10px;background:linear-gradient(135deg,rgba(165,180,252,.25),rgba(240,171,252,.25));stroke:#c4b5fd;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.er-sc b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.1;}
.er-sc span{font-size:.72rem;color:#94a3b8;font-weight:600;}

/* ── menu: classic gradient cards (same family as the main menu) ── */
.er-modes{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
.er-diffs{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);}
.er-mc,.er-dc{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 18px 16px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;
  box-shadow:0 14px 28px -18px var(--b);transition:transform .35s var(--spring),box-shadow .3s,filter .3s;animation:er-rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms);}
.er-mc::after,.er-dc::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transition:left .5s ease;pointer-events:none;}
@media(hover:hover){.er-mc:hover::after,.er-dc:hover::after{left:150%;}.er-mc:hover,.er-dc:hover{filter:brightness(1.08) saturate(1.1);}}
.er-mc:active,.er-dc:active{transform:scale(.95);}
.er-mc[aria-pressed="false"],.er-dc[aria-pressed="false"]{filter:saturate(.5) brightness(.6);box-shadow:none;}
.er-mc[aria-pressed="true"],.er-dc[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 0 0 3px rgba(255,255,255,.95) inset,0 24px 40px -20px var(--b);}
.er-chk{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .4s var(--spring);}
.er-chk svg{width:14px;height:14px;stroke:#0b1220;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
[aria-pressed="true"]>.er-chk{transform:scale(1);}
.er-mc .er-ico{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px;}
.er-mc h3{margin:0;font-size:1.15rem;font-weight:700;}
.er-mc p{margin:0;font-size:.84rem;line-height:1.45;color:rgba(255,255,255,.86);}
.er-dc h3{margin:0;font-size:1.02rem;font-weight:700;}
.er-dnum{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.er-dnum b{font-size:2.3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.er-dnum span{font-size:.8rem;opacity:.85;font-weight:600;}
.er-dpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.er-dpills span{padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.25);font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;}
.er-cta{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;max-width:520px;margin:24px auto 8px;padding:16px 22px;border:0;border-radius:22px;background:linear-gradient(135deg,#a5b4fc,#f0abfc);color:#0b1220;cursor:pointer;overflow:hidden;box-shadow:0 20px 42px -16px rgba(165,180,252,.8);transition:transform .4s var(--spring),box-shadow .3s;}
.er-cta b{font-size:1.2rem;font-weight:800;}
.er-cta small{font-size:.8rem;font-weight:600;opacity:.75;}
.er-cta::after{content:"";position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:er-sheen 3.4s ease-in-out infinite;pointer-events:none;}
@keyframes er-sheen{0%,55%{left:-100%;}100%{left:160%;}}
.er-cta:active{transform:scale(.96);}
.er-info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;align-items:center;margin:2px 2px 0;font-size:.84rem;color:var(--mut);}
.er-info b{color:var(--fg);font-variant-numeric:tabular-nums;}
.er-vstate{display:inline-flex;align-items:center;gap:7px;}
.er-vstate i{width:9px;height:9px;border-radius:50%;background:#94a3b8;}
.er-vstate.ok i{background:#4ade80;box-shadow:0 0 10px #4ade80;}
.er-vstate.no i{background:#fbbf24;}

/* ── menu: your elements (collection / last match) ── */
.er-panel{margin-top:26px;padding:16px 18px 18px;border-radius:26px;border:1px solid var(--line);background:var(--glass);box-shadow:0 22px 44px -26px rgba(0,0,0,.9);}
.er-collhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.er-collhead .er-h{margin:0;}
.er-seg{display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(15,23,42,.85);border:1px solid var(--line);position:relative;}
.er-seg button{position:relative;z-index:1;padding:7px 14px;border:0;background:none;color:#cbd5e1;font-size:.8rem;font-weight:700;border-radius:999px;cursor:pointer;transition:color .3s;white-space:nowrap;}
.er-seg button[aria-pressed="true"]{color:#0b1220;background:linear-gradient(135deg,#a5b4fc,#f0abfc);box-shadow:0 4px 14px rgba(165,180,252,.4);}
.er-collsum{margin:10px 0 4px;font-size:.88rem;color:#cbd5e1;line-height:1.5;}
.er-collsum b{color:#fff;}
.er-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.76rem;color:#94a3b8;}
.er-legend span{display:inline-flex;align-items:center;gap:6px;}
.er-legend i{width:11px;height:11px;border-radius:4px;background:var(--k);}
.er-foundlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:150px;overflow:auto;}
.er-fc{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(148,163,184,.12);font-size:.78rem;color:#e2e8f0;animation:er-rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*18ms);}
.er-fc i{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 5px;border-radius:999px;background:linear-gradient(135deg,var(--a),var(--b));color:#0b1220;font-style:normal;font-weight:800;font-size:.72rem;}
.er-empty{display:none;margin:12px 0 4px;padding:14px;border-radius:16px;border:1px dashed rgba(148,163,184,.4);color:#cbd5e1;font-size:.86rem;line-height:1.5;text-align:center;}
.er-empty.er-show{display:block;}
.er-how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.er-hw{padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(15,23,42,.55);animation:er-rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);}
.er-hw em{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-bottom:6px;border-radius:50%;background:rgba(165,180,252,.2);color:#c7d2fe;font-style:normal;font-size:.78rem;font-weight:800;}
.er-hw b{display:block;font-size:.95rem;}
.er-hw span{font-size:.8rem;color:#94a3b8;line-height:1.4;}

/* ── language step ── */
.er-s-lang{max-width:560px;margin:10px auto 0;text-align:center;}
.er-s-lang h2{margin:0 0 6px;font-size:1.5rem;}
.er-s-lang p{margin:0 0 18px;color:var(--mut);font-size:.92rem;line-height:1.5;}
.er-langs{display:grid;gap:10px;margin-bottom:14px;}
.er-lang{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-radius:22px;border:1px solid var(--line);background:var(--glass);color:#f1f5f9;font-size:1.25rem;font-weight:700;cursor:pointer;transition:transform .4s var(--spring),border-color .3s,box-shadow .3s;animation:er-rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);}
.er-lang small{font-size:.78rem;font-weight:600;color:#94a3b8;}
.er-lang:active{transform:scale(.96);}
.er-lang.er-last{border-color:#a5b4fc;box-shadow:0 0 0 1px #a5b4fc inset;}

/* ── preview: names passing in layers ── */
.er-pvhead{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.er-ring{position:relative;flex:none;width:68px;height:68px;border-radius:50%;background:conic-gradient(#a5b4fc calc(var(--p,0)*1%),rgba(148,163,184,.18) 0);display:flex;align-items:center;justify-content:center;}
.er-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#0f172a;}
.er-ring b{position:relative;font-size:1.5rem;font-variant-numeric:tabular-nums;}
.er-pvhead h2{margin:0 0 3px;font-size:1.3rem;}
.er-pvhead p{margin:0;color:var(--mut);font-size:.86rem;line-height:1.4;}
.er-pvhead .er-btn{margin-left:auto;}
.er-lanes{position:relative;display:grid;gap:10px;padding:14px 0;border-radius:24px;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,rgba(99,102,241,.14),rgba(2,6,23,.65) 75%);overflow:hidden;min-height:min(62vh,540px);align-content:center;gap:16px;}
.er-lane{--fs:calc(var(--z,1)*20px);position:relative;overflow:hidden;height:calc(var(--fs)*3);opacity:var(--o,1);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);}
.er-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:calc(var(--fs)*.7);width:max-content;will-change:transform;}
.er-chip{display:flex;align-items:center;gap:calc(var(--fs)*.55);padding:calc(var(--fs)*.45) calc(var(--fs)*.9) calc(var(--fs)*.45) calc(var(--fs)*.45);border-radius:calc(var(--fs)*1.2);background:linear-gradient(135deg,var(--a),var(--b));color:var(--tc);font-size:var(--fs);font-weight:700;white-space:nowrap;box-shadow:0 8px 20px -10px rgba(0,0,0,.7);}
.er-chip i{display:flex;align-items:center;justify-content:center;min-width:calc(var(--fs)*2);height:calc(var(--fs)*2);padding:0 calc(var(--fs)*.35);border-radius:calc(var(--fs)*.8);background:rgba(255,255,255,.35);font-style:normal;font-weight:800;}
.er-lanes.er-static .er-lane{height:auto;}
.er-lanes.er-static .er-track{position:static;flex-wrap:wrap;width:auto;padding:6px 10px;}

/* ── countdown ── */
.er-s-count{text-align:center;padding:12vh 0;}
.er-count{font-size:clamp(5rem,28vw,11rem);font-weight:900;line-height:1;background:linear-gradient(135deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;}
.er-count.er-pop{animation:er-cpop .75s var(--ease) both;}
@keyframes er-cpop{from{opacity:0;transform:scale(.4);}35%{opacity:1;transform:scale(1.12);}to{opacity:.0;transform:scale(1.5);}}
.er-s-count p{margin:6px 0 0;color:var(--mut);}

/* ── play: HUD, target, table, controls ── */
.er-hud{display:grid;grid-template-columns:auto repeat(3,1fr);gap:10px;align-items:stretch;}
.er-time{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:20px;border:1px solid var(--line);background:var(--glass);}
.er-tring{position:relative;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--tc,#a5b4fc) calc(var(--p,100)*1%),rgba(148,163,184,.18) 0);display:flex;align-items:center;justify-content:center;flex:none;}
.er-tring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#0f172a;}
.er-time b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.er-time.er-low{--tc:#fb7185;}
.er-time.er-low b{color:#fda4af;animation:er-blink 1s steps(2) infinite;}
@keyframes er-blink{50%{opacity:.55;}}
.er-stat{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;justify-content:center;}
.er-stat span{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;}
.er-stat b{display:inline-block;transform-origin:left center;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.15;}
.er-stat b.er-bump{animation:er-bump .45s var(--spring);}
@keyframes er-bump{0%{transform:scale(1);}40%{transform:scale(1.28);color:#a5b4fc;}100%{transform:scale(1);}}
.er-prog{height:6px;margin:10px 2px 0;border-radius:3px;background:rgba(148,163,184,.16);overflow:hidden;}
.er-prog i{display:block;height:100%;width:var(--p,0%);border-radius:3px;background:linear-gradient(90deg,#a5b4fc,#f0abfc);transition:width .35s var(--ease);}
.er-target{display:flex;align-items:center;gap:16px;margin:12px 0 4px;padding:12px 18px;border-radius:24px;border:1px solid var(--line);background:var(--glass);min-height:84px;}
.er-clue{flex:none;min-width:76px;height:64px;padding:0 12px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a5b4fc,#f0abfc);color:#0b1220;font-size:2.1rem;font-weight:900;font-variant-numeric:tabular-nums;animation:er-clue .35s var(--spring) both;}
.er-clue.er-num{font-size:1.7rem;}
@keyframes er-clue{from{opacity:0;transform:scale(.6) rotate(-6deg);}to{opacity:1;transform:none;}}
.er-target h3{margin:0;font-size:1.1rem;}
.er-target p{margin:3px 0 0;font-size:.82rem;color:#94a3b8;line-height:1.4;}
.er-target.er-shake{animation:er-shake .45s;}
@keyframes er-shake{20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.er-tablewrap{position:relative;margin-top:6px;}
.er-scroll{overflow-x:auto;overflow-y:hidden;padding:12px 10px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.er-grid{--cw:40px;--ch:44px;--gap:3px;display:grid;grid-template-columns:repeat(18,var(--cw));grid-template-rows:repeat(7,var(--ch)) calc(var(--ch)*.3) repeat(2,var(--ch));gap:var(--gap);width:max-content;margin:0 auto;}
.er-t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:calc(var(--cw)*.16);border:1px solid rgba(148,163,184,.14);background:rgba(15,23,42,.55);color:#0b1220;overflow:hidden;transition:transform .35s var(--spring),opacity .3s,background .4s,border-color .3s,box-shadow .3s;}
.er-t .er-n{position:absolute;top:calc(var(--cw)*.07);left:calc(var(--cw)*.1);font-size:max(6.5px,calc(var(--cw)*.2));color:#7b8aa3;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s;}
.er-t .er-s{font-size:calc(var(--cw)*.4);font-weight:800;line-height:1;opacity:0;transform:scale(.4);margin-top:calc(var(--cw)*.1);transition:opacity .25s,transform .4s var(--spring);}
.er-t .er-nm{display:none;max-width:100%;padding:0 1px;font-size:max(6px,calc(var(--cw)*.15));font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s .05s;}
.er-names .er-t .er-nm{display:block;}
.er-t.er-out{opacity:.25;}
.er-t.er-out .er-n{color:#475569;}
.er-t.er-in{border-color:rgba(165,180,252,.35);background:rgba(49,46,129,.35);}
.er-t.er-ok,.er-t.er-miss,.er-t.er-skip{background:linear-gradient(155deg,var(--a),var(--b));border-color:rgba(255,255,255,.4);box-shadow:0 8px 16px -8px rgba(0,0,0,.6);}
.er-t.er-ok .er-s,.er-t.er-miss .er-s,.er-t.er-skip .er-s{opacity:1;transform:none;}
.er-t.er-ok .er-nm,.er-t.er-miss .er-nm,.er-t.er-skip .er-nm{opacity:1;}
.er-t.er-ok .er-n,.er-t.er-miss .er-n,.er-t.er-skip .er-n{color:rgba(11,18,32,.65);}
.er-t.er-pop{animation:er-ok .55s var(--spring);}
@keyframes er-ok{0%{transform:scale(.4);}60%{transform:scale(1.25);box-shadow:0 0 0 6px rgba(165,180,252,.5);}100%{transform:none;}}
.er-t.er-miss,.er-t.er-skip{background:rgba(127,29,29,.45);border:1.5px dashed #fb7185;color:#fecdd3;}
.er-t.er-miss .er-n,.er-t.er-skip .er-n{color:#fda4af;}
.er-t.er-act{border-color:#f0abfc;box-shadow:0 0 0 2px rgba(240,171,252,.55),0 0 24px rgba(240,171,252,.45);animation:er-pulse 1.2s ease-in-out infinite;}
@keyframes er-pulse{50%{transform:scale(1.14);box-shadow:0 0 0 4px rgba(240,171,252,.35),0 0 34px rgba(240,171,252,.65);}}
.er-pause{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;border-radius:24px;background:rgba(2,6,23,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;}
.er-pause.er-show{display:flex;}
.er-pause h3{margin:0;font-size:1.6rem;}
.er-pause .er-cta{margin:0;max-width:300px;}
.er-s-ctrl{position:sticky;bottom:8px;z-index:6;margin-top:10px;}
.er-ctrl{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(30,41,59,.94),rgba(15,23,42,.97));box-shadow:0 20px 44px -20px rgba(0,0,0,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.er-orb{position:relative;flex:none;width:72px;height:72px;border:0;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -10px rgba(168,85,247,.9);transition:transform .4s var(--spring),background .4s;}
.er-orb:active{transform:scale(.9);}
.er-orb svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:2;}
.er-orb::before,.er-orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(196,181,253,.7);opacity:0;}
.er-orb.er-on::before{animation:er-ring 1.8s ease-out infinite;}
.er-orb.er-on::after{animation:er-ring 1.8s ease-out .9s infinite;}
.er-orb.er-hear{background:linear-gradient(135deg,#22d3ee,#6366f1);}
.er-orb.er-hear::before,.er-orb.er-hear::after{animation-duration:.9s;}
.er-orb.er-off{background:linear-gradient(135deg,#475569,#334155);box-shadow:none;}
.er-orb.er-bad{background:linear-gradient(135deg,#f59e0b,#b45309);}
@keyframes er-ring{from{opacity:.9;transform:scale(1);}to{opacity:0;transform:scale(1.8);}}
.er-say{flex:1;min-width:0;}
.er-status{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a5b4fc;}
.er-heard{margin-top:3px;font-size:1rem;line-height:1.3;color:#e2e8f0;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.er-heard.er-dim{color:#64748b;}
.er-acts{display:flex;gap:8px;flex:none;}
.er-ib{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:56px;padding:6px 8px;border-radius:16px;border:1px solid var(--line);background:rgba(30,41,59,.85);color:#e2e8f0;font-size:.66rem;font-weight:700;cursor:pointer;transition:transform .35s var(--spring),background .3s;}
.er-ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.er-ib:active{transform:scale(.9);background:rgba(51,65,85,.95);}
.er-typed{display:none;gap:8px;margin-top:8px;}
.er-typed.er-show{display:flex;}
.er-in{flex:1;min-width:0;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(15,23,42,.9);color:#f1f5f9;font-size:1rem;outline:none;}
.er-toast{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,10px) scale(.9);padding:8px 16px;border-radius:999px;font-size:.92rem;font-weight:700;background:rgba(15,23,42,.96);border:1px solid var(--line);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s var(--spring);max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
.er-toast.er-show{opacity:1;transform:translate(-50%,0) scale(1);}
.er-toast.ok{border-color:#4ade80;color:#bbf7d0;}
.er-toast.bad{border-color:#fb7185;color:#fecdd3;}
.er-toast.dim{color:#cbd5e1;}
.er-quit{display:none;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:#fda4af;}
.er-quit.er-show{display:flex;}

/* ── result ── */
.er-s-result{position:relative;}
.er-rescard{padding:20px;border-radius:28px;border:1px solid var(--line);background:var(--glass);text-align:center;overflow:hidden;animation:er-rise .7s var(--ease) both;}
.er-rescard h2{margin:0 0 4px;font-size:1.7rem;}
.er-rescard .er-sub{color:var(--mut);font-size:.9rem;}
.er-big{margin:12px 0 4px;font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;background:linear-gradient(135deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;}
.er-newbest{display:inline-block;margin:4px 0 8px;padding:4px 14px;border-radius:999px;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#451a03;font-weight:800;font-size:.82rem;animation:er-bump .8s var(--spring) both;}
.er-rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:14px;}
.er-rs div{padding:10px;border-radius:16px;background:rgba(148,163,184,.1);}
.er-rs span{display:block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;}
.er-rs b{font-size:1.25rem;font-variant-numeric:tabular-nums;}
.er-miss-h{margin:16px 0 8px;font-size:.9rem;font-weight:700;text-align:left;}
.er-missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;max-height:150px;overflow:auto;}
.er-missed span{padding:4px 10px;border-radius:999px;border:1px dashed #fb7185;background:rgba(127,29,29,.3);font-size:.78rem;color:#fecdd3;}
.er-resbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;}
.er-resbtns .er-cta{margin:0;width:auto;flex:1 1 220px;}
.er-conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.er-conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;background:var(--c);animation:er-fall var(--d) linear forwards;}
@keyframes er-fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.9;}}
@media(max-width:900px){.er-diffs{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.er-stats{grid-template-columns:1fr;}.er-modes{grid-template-columns:1fr;}.er-how{grid-template-columns:1fr;}.er-hud{grid-template-columns:1fr 1fr;}.er-time{grid-column:1/-1;}.er-brand h1{font-size:1.4rem;}.er-orb{width:62px;height:62px;}.er-ctrl{flex-wrap:wrap;gap:10px;}.er-acts{width:100%;justify-content:space-between;}.er-ib{flex:1;}.er-clue{min-width:64px;height:54px;font-size:1.7rem;}.er-sc{padding:10px 12px;}}

<body>

<div id="scr-erush" class="screen erush-root erush-st-setup">
  <div class="er-wrap">
    <div class="er-top">
      <button id="er-back" class="er-btn" type="button">← <span data-k="back">Πίνακας</span></button>
      <div class="er-brand"><h1>Element Rush</h1><p data-k="tag"></p></div>
    </div>

    <div class="er-main">
      <!-- 1 · menu -->
      <section class="er-sec er-s-setup">
        <div class="er-stats" id="er-stats"></div>
        <h2 class="er-h"><span class="er-step">1</span><span data-k="mode"></span></h2><div class="er-modes" id="er-modes"></div>
        <h2 class="er-h"><span class="er-step">2</span><span data-k="diff"></span></h2><div class="er-diffs" id="er-diffs"></div>
        <button id="er-start" class="er-cta" type="button"><b data-k="start"></b><small id="er-startsum"></small></button>
        <div class="er-info"><span id="er-vstate" class="er-vstate"><i></i><span></span></span><span id="er-best"></span></div>

        <div class="er-panel" id="er-coll">
          <div class="er-collhead"><h2 class="er-h"><span data-k="collTitle"></span></h2>
            <div class="er-seg" id="er-view"><button type="button" data-view="last" aria-pressed="true"></button><button type="button" data-view="coll" aria-pressed="false"></button></div></div>
          <p class="er-collsum" id="er-collsum"></p>
          <div id="er-collslot"></div>
          <div class="er-empty" id="er-empty"></div>
          <div class="er-legend" id="er-legend"></div>
          <div class="er-foundlist" id="er-foundlist"></div>
        </div>
        <div class="er-how" id="er-how"></div>
      </section>

      <!-- 2 · language -->
      <section class="er-sec er-s-lang">
        <h2 data-k="langQ"></h2><p data-k="langP"></p>
        <div class="er-langs" id="er-langs"></div>
        <button id="er-langback" class="er-btn" type="button" data-k="cancel"></button>
      </section>

      <!-- 3 · names passing in layers -->
      <section class="er-sec er-s-preview">
        <div class="er-pvhead"><div class="er-ring" id="er-pvring"><b id="er-pvsec">10</b></div><div><h2 data-k="pvTitle"></h2><p data-k="pvText"></p></div><button id="er-pvskip" class="er-btn" type="button" data-k="skip"></button></div>
        <div class="er-lanes" id="er-lanes"></div>
      </section>

      <!-- 4 · countdown -->
      <section class="er-sec er-s-count"><div id="er-count" class="er-count">3</div><p data-k="ready"></p></section>

      <!-- 5 · play -->
      <section class="er-sec er-s-play">
        <div class="er-hud">
          <div class="er-time" id="er-timebox"><div class="er-tring" id="er-tring"></div><b id="er-time">0:00</b></div>
          <div class="er-stat"><span data-k="score"></span><b id="er-score">0</b></div>
          <div class="er-stat"><span data-k="streak"></span><b id="er-streak">×1.0</b></div>
          <div class="er-stat"><span data-k="found"></span><b id="er-found">0/0</b></div>
        </div>
        <div class="er-prog" id="er-prog"><i></i></div>
        <div class="er-target" id="er-target"><div class="er-clue" id="er-clue">?</div><div><h3 id="er-tt"></h3><p id="er-tp"></p></div></div>
      </section>

      <div class="er-playslot" id="er-playslot"></div>

      <!-- the one periodic table: lives in the menu panel, or under the HUD while playing -->
      <div class="er-tablewrap" id="er-tablewrap"><div class="er-scroll" id="er-scroll"><div class="er-grid" id="er-grid"></div></div>
        <div class="er-pause" id="er-pause"><h3 data-k="paused"></h3><button id="er-resume" class="er-cta" type="button"><b data-k="resume"></b></button></div>
      </div>

      <section class="er-sec er-s-ctrl">
        <div class="er-ctrl">
          <div class="er-toast" id="er-toast"></div>
          <button id="er-orb" class="er-orb er-off" type="button" aria-label="Mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <div class="er-say"><div class="er-status" id="er-status"></div><div class="er-heard er-dim" id="er-heard"></div></div>
          <div class="er-acts">
            <button id="er-skipbtn" class="er-ib" type="button"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM18 5v14"/></svg><span data-k="skipB"></span></button>
            <button id="er-kbd" class="er-ib" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg><span data-k="kbd"></span></button>
            <button id="er-pausebtn" class="er-ib" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span data-k="pauseB"></span></button>
            <button id="er-quitbtn" class="er-ib" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-k="quitB"></span></button>
          </div>
        </div>
        <form id="er-typed" class="er-typed" autocomplete="off"><input id="er-in" class="er-in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="er-btn" type="submit" data-k="send"></button></form>
        <div id="er-quit" class="er-quit"><span data-k="quitQ"></span><button id="er-quityes" class="er-btn" type="button" data-k="yes"></button><button id="er-quitno" class="er-btn" type="button" data-k="no"></button></div>
      </section>

      <!-- 6 · result -->
      <section class="er-sec er-s-result"><div class="er-rescard" id="er-res"></div></section>

      <div class="fun-facts-slot"></div>
    </div>
  </div>
</div>

    var txt = alts[0] || ''; if (txt) { var h = $('er-heard'); h.textContent = L('heard') + ' ' + txt; h.className = 'er-heard'; }
    if (final && G.mode === 'A' && M.isSkip(G.lang, txt)) { skip(); return; }
    var opts = G.mode === 'A' ? { target: G.target } : {}, hits = [], a;
    if (final) { for (a = 0; a < alts.length && !hits.length; a++) hits = M.analyzeLive(G.idx, alts[a], true, opts); } else hits = M.analyzeLive(G.idx, txt, false, opts);

    var wait = [];
    hits.forEach(function (x) { if (x.late) wait.push(x.n); else route(x.n, final); });
    if (wait.length) G.lateT = setTimeout(function () { wait.forEach(function (n) { route(n, false); }); }, 350);
}
function saveRun(win) {
    if (!G || G.saved) return false; G.saved = true;
    save(LAST, { found: G.found.slice(), skipped: G.skipped.slice(), n: G.n, mode: G.mode, diff: dk, lang: G.lang, score: G.score, win: !!win, ts: Date.now() });
    var coll = load(COLL); G.found.forEach(function (n) { coll[n] = (coll[n] || 0) + 1; }); save(COLL, coll);
    var st = load(STATS); st.games = (st.games || 0) + 1; if (win) st.wins = (st.wins || 0) + 1; save(STATS, st);
    var key = G.mode + '-' + dk, all = load(BEST), prev = all[key] ? all[key].score : 0, isNew = G.score > prev && G.score > 0;
    if (isNew) { all[key] = { score: G.score, found: G.found.length, lang: G.lang }; save(BEST, all); } return isNew;
}
function savePartial() { if (G && !G.saved && !G.over && (G.found.length || G.skipped.length)) saveRun(false); }

    var win = reason === 'win'; if (win) G.score += Math.round(Math.max(0, (G.endAt - performance.now()) / 1000) * 3);

    var att = G.found.length + G.wrong + G.skipped.length, acc = att ? Math.round(G.found.length / att * 100) : 0, isNew = saveRun(win);
    $('er-res').innerHTML = '<h2>' + L(win ? 'rWin' : reason === 'time' ? 'rEnd' : 'rDone') + '</h2><div class="er-sub">' + L('d_' + dk) + ' · ' + L(G.mode === 'A' ? 'modeA' : 'modeB') + ' · ' + GNAME[G.lang] + '</div>' +
        '<div class="er-big" id="er-bigscore">0</div>' + (isNew ? '<div class="er-newbest">★ ' + L('rNew') + '</div>' : '') +
        '<div class="er-rs"><div><span>' + L('rFound') + '</span><b>' + G.found.length + '/' + G.n + '</b></div><div><span>' + L('rAcc') + '</span><b>' + acc + '%</b></div><div><span>' + L('rStreak') + '</span><b>' + G.bestStreak + '</b></div><div><span>' + L('rTime') + '</span><b>' + fmt(elapsed) + '</b></div></div>' +
        (missed.length ? '<div class="er-miss-h">' + L('rMissed', { n: missed.length }) + '</div><div class="er-missed">' + missed.map(function (e) { return '<span>' + e.s + ' · ' + e[G.lang] + '</span>'; }).join('') + '</div>' : '') +
        '<div class="er-resbtns"><button type="button" class="er-cta" id="er-again"><b>' + L('rAgain') + '</b></button><button type="button" class="er-btn" id="er-change">' + L('rChange') + '</button><button type="button" class="er-btn" id="er-totable">' + L('rTable') + '</button></div><div class="er-conf" id="er-conf"></div>';
    setStage('result'); countTo($('er-bigscore'), G.score); if (win && !reduce) confetti(); window.scrollTo(0, 0);

function countTo(el, to) { if (reduce || !to) { el.textContent = to; return; } var t0 = performance.now(); (function f(now) { var p = Math.min(1, (now - t0) / 1100); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1 && el.isConnected) requestAnimationFrame(f); })(t0); }
function confetti() {
    var box = $('er-conf'), cols = ['#a5b4fc', '#f0abfc', '#fde68a', '#4ade80', '#38bdf8', '#fb7185'], h = '';
    for (var i = 0; i < 46; i++) h += '<i style="left:' + Math.random() * 100 + '%;--c:' + cols[i % cols.length] + ';--d:' + (2.2 + Math.random() * 1.8).toFixed(2) + 's;--x:' + Math.round(Math.random() * 160 - 80) + 'px;animation-delay:' + (Math.random() * 0.6).toFixed(2) + 's"></i>';

function pauseGame() { if (!G || G.over || G.paused || stage !== 'play') return; G.paused = true; G.pauseAt = performance.now(); clearTimeout(G.lateT); Voice.pause(); Snd.pause(); $('er-pause').classList.add('er-show'); }

/* ───────────────────────── microphone (Web Speech API) ───────────────────────── */

    rec: null, want: false, muted: false, fails: 0, hearT: 0, primed: false,
    ui: function (state, msg) {
