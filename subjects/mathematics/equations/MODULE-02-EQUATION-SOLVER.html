}

/* ── System (2×2 / 3×3) tutor-mode helpers ── */
function ST(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.sysTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}

/* Method 1 (both sizes): Cramer's rule, enriched. is3 selects the
   2×2 vs 3×3 wording/quantities; the coefficient object shape
   differs accordingly (a1..c2/D/Dx/Dy for 2×2, plus c1_/c2_/c3_/z-
   related values for 3×3 — kept as a loosely-typed bag `co` rather
   than a rigid shape, since the two call sites differ only in which
   fields they fill in). */
function buildSystemCramerSteps(is3, co) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(ST('step1_title')), why:ST(is3?'sys3_step1_why':'sys2_step1_why'), work:'' });
    main.push({ title:TT(ST('std_title')), why:ST('cramer_why_title')+' — '+ST(is3?'sys3_cramer_why':'sys2_cramer_why'), work: co.stdForm });
    main.push({ title:TT(ST('det_main_title')), why:ST('det_main_why'), work: co.detWork });
    main.push({ title:TT(ST('det_sub_title'+(is3?'3':''))), why:ST('det_sub_why'), work: co.subDetWork });
    main.push({ title:TT(ST('solve_title')), why:ST(is3?'solve_why3':'solve_why'), work: co.solveWork });
    main.push({ title:TT(ST('verify_title')), why:ST('verify_why'), work: co.verifyWork });
    return main;
}
function buildSystemNoSolSteps(is3, stdForm) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    return [
        { title:TT(ST('step1_title')), why:ST(is3?'sys3_step1_why':'sys2_step1_why'), work:'' },
        { title:TT(ST('std_title')), why:'', work: stdForm },
        { title:TT(ST('nosol_title')), why:ST('nosol_why'), work:'' }
    ];
}
/* Method 2 (2×2 only): elimination, fully symmetric in x and y so it
   never needs to divide by a possibly-zero individual coefficient —
   each variable is eliminated by cross-multiplying by the OTHER
   equation's coefficient for that variable and subtracting, which
   only ever relies on the overall determinant D being nonzero
   (already guaranteed by the caller). */
function buildSystemEliminationSteps(a1,b1,c1,a2,b2,c2,D,x,y) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    alt.push({ title:TT(ST('alt_step1_title')), why:ST('alt_step1_why'),
        work: fmtNum(a1*b2)+'x + '+fmtNum(b1*b2)+'y = '+fmtNum(c1*b2)+'<br>'+fmtNum(a2*b1)+'x + '+fmtNum(b2*b1)+'y = '+fmtNum(c2*b1)
            +'<br>&nbsp;&nbsp;→&nbsp; ('+fmtNum(a1*b2-a2*b1)+')x = '+fmtNum(c1*b2-c2*b1)+' &nbsp;→&nbsp; x = '+fmtNum(x) });
    alt.push({ title:TT(ST('alt_step2_title')), why:ST('alt_step2_why'),
        work: fmtNum(a1*a2)+'x + '+fmtNum(b1*a2)+'y = '+fmtNum(c1*a2)+'<br>'+fmtNum(a2*a1)+'x + '+fmtNum(b2*a1)+'y = '+fmtNum(c2*a1)
            +'<br>&nbsp;&nbsp;→&nbsp; ('+fmtNum(b1*a2-b2*a1)+')y = '+fmtNum(c1*a2-c2*a1)+' &nbsp;→&nbsp; y = '+fmtNum(y) });
    alt.push({ title:'', why:'', work: ST('alt_match_ok') });
    return alt;
}

/* Method 2 (3×3 only): Gaussian elimination with partial pivoting — a
   genuinely different worked path from Cramer's determinants (which
   is what Method 1 uses for both sizes). Since the caller only builds
   this after confirming the overall determinant D≠0, a fully-zero
   pivot column can never occur at any stage here — that would force
   D=0 — so plain partial pivoting always succeeds; no separate
   "no unique solution" branch is needed inside Method 2 itself (that
   case is already handled upstream, before Method 2 is even built).
   rows is [[a1,b1,c1,d1],[a2,b2,c2,d2],[a3,b3,c3,d3]]; cramerX/Y/Z are
   Method 1's already-computed solution, used only for the final
   match-confirmation line. */
function build3x3EliminationSteps(rows, cramerX, cramerY, cramerZ) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    var R=rows.map(function(r){return r.slice();});

    // ── Step A: eliminate x, pivoting on the largest |x-coefficient| ──
    var pivA=0;
    for (var i=1;i<3;i++) if (Math.abs(R[i][0])>Math.abs(R[pivA][0])) pivA=i;
    var order=[0,1,2].filter(function(i){return i!==pivA;});
    var pivotRow=R[pivA];
    var swapNoteA = pivA!==0 ? fillTpl(ST('sys3alt_swap_note'),{n:pivA+1}) : '';
    var elimWorkA=[], reduced=[];
    order.forEach(function(i){
        var row=R[i];
        var m=row[0]/pivotRow[0];
        var newRow=[row[1]-m*pivotRow[1], row[2]-m*pivotRow[2], row[3]-m*pivotRow[3]];
        elimWorkA.push('('+(T('eq_step_prefix')||'Eq')+' '+(i+1)+') − ('+fmtNum(m)+')·('+(T('eq_step_prefix')||'Eq')+' '+(pivA+1)+'):&nbsp; '
            +fmtNum(newRow[0])+'y + '+fmtNum(newRow[1])+'z = '+fmtNum(newRow[2]));
        reduced.push(newRow);
    });
    alt.push({ title:TT(ST('sys3alt_stepA_title')), why:ST('sys3alt_stepA_why'),
        work: (swapNoteA?swapNoteA+'<br>':'')+elimWorkA.join('<br>') });

    // ── Step B: eliminate y from the reduced 2-row (y,z) system ──
    var pivB = Math.abs(reduced[0][0])>=Math.abs(reduced[1][0]) ? 0 : 1;
    var otherB=1-pivB;
    var pivRow2=reduced[pivB], otherRow2=reduced[otherB];
    var mB=otherRow2[0]/pivRow2[0];
    var finalZRow=[otherRow2[1]-mB*pivRow2[1], otherRow2[2]-mB*pivRow2[2]]; // [z-coeff, rhs]
    alt.push({ title:TT(ST('sys3alt_stepB_title')), why:ST('sys3alt_stepB_why'),
        work: '('+fmtNum(otherRow2[0])+'y + '+fmtNum(otherRow2[1])+'z = '+fmtNum(otherRow2[2])+') − ('+fmtNum(mB)+')·('
            +fmtNum(pivRow2[0])+'y + '+fmtNum(pivRow2[1])+'z = '+fmtNum(pivRow2[2])+'):&nbsp; '
            +fmtNum(finalZRow[0])+'z = '+fmtNum(finalZRow[1]) });

    // ── Step C: solve z ──
    var zVal=finalZRow[1]/finalZRow[0];
    alt.push({ title:TT(ST('sys3alt_stepC_title')), why:ST('sys3alt_stepC_why'),
        work: 'z = '+fmtNum(finalZRow[1])+' / '+fmtNum(finalZRow[0])+' = '+fmtNum(zVal) });

    // ── Step D: back-substitute for y using Step B's pivot equation ──
    var yVal=(pivRow2[2]-pivRow2[1]*zVal)/pivRow2[0];
    alt.push({ title:TT(ST('sys3alt_stepD_title')), why:ST('sys3alt_stepD_why'),
        work: 'y = ('+fmtNum(pivRow2[2])+' − ('+fmtNum(pivRow2[1])+')('+fmtNum(zVal)+')) / '+fmtNum(pivRow2[0])+' = '+fmtNum(yVal) });

    // ── Step E: back-substitute for x using Step A's original pivot equation ──
    var xVal=(pivotRow[3]-pivotRow[1]*yVal-pivotRow[2]*zVal)/pivotRow[0];
    alt.push({ title:TT(ST('sys3alt_stepE_title')), why:ST('sys3alt_stepE_why'),
        work: 'x = ('+fmtNum(pivotRow[3])+' − ('+fmtNum(pivotRow[1])+')('+fmtNum(yVal)+') − ('+fmtNum(pivotRow[2])+')('+fmtNum(zVal)+')) / '+fmtNum(pivotRow[0])+' = '+fmtNum(xVal) });

    var matchOk = Math.abs(xVal-cramerX)<1e-4 && Math.abs(yVal-cramerY)<1e-4 && Math.abs(zVal-cramerZ)<1e-4;
    alt.push({ title:'', why:'', work: matchOk?ST('sys3alt_match_ok'):'' });
    return alt;
}

function splitOnOp(input) {
    var ops = [['>=','≥'],['<=','≤'],['>','>'],[' < ',' < '],['<','<'],['=','=']];
    for (var i=0; i<ops.length; i++) {
        var op=ops[i][0], disp=ops[i][1];
        var idx = input.indexOf(op);
        if (idx !== -1) return {left:input.slice(0,idx).trim(), right:input.slice(idx+op.length).trim(), op:op.trim(), opDisplay:disp};
    }
    return null;
}

function solveLinearExpr(left, right) {
    var f = mkFn(left, right);
    var f0=f(0), f1=f(1), f2=f(2);
    var a=f1-f0, b=f0;
    if (Math.abs(f2-(2*a+b)) > 1e-6) return null;
    if (Math.abs(a) < 1e-12) return Math.abs(b)<1e-8 ? {type:'infinite', a:a, b:b} : {type:'none', a:a, b:b};
    return {type:'linear', x:-b/a, a:a, b:b};
}

function solveQuadraticExpr(left, right) {
    var f=mkFn(left,right), f0=f(0), f1=f(1), fm1=f(-1);
    var a=(f1+fm1-2*f0)/2, b=(f1-fm1)/2, c=f0;
    var disc=b*b-4*a*c;
    if (Math.abs(a)<1e-12) return null;
    if (disc<0) { var re=-b/(2*a), im=Math.sqrt(-disc)/(2*a); return {type:'complex',a,b,c,disc,re,im}; }
    if (Math.abs(disc)<1e-12) return {type:'one',a,b,c,x1:-b/(2*a)};
    var sq=Math.sqrt(disc);
    return {type:'two',a,b,c,disc,x1:(-b+sq)/(2*a),x2:(-b-sq)/(2*a)};
}

function describeInterval(op, x) {
    var xStr=fmtNum(x);
    if (op==='>') return {res:'x > '+xStr, interval:'('+xStr+', +∞)'};
    if (op==='<') return {res:'x < '+xStr, interval:'(−∞, '+xStr+')'};
    if (op==='>=') return {res:'x ≥ '+xStr, interval:'['+xStr+', +∞)'};
    if (op==='<=') return {res:'x ≤ '+xStr, interval:'(−∞, '+xStr+']'};
    return {res:xStr, interval:''};
}

/* ── Core solvers ── */
/* Shows the #eq-result-panel wrapper alongside the result div itself
   — this exact pair of display toggles was repeated at every single
   solve outcome (success or warning) across every solver in this
   file. */
function revealEqResult(result) {
    result.style.display='block';
    var panel=document.getElementById('eq-result-panel'); if(panel) panel.style.display='block';
}
/* result.innerHTML=X; revealEqResult(result); was repeated at every
   successful-solve return point across every solver in this file. */
function finishEqResult(result, html) {
    result.innerHTML=html;
    revealEqResult(result);
}
function hideEqResult(result) {
    if (result) result.style.display='none';
    var panel=document.getElementById('eq-result-panel'); if(panel) panel.style.display='none';
}
function hideEqPlot() {
    var plotDiv=document.getElementById('eq-plot'); if(plotDiv) plotDiv.style.display='none';
}
/* Shared "show a warning message" — only the state-clearing that
   follows differs per call site, so that stays inline at each one. */
function showEqWarning(result, key) {
    result.innerHTML='<div class="eq-block eq-warn">⚠️ '+T(key)+'</div>';
    revealEqResult(result);
}
function solveEquationImpl() {
    var raw = (document.getElementById('eq-input')&&document.getElementById('eq-input').value||'').trim();
    var result = document.getElementById('eq-result');
    /* Compare curves belong to whatever equation is currently being
       solved — reset them at the start of every solve cycle (new
       input, or a chip switch that clears the input) rather than
       leaving a stale comparison against a no-longer-visible curve.
       addCompareCurve/removeCompareCurve call plotEquation directly
       and never go through here, so this doesn't fight the user
       while they're actively adding/removing compare curves. */
    _eqCompareCurves=[];
    var cmpBox0=document.getElementById('eq-compare-box'); if(cmpBox0) cmpBox0.style.display='none';
    var cmpChips0=document.getElementById('eq-compare-chips'); if(cmpChips0) cmpChips0.innerHTML='';
    var exHint0=document.getElementById('eq-exercise-hint'); if(exHint0) exHint0.style.display='none';
    if (!raw) { result.style.display='none'; return; }
    var input = raw.replace(/\s+/g,' ').replace(/−/g,'-').replace(/–/g,'-')
                   .replace(/≥/g,'>=').replace(/≤/g,'<=');
    try {
        /* system/system3 must be checked BEFORE the generic λ-catch-all
           below: that check only ever looked at the first input field,
           so a λ typed into eq1 while on the System chip was being
           wrongly grabbed by solveParametric() as if it were a lone
           equation — and a λ typed only into eq2 fell through to the
           plain solveSystem(), which has no idea what λ is. Fixed by
           checking both of a system's own fields for λ right here. */
        if (MultiCalc.state.eqMode==='system3') {
            var r2=(document.getElementById('eq-input2')&&document.getElementById('eq-input2').value||'').trim();
            var r3=(document.getElementById('eq-input3')&&document.getElementById('eq-input3').value||'').trim();
            if (!r2||!r3){result.style.display='none';return;}
            var r2c=r2.replace(/−/g,'-'), r3c=r3.replace(/−/g,'-');
            if (/λ/.test(input)||/λ/.test(r2c)||/λ/.test(r3c)) {
                showEqWarning(result, 'eqParamSystemNotSupported3');
                return;
            }
            solveSystem3(input,r2c,r3c,result); return;
        }
        if (MultiCalc.state.eqMode==='system') {
            var raw2=(document.getElementById('eq-input2')&&document.getElementById('eq-input2').value||'').trim();
            if (!raw2){result.style.display='none';return;}
            var eq2c=raw2.replace(/−/g,'-');
            if (/λ/.test(input)||/λ/.test(eq2c)) { solveParametricSystem(input,eq2c,result); return; }
            solveSystem(input,eq2c,result); return;
        }
        if (MultiCalc.state.eqMode==='param'||/λ/.test(input)) { solveParametric(input,result); return; }
        if (/\|/.test(input)||MultiCalc.state.eqMode==='absolute') { solveAbsolute(input,result); return; }
        if (MultiCalc.state.eqMode==='rational'||/\(.*\)\/\(/.test(input)) { solveRational(input,result); return; }
        if (MultiCalc.state.eqMode==='trig'||/sin|cos|tan|asin|acos|atan/.test(input)) { solveTrigonometric(input,result); return; }
        if (MultiCalc.state.eqMode==='log'||/log|ln\(|log10/.test(input)) { solveLogarithmic(input,result); return; }
        if (MultiCalc.state.eqMode==='poly'||/\^[4-9]|\^\d{2}/.test(input)) { solvePolynomial(input,result); return; }

        var parsed=splitOnOp(input);
        if (!parsed) throw new Error('no_operator');
        var left=parsed.left, right=parsed.right, op=parsed.op, opDisplay=parsed.opDisplay;
        var isInequality=op!=='=';
        var isCubic=/x\s*\*{2}\s*3|x³|x\^3/i.test(input);
        var isQuad=!isCubic&&/x\s*\*{2}\s*2|x²|x\^2/i.test(input);

        if (MultiCalc.state.eqMode==='cubic'||isCubic) {
            solveCubicEq(left,right,op,isInequality,result);
            if (!isInequality) plotEquation(left,right);
            else hideEqPlot();
            return;
        }
        if (MultiCalc.state.eqMode==='exp'||/\d\s*\^\s*x|e\s*\^\s*x|exp\(/.test(input)) { solveExponential(input,result); return; }

        if (isQuad) {
            var sol=solveQuadraticExpr(left,right);
            if (!sol){showLinear(left,right,op,opDisplay,result,isInequality);return;}
            var aS=fmtNum(sol.a),bS=fmtNum(sol.b),cS=fmtNum(sol.c);
            var aT=fmtNumTex(sol.a),bT=fmtNumTex(sol.b),cT=fmtNumTex(sol.c);
            var stdFormTex=aT+'x^2 '+(sol.b>=0?'+ ':'')+bT+'x '+(sol.c>=0?'+ ':'')+cT+' = 0';
            var discVal = sol.b*sol.b - 4*sol.a*sol.c;
            var html='<div class="eq-answer">'+T('eqQuadTitle')+'</div>';
            html+='<div class="eq-block">'+T('eqStandardForm')+' '+KX(stdFormTex)+'<br>'+KX('\\Delta = b^2 - 4ac = '+fmtNumTex(discVal))+'</div>';
            var quadExtra=null;
            if (sol.type==='complex') {
                var re=fmtNumTex(sol.re),im=fmtNumTex(Math.abs(sol.im));
                html+='<div class="eq-answer">'+KX('x_1 = '+re+' + '+im+'i',true)+'</div><div class="eq-answer">'+KX('x_2 = '+re+' - '+im+'i',true)+'</div>';
                html+='<div class="eq-block eq-warn">⚠️ '+T('eqNoRealRootsDelta')+'</div>';
            } else if (sol.type==='one') {
                html+='<div class="eq-answer">'+KX('x = '+fmtNumTex(sol.x1),true)+' <small>'+T('eqDoubleRoot')+'</small></div>';
                html+='<div class="eq-block">'+verifyFmt(left,right,sol.x1)+'</div>';
            } else {
                if (isInequality) {
                    var x1r=sol.x1<sol.x2?sol.x1:sol.x2, x2r=sol.x1<sol.x2?sol.x2:sol.x1;
                    var mid=(x1r+x2r)/2, fMid=mkFn(left,right)(mid);
                    var inner=(op==='<'||op==='<=')?fMid<0:fMid>0;
                    var br=op.includes('='),bl=op.includes('=');
                    var interval=inner?(bl?'[':'(')+fmtNum(x1r)+', '+fmtNum(x2r)+(br?']':')'):'(−∞, '+fmtNum(x1r)+(br?']':')')+'  ∪ '+(bl?'[':'(')+fmtNum(x2r)+', +∞)';
                    html+='<div class="eq-answer">'+interval+'</div>';
                    html+='<div class="eq-block">'+T('eq_roots')+': '+KX('x_1='+fmtNumTex(x1r)+',\\ x_2='+fmtNumTex(x2r))+'</div>';
                    quadExtra={work:'f('+fmtNum(mid)+') '+(fMid<0?'&lt; 0':'&gt; 0')+' → '+(inner?QT('step7_between'):QT('step7_outside'))+' → '+interval};
                } else {
                    html+='<div class="eq-answer">'+KX('x_1 = '+fmtNumTex(sol.x1),true)+'</div><div class="eq-answer">'+KX('x_2 = '+fmtNumTex(sol.x2),true)+'</div>';
                    html+='<div class="eq-block">'+verifyFmt(left,right,sol.x1)+'<br>'+verifyFmt(left,right,sol.x2)+'</div>';
                }
            }
            var quadMainSteps=buildQuadraticTutorSteps(sol,left,right,isInequality,quadExtra);
            var quadAltSteps=buildCompletingSquareSteps(sol);
            displaySteps(quadMainSteps, quadAltSteps, QT('method_square_title'));
            finishEqResult(result, html);
        } else {
            showLinear(left,right,op,opDisplay,result,isInequality);
        }
        if (!isInequality&&MultiCalc.state.eqMode!=='system'&&MultiCalc.state.eqMode!=='system3') plotEquation(left,right);
        else hideEqPlot();
    } catch(e) {
        result.innerHTML='<div class="eq-nosol" style="font-size:0.85rem;">'+T('eqCannotParse')+'</div>';
        revealEqResult(result);
    } finally {
        requestAnimationFrame(function(){
            var panel=document.getElementById('eq-result-panel');
            if(panel&&panel.style.display!=='none') panel.scrollIntoView({behavior:'smooth',block:'start'});
        });
    }
}

/* Numerically recovers a cubic's own a,b,c,d (in ax^3+bx^2+cx+d form)
   from 4 sample evaluations via finite differences — exact for a true
   cubic, and works regardless of how the input expression is written
   (no symbolic parsing needed, matches this file's numeric-only style). */
function extractCubicCoeffs(fn) {
    var fm1=fn(-1), f0=fn(0), f1=fn(1), f2=fn(2);
    var d = f0;
    var b = (f1+fm1)/2 - d;
    var a = (f2 - 4*b - d - f1 + fm1) / 6;
    var c = (f1 - fm1)/2 - a;
    return {a:a,b:b,c:c,d:d};
}

/* Completes a cubic's root set to all 3 roots given the real ones the
   scan already found. A cubic's roots are either 3 real, or 1 real +
   a complex-conjugate pair — never anything else — so:
   - 1 known real root r: deflate by (x-r) via synthetic division to
     get a quadratic; its discriminant decides whether the remaining
     two are real (possibly a same-sign double root the scan can't
     see, e.g. (x-1)^2(x+2)) or a genuine complex-conjugate pair.
   - 2 known real roots: the third is forced by Vieta's formula
     (sum of roots = -b/a) — always real, no need to deflate at all. */
/* ── Cubic tutor-mode numeric helpers ── */
function isNearInt(v) { return Math.abs(v-Math.round(v)) < 1e-6; }

function divisorsOf(n) {
    n = Math.abs(Math.round(n));
    if (n === 0) return [1];
    var divs=[];
    for (var i=1; i<=n; i++) { if (n % i === 0) divs.push(i); }
    return divs;
}

/* Rational Root Theorem candidate list: every ±p/q with p a divisor
   of d and q a divisor of a. d=0 is handled as a special case (x=0 is
   then trivially a root — "p divides 0" is true for every integer p,
   so restricting to actual divisors of 0 doesn't make sense; we just
   make sure 0 itself is tested). */
function rationalRootCandidates(a, d) {
    var cands=[], seen={};
    function add(v){ var k=v.toFixed(9); if(!seen[k]){seen[k]=true; cands.push(v);} }
    if (Math.round(d) === 0) add(0);
    var pDivs=divisorsOf(d===0?1:d), qDivs=divisorsOf(a);
    pDivs.forEach(function(p){ qDivs.forEach(function(q){ add(p/q); add(-p/q); }); });
    cands.sort(function(x,y){ return Math.abs(x)-Math.abs(y) || x-y; });
    return cands;
}

/* Finds an integer bracket [lo,hi] around a known real root where
   fn(lo) and fn(hi) have opposite signs — used to illustrate the
   Intermediate Value Theorem step with clean, readable numbers
   instead of the (usually ugly) exact bracket the internal 0.1-step
   scan happened to land on. */
function findIntegerBracket(fn, root) {
    var lo=Math.floor(root), hi=Math.ceil(root);
    if (lo===hi) hi=lo+1;
    var flo=fn(lo), fhi=fn(hi);
    for (var w=1; w<=6 && !(isFinite(flo)&&isFinite(fhi)&&flo*fhi<0); w++) {
        lo=Math.floor(root)-w; hi=Math.ceil(root)+w;
        flo=fn(lo); fhi=fn(hi);
    }
    return {lo:lo, hi:hi, flo:flo, fhi:fhi};
}

/* Runs real Newton-Raphson iterations from x0 toward targetRoot,
   stopping once within 1e-6 of it (or after 6 iterations as a
   safety cap) — used to show a genuine, honest convergence demo
   with real numbers, not a fabricated one. */
function runNewtonDemo(fn, dfn, x0, targetRoot) {
    var iters=[], x=x0;
    for (var i=0; i<6; i++) {
        var fx=fn(x);
        iters.push({x:x, fx:fx});
        if (Math.abs(x-targetRoot) < 1e-6) break;
        var dfx=dfn(x);
        if (Math.abs(dfx) < 1e-12) break;
        x = x - fx/dfx;
    }
    return iters;
}

var _SUBDIGITS=['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
function subIdx(i) { return String(i).split('').map(function(ch){return _SUBDIGITS[+ch]||ch;}).join(''); }

/* Builds a step title with a dynamically-computed step number,
   reusing the already-translated 'eq_step_prefix' word (Βήμα/Step/
   Paso). Needed because cubic's step count/order varies by branch
   (1 root found by the scan vs 2 vs 3), unlike quadratic/linear's
   fixed-length sequences where the step number could safely be
   baked directly into the stored translation string. */
function stepTitle(n, suffix) {
    var t=_eqTranslations[MultiCalc.state.currentLang]||_eqTranslations['en'];
    return (t.eq_step_prefix||'Step')+' '+n+': '+suffix;
}

function completeCubicRoots(fn, realRoots) {
    if (realRoots.length >= 3) return {extraReal:[], complex:null};
    var co=extractCubicCoeffs(fn), a=co.a, b=co.b, c=co.c;
    if (realRoots.length === 2) {
        return {extraReal:[ -b/a - realRoots[0] - realRoots[1] ], complex:null};
    }
    var r=realRoots[0], A=a, B=b+a*r, C=c+(b+a*r)*r, disc=B*B-4*A*C;
    if (disc >= -1e-6) {
        var sq=Math.sqrt(Math.max(disc,0));
        return {extraReal:[(-B+sq)/(2*A), (-B-sq)/(2*A)], complex:null};
    }
    return {extraReal:[], complex:{re:-B/(2*A), im:Math.sqrt(-disc)/(2*A)}};
}

function solveCubicEq(left, right, op, isInequality, result) {
    var fn=mkFn(left,right);

    if (isInequality) {
        var criticalC=findFunctionCriticalPoints(fn,-1000,1000,0.1);
        var segsC=buildSignChartSegments(fn,criticalC,op);
        var intervalC=formatIntervalUnion(segsC, T('eqNoSolutionSet'));
        var rootsC=criticalC.filter(function(c){return c.kind==='root';});
        var htmlC='<div class="eq-answer">'+T('eqCubicIneqTitle')+'</div>';
        htmlC+='<div class="eq-answer">'+intervalC+'</div>';
        if (rootsC.length) htmlC+='<div class="eq-block">'+T('eq_roots')+': '+KX(rootsC.map(function(r,i){return 'x_'+(i+1)+'='+fmtNumTex(r.x);}).join(',\\ '))+'</div>';
        var ineqMain=buildCubicIneqTutorSteps(fn, criticalC, op);
        var ineqAlt=buildCubicRRTSteps(fn, rootsC.map(function(r){return r.x;}));
        displaySteps(ineqMain, ineqAlt, CT('alt_method_title'), CT('alt_intro'));
        result.innerHTML=htmlC; revealEqResult(result);
        return;
    }

    var dfn=makeNumericDeriv(fn);
    var roots=[],scan=1000,step=0.1;
    for (var x=-scan; x<scan; x+=step) {
        var y1=fn(x), y2=fn(x+step);
        if (isFinite(y1)&&isFinite(y2)&&y1*y2<0) {
            var r=x+step/2;
            for (var i=0;i<50;i++){var d=dfn(r);if(Math.abs(d)<1e-14)break;r-=fn(r)/d;}
            r=Math.round(r*1e9)/1e9;
            if (roots.every(function(e){return Math.abs(e-r)>1e-6;})) roots.push(r);
        }
    }
    roots.sort(function(a,b){return a-b;});
    if (!roots.length) {
        displaySteps(buildCubicNoRootSteps(fn));
        result.innerHTML='<div class="eq-block eq-warn">'+T('eqCubicNoRoots')+'</div>';
        revealEqResult(result); return;
    }
    var scanRoots=roots.slice();

    var completed=completeCubicRoots(fn,roots), complexPair=completed.complex;
    completed.extraReal.forEach(function(r){
        if (roots.every(function(e){return Math.abs(e-r)>1e-6;})) roots.push(r);
    });
    roots.sort(function(a,b){return a-b;});
    var totalCount = complexPair ? 3 : roots.length;

    var cubMain=buildCubicTutorSteps(fn,left,right,scanRoots,completed);
    var cubAlt=buildCubicRRTSteps(fn, roots);
    displaySteps(cubMain, cubAlt, CT('alt_method_title'), CT('alt_intro'));

    var titleFn=T('eqCubicTitle');
    var html='<div class="eq-answer">'+(typeof titleFn==='function'?titleFn(totalCount):titleFn)+'</div>';
    roots.forEach(function(r,i){html+='<div class="eq-answer">'+KX((totalCount>1?'x_'+(i+1):'x')+' = '+fmtNumTex(r),true)+'</div>';});
    html+='<div class="eq-block">';
    roots.forEach(function(r){html+=verifyFmt(left,right,r)+'<br>';});
    if (complexPair) {
        var reT=fmtNumTex(complexPair.re), imT=fmtNumTex(Math.abs(complexPair.im));
        html+=KX('x_'+(roots.length+1)+' = '+reT+' + '+imT+'i',true)+'<br>'+KX('x_'+(roots.length+2)+' = '+reT+' - '+imT+'i',true)+'<br>';
        html+='<span class="eq-warn">⚠️ '+T('eqCubicComplexNote')+'</span><br>';
    }
    html+='<small style="opacity:0.5;">'+T('eqSolvedNR')+'</small></div>';
    finishEqResult(result, html);
}

function solveAbsolute(input, result) {
    var m=input.match(/\|([^|]+)\|\s*(=|>=|<=|>|<)\s*(.+)/);
    if (!m) throw new Error('bad_abs');
    var inner=m[1], op=m[2], c=parseFloat(m[3].trim());
    if (isNaN(c)) throw new Error('bad_abs_rhs');
    var isInequality = op!=='=';
    var html='';
    if (!isInequality) {
        if (c<0) { html='<div class="eq-answer eq-nosol">'+T('eqAbsNoSol')+'</div><div class="eq-block">'+T('eqAbsNegative')+'</div>'; }
        else if (c===0) {
            var sol0=solveLinearExpr(inner.trim(),'0');
            if (!linSolved(sol0)) { html='<div class="eq-block eq-warn">'+T('eqAbsCannotSolve')+'</div>'; }
            else html='<div class="eq-answer">'+KX('x = '+fmtNumTex(sol0.x),true)+'</div>';
        } else {
            var s1=solveLinearExpr(inner.trim(),c.toString()), s2=solveLinearExpr(inner.trim(),(-c).toString());
            if (!linSolved(s1) || !linSolved(s2)) { html='<div class="eq-block eq-warn">'+T('eqAbsCannotSolve')+'</div>'; }
            else {
                html='<div class="eq-answer">'+KX('x_1 = '+fmtNumTex(s1.x),true)+'</div><div class="eq-answer">'+KX('x_2 = '+fmtNumTex(s2.x),true)+'</div>';
                var c1fn=T('eqAbsCase1'),c2fn=T('eqAbsCase2');
                html+='<div class="eq-block">'+(typeof c1fn==='function'?c1fn(inner,c):'Case 1: '+inner+' = '+c)+' → x = '+fmtNum(s1.x)+'<br>'+(typeof c2fn==='function'?c2fn(inner,c):'Case 2: '+inner+' = −'+c)+' → x = '+fmtNum(s2.x)+'</div>';
            }
        }
    } else {
        /* |inner| op c — the sign of c genuinely changes which answer
           is correct (|inner|>=0 always, so e.g. |inner|>-3 is true
           for every x, and |inner|<-3 is impossible for any x). The
           previous code treated c as if it were always positive and
           produced a numerically-bogus interval in both of those
           cases instead of "all reals" / "no solution". */
        var lower=(op==='<'||op==='<='), strict=(op==='<'||op==='>');
        if (c<0) {
            html = lower ? '<div class="eq-answer eq-nosol">'+T('eqNoSolutionSet')+'</div>' : '<div class="eq-answer">(−∞, +∞)</div>';
        } else if (c===0 && lower && strict) {
            html = '<div class="eq-answer eq-nosol">'+T('eqNoSolutionSet')+'</div>';
        } else if (c===0 && !lower && !strict) {
            html = '<div class="eq-answer">(−∞, +∞)</div>';
        } else if (c===0) {
            var solZ=solveLinearExpr(inner.trim(),'0');
            if (!linSolved(solZ)) { html='<div class="eq-block eq-warn">'+T('eqAbsCannotSolve')+'</div>'; }
            else if (lower) html='<div class="eq-answer">'+KX('x = '+fmtNumTex(solZ.x),true)+'</div>'; // |A|<=0 -> A=0
            else html='<div class="eq-answer">(−∞, '+fmtNum(solZ.x)+') ∪ ('+fmtNum(solZ.x)+', +∞)</div>'; // |A|>0 -> everywhere except A=0
        } else {
            var sol1=solveLinearExpr(inner.trim(),c.toString()), sol2=solveLinearExpr(inner.trim(),(-c).toString());
            if (!linSolved(sol1) || !linSolved(sol2)) { html='<div class="eq-block eq-warn">'+T('eqAbsCannotSolve')+'</div>'; }
            else {
                var xx1=Math.min(sol1.x,sol2.x), xx2=Math.max(sol1.x,sol2.x);
                if (lower) html='<div class="eq-answer">'+(strict?'(':'[')+fmtNum(xx1)+', '+fmtNum(xx2)+(strict?')':']')+'</div>';
                else html='<div class="eq-answer">(−∞, '+fmtNum(xx1)+(strict?')':']')+' ∪ '+(strict?'(':'[')+fmtNum(xx2)+', +∞)</div>';
            }
        }
    }
    var absMain=buildAbsTutorSteps(inner, c, op, isInequality);
    var absAlt=buildAbsPiecewiseSteps(inner, c, op, isInequality);
    displaySteps(absMain, absAlt, AT('alt_method_title'), AT('alt_intro'));
    finishEqResult(result, html);
}

/* Finds every critical point of fn(x) across [xMin,xMax]: both
   genuine roots (fn crosses zero) and domain gaps (fn undefined /
   blows up — a zero denominator, or a value outside a function's
   domain). Used to build a sign chart for solving INEQUALITIES
   numerically — several solvers in this file used to call splitOnOp()
   to get the comparison operator and then silently ignore it,
   always treating the input as "=" (e.g. solveRational() reporting
   "Rational Equation" for an input typed with ">="). A plain
   root-vs-pole sign change looks identical from the two sample
   points alone (both finite, opposite sign) — a pole just means the
   magnitude keeps GROWING as we zoom in with bisection instead of
   shrinking toward zero, which is what distinguishes them below. */
function findFunctionCriticalPoints(fn, xMin, xMax, step) {
    var points=[];
    function isNum(v){ return typeof v==='number' && !isNaN(v); }
    var prevX=xMin, prevY=fn(xMin);
    for (var x=xMin+step; x<=xMax+1e-9; x+=step) {
        var y=fn(x);
        var prevFinite=isNum(prevY)&&isFinite(prevY), curFinite=isNum(y)&&isFinite(y);
        if (prevFinite&&curFinite&&prevY===0) {
            points.push({x:prevX,kind:'root'});
        } else if (prevFinite&&curFinite&&prevY*y<0) {
            var a=prevX,b=x,fa=prevY;
            var origMag=Math.min(Math.abs(prevY),Math.abs(y));
            for (var i=0;i<60;i++){
                var m=(a+b)/2, fm=fn(m);
                if (!isFinite(fm)) break;
                if ((fa<0)===(fm<0)) { a=m; fa=fm; } else { b=m; }
            }
            var r=(a+b)/2, fr=fn(r);
            points.push({x:Math.round(r*1e9)/1e9, kind:(isFinite(fr)&&Math.abs(fr)<origMag)?'root':'gap'});
        } else if (prevFinite!==curFinite) {
            var lo=prevX,hi=x,loFinite=prevFinite;
            for (var j=0;j<60;j++){
                var mid=(lo+hi)/2, fmid=fn(mid);
                if ((isNum(fmid)&&isFinite(fmid))===loFinite) lo=mid; else hi=mid;
            }
            points.push({x:Math.round(((lo+hi)/2)*1e6)/1e6, kind:'gap'});
        }
        prevX=x; prevY=y;
    }
    points.sort(function(a,b){return a.x-b.x;});
    var merged=[];
    points.forEach(function(pt){
        if (merged.length&&Math.abs(merged[merged.length-1].x-pt.x)<1e-3) {
            if (pt.kind==='gap') merged[merged.length-1].kind='gap';
            return;
        }
        merged.push(pt);
    });
    return merged;
}

/* Builds the x-intervals where fn(x) satisfies op, from the critical
   points above. probeX is only used when there are NO critical
   points at all (fn keeps one constant sign across the whole scanned
   range) — default 0; a caller whose function is undefined at 0
   (e.g. logarithms) should pass a safe in-domain probe instead. */
function buildSignChartSegments(fn, critical, op, probeX) {
    probeX = probeX===undefined ? 0 : probeX;
    var wantPos=(op==='>'||op==='>='), strict=(op==='>'||op==='<');
    var n=critical.length, segments=[];
    for (var k=0;k<=n;k++){
        var lo=k===0?-Infinity:critical[k-1].x, hi=k===n?Infinity:critical[k].x;
        var mid=(isFinite(lo)&&isFinite(hi))?(lo+hi)/2:(isFinite(lo)?lo+1:(isFinite(hi)?hi-1:probeX));
        var val=fn(mid);
        if (isFinite(val)&&(wantPos?val>0:val<0)) {
            segments.push({
                lo:lo, hi:hi,
                loInc:isFinite(lo)&&critical[k-1].kind==='root'&&!strict,
                hiInc:isFinite(hi)&&critical[k].kind==='root'&&!strict
            });
        }
    }
    return segments;
}

function fmtBound(v) { return v===-Infinity?'−∞':(v===Infinity?'+∞':fmtNum(v)); }
function formatIntervalUnion(segments, emptyText) {
    if (!segments.length) return emptyText;
    return segments.map(function(s){return (s.loInc?'[':'(')+fmtBound(s.lo)+', '+fmtBound(s.hi)+(s.hiInc?']':')');}).join(' ∪ ');
}

function solveRational(input, result) {
    var p=splitOnOp(input); if (!p) throw new Error('bad_rat');
    var fn=function(x){try{return safeEval(p.left,x)-safeEval(p.right,x);}catch(e){return NaN;}};

    if (p.op !== '=') {
        /* Rational INEQUALITY: proper sign-chart analysis instead of
           treating ">=" etc. as "=" and reporting roots as if they
           were the whole answer. */
        var critical=findFunctionCriticalPoints(fn,-200,200,0.02);
        var segments=buildSignChartSegments(fn,critical,p.op);
        var intervalStr=formatIntervalUnion(segments, T('eqNoSolutionSet'));
        var roots=critical.filter(function(c){return c.kind==='root';});
        var gaps=critical.filter(function(c){return c.kind==='gap';});
        var html='<div class="eq-answer">'+T('eqRationalIneqTitle')+'</div>';
        html+='<div class="eq-answer">'+intervalStr+'</div>';
        if (roots.length) html+='<div class="eq-block">'+T('eq_roots')+': '+KX(roots.map(function(r,i){return 'x_'+(i+1)+'='+fmtNumTex(r.x);}).join(',\\ '))+'</div>';
        if (gaps.length) html+='<div class="eq-block eq-warn">'+T('eqRationalUndefinedAt')+': x = '+gaps.map(function(g){return fmtNum(g.x);}).join(', ')+'</div>';
        displaySteps(buildGenericIneqTutorSteps('rat', fn, critical, p.op, p.left, p.right));
        finishEqResult(result, html);
        /* Matches the existing convention elsewhere in this file: the
           graph plots f(x) with a zero line and root markers, but
           doesn't shade a solution region, so it's hidden for
           inequalities (see the generic linear/quadratic dispatch)
           rather than shown looking like it solved an equation. */
        hideEqPlot();
        return;
    }

    var criticalEq=findFunctionCriticalPoints(fn,-200,200,0.05);
    var roots=criticalEq.filter(function(c){return c.kind==='root';}).map(function(c){return c.x;});
    var gaps=criticalEq.filter(function(c){return c.kind==='gap';});
    if (!roots.length){
        displaySteps(buildNumericNoRootSteps('rat', p.left, p.right, '='));
        result.innerHTML='<div class="eq-answer eq-nosol">'+T('eqAbsNoSol')+'</div><div class="eq-block">'+T('eqRationalNoSol')+'</div>';
        revealEqResult(result); return;
    }
    displaySteps(buildNumericEqTutorSteps('rat', fn, p.left, p.right, '=', roots, gaps, verifyFmt));
    var html='<div class="eq-answer">'+T('eqRationalTitle')+'</div>';
    roots.forEach(function(r,i){html+='<div class="eq-answer">'+KX((roots.length>1?'x_'+(i+1):'x')+' = '+fmtNumTex(r),true)+'</div><div class="eq-block">'+verifyFmt(p.left,p.right,r)+'</div>';});
    finishEqResult(result, html);
    plotEquation(p.left,p.right);
}

function verify3Fmt(left, right, xv, yv, zv) {
    try {
        var lv=safeEval3(left,xv,yv,zv), rv=safeEval3(right,xv,yv,zv);
        var ok=Math.abs(lv-rv)<1e-6;
        return '<span class="'+(ok?'eq-check':'eq-warn')+'">'+(ok?'✓':'≈')+' '+(T('verification')||'Verification')+': '+parseFloat(lv.toFixed(6))+' = '+parseFloat(rv.toFixed(6))+'</span>';
    } catch(e){ return ''; }
}
function solveSystem3(eq1,eq2,eq3,result) {
    var parse3=function(eq){
        var p=splitOnOp(eq); if(!p) throw new Error('bad');
        var f=function(x,y,z){return safeEval3(p.left,x,y,z)-safeEval3(p.right,x,y,z);};
        var c=f(0,0,0),ax=f(1,0,0)-c,ay=f(0,1,0)-c,az=f(0,0,1)-c;
        return {a:ax,b:ay,c_:az,d:-c};
    };
    var e1=parse3(eq1),e2=parse3(eq2),e3=parse3(eq3);
    var a1=e1.a,b1=e1.b,c1=e1.c_,d1=e1.d,a2=e2.a,b2=e2.b,c2=e2.c_,d2=e2.d,a3=e3.a,b3=e3.b,c3=e3.c_,d3=e3.d;
    var det=function(m){return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);};
    var A=[[a1,b1,c1],[a2,b2,c2],[a3,b3,c3]],D=det(A);
    var stdForm3 = fmtNum(a1)+'x + '+fmtNum(b1)+'y + '+fmtNum(c1)+'z = '+fmtNum(d1)+'<br>'
                 + fmtNum(a2)+'x + '+fmtNum(b2)+'y + '+fmtNum(c2)+'z = '+fmtNum(d2)+'<br>'
                 + fmtNum(a3)+'x + '+fmtNum(b3)+'y + '+fmtNum(c3)+'z = '+fmtNum(d3);
    if (Math.abs(D)<1e-12){
        displaySteps(buildSystemNoSolSteps(true, stdForm3));
        result.innerHTML='<div class="eq-answer eq-warn">'+T('eqNoUniqSol')+'</div><div class="eq-block">'+T('eqDeterminantZero')+'</div>';
        revealEqResult(result); return;
    }
    var Dx=det([[d1,b1,c1],[d2,b2,c2],[d3,b3,c3]]),Dy=det([[a1,d1,c1],[a2,d2,c2],[a3,d3,c3]]),Dz=det([[a1,b1,d1],[a2,b2,d2],[a3,b3,d3]]);
    var x=Dx/D,y=Dy/D,z=Dz/D;
    var p1=splitOnOp(eq1),p2=splitOnOp(eq2),p3=splitOnOp(eq3);
    var sys3Steps = buildSystemCramerSteps(true, {
        stdForm: stdForm3,
        detWork: 'D = '+fmtNum(D),
        subDetWork: 'Dx = '+fmtNum(Dx)+',&nbsp; Dy = '+fmtNum(Dy)+',&nbsp; Dz = '+fmtNum(Dz),
        solveWork: 'x = '+fmtNum(Dx)+'/'+fmtNum(D)+' = '+fmtNum(x)+'<br>y = '+fmtNum(Dy)+'/'+fmtNum(D)+' = '+fmtNum(y)+'<br>z = '+fmtNum(Dz)+'/'+fmtNum(D)+' = '+fmtNum(z),
        verifyWork: verify3Fmt(p1.left,p1.right,x,y,z)+'<br>'+verify3Fmt(p2.left,p2.right,x,y,z)+'<br>'+verify3Fmt(p3.left,p3.right,x,y,z)
    });
    var sys3Alt = build3x3EliminationSteps([[a1,b1,c1,d1],[a2,b2,c2,d2],[a3,b3,c3,d3]], x, y, z);
    displaySteps(sys3Steps, sys3Alt, ST('sys3alt_title'), ST('sys3alt_intro'));
    result.innerHTML='<div class="eq-answer">'+KX('x = '+fmtNumTex(x),true)+'</div><div class="eq-answer">'+KX('y = '+fmtNumTex(y),true)+'</div><div class="eq-answer">'+KX('z = '+fmtNumTex(z),true)+'</div><div class="eq-block">'+T('eqCramerRule')+': '+KX('D='+fmtNumTex(D)+',\\ D_x='+fmtNumTex(Dx)+',\\ D_y='+fmtNumTex(Dy)+',\\ D_z='+fmtNumTex(Dz))+'</div>';
    revealEqResult(result);
}

function solveSystem(eq1,eq2,result) {
    var parse2=function(eq){
        var p=splitOnOp(eq); if(!p) throw new Error('bad');
        var f=function(xv,yv){return safeEval(p.left,xv,yv)-safeEval(p.right,xv,yv);};
        var c=f(0,0),ax=f(1,0)-c,ay=f(0,1)-c;
        return {a:ax,b:ay,c:-c};
    };
    var e1=parse2(eq1),e2=parse2(eq2);
    var a1=e1.a,b1=e1.b,c1=e1.c,a2=e2.a,b2=e2.b,c2=e2.c;
    var det=a1*b2-a2*b1;
    var stdForm2 = fmtNum(a1)+'x + '+fmtNum(b1)+'y = '+fmtNum(c1)+'<br>'+fmtNum(a2)+'x + '+fmtNum(b2)+'y = '+fmtNum(c2);
    if(Math.abs(det)<1e-12){
        displaySteps(buildSystemNoSolSteps(false, stdForm2));
        result.innerHTML='<div class="eq-answer eq-warn">'+T('eqNoUniqSol')+'</div><div class="eq-block">'+T('eqDeterminantZero')+'</div>';
        revealEqResult(result); return;
    }
    var Dx=c1*b2-c2*b1,Dy=a1*c2-a2*c1,x=Dx/det,y=Dy/det;
    var p1=splitOnOp(eq1),p2=splitOnOp(eq2);
    var sysMain = buildSystemCramerSteps(false, {
        stdForm: stdForm2,
        detWork: 'D = a₁b₂ − a₂b₁ = '+fmtSP(a1)+'×'+fmtSP(b2)+' − '+fmtSP(a2)+'×'+fmtSP(b1)+' = '+fmtNum(det),
        subDetWork: 'Dx = c₁b₂ − c₂b₁ = '+fmtNum(Dx)+'<br>Dy = a₁c₂ − a₂c₁ = '+fmtNum(Dy),
        solveWork: 'x = '+fmtNum(Dx)+'/'+fmtNum(det)+' = '+fmtNum(x)+'<br>y = '+fmtNum(Dy)+'/'+fmtNum(det)+' = '+fmtNum(y),
        verifyWork: verifyFmt(p1.left,p1.right,x,y)+'<br>'+verifyFmt(p2.left,p2.right,x,y)
    });
    var sysAlt = buildSystemEliminationSteps(a1,b1,c1,a2,b2,c2,det,x,y);
    displaySteps(sysMain, sysAlt, ST('alt_method_title'), ST('alt_intro'));
    result.innerHTML='<div class="eq-answer">'+KX('x = '+fmtNumTex(x),true)+'</div><div class="eq-answer">'+KX('y = '+fmtNumTex(y),true)+'</div><div class="eq-block">'+T('eqCramerRule')+': '+KX('\\Delta = '+fmtNumTex(det))+'<br>'+verifyFmt(p1.left,p1.right,x,y)+'<br>'+verifyFmt(p2.left,p2.right,x,y)+'</div>';
    revealEqResult(result);
}

function solveTrigonometric(input,result) {
    var p=splitOnOp(input); if(!p) throw new Error('bad_trig');
    var fn=function(x){try{var expr=p.left.replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/π/g,Math.PI).replace(/x/g,'('+x+')');return Function('"use strict"; return '+expr)()-safeEval(p.right,x);}catch(e){return NaN;}};

    if (p.op !== '=') {
        /* Trigonometric INEQUALITY: sign-chart within the same
           [−2π, 2π] window already used for the equation case below.
           The true solution set is periodic (repeats every period
           outside this window) — that's called out explicitly rather
           than silently only showing one window's worth of answer. */
        var criticalT=findFunctionCriticalPoints(fn,-2*Math.PI,2*Math.PI,0.01);
        var segsT=buildSignChartSegments(fn,criticalT,p.op);
        var intervalT=formatIntervalUnion(segsT, T('eqNoSolutionSet'));
        var rootsT=criticalT.filter(function(c){return c.kind==='root';});
        var htmlT='<div class="eq-answer">'+T('eqTrigIneqTitle')+'</div>';
        htmlT+='<div class="eq-answer">'+intervalT+'</div>';
        if (rootsT.length) htmlT+='<div class="eq-block">'+T('eq_roots')+' (rad): '+KX(rootsT.map(function(r,i){return 'x_'+(i+1)+'='+fmtNumTex(r.x);}).join(',\\ '))+'</div>';
        htmlT+='<div class="eq-block eq-warn">'+T('eqTrigWindowNote')+'</div>';
        displaySteps(buildGenericIneqTutorSteps('trig', fn, criticalT, p.op, p.left, p.right));
        result.innerHTML=htmlT; revealEqResult(result);
        hideEqPlot();
        return;
    }

    var criticalEq=findFunctionCriticalPoints(fn,-2*Math.PI,2*Math.PI,0.05);
    var roots=criticalEq.filter(function(c){return c.kind==='root';}).map(function(c){return c.x;});
    if(!roots.length){
        displaySteps(buildNumericNoRootSteps('trig', p.left, p.right, '='));
        result.innerHTML='<div class="eq-answer eq-nosol">'+T('eqTrigNoSol')+'</div><div class="eq-block">'+T('eqTrigNoReal')+'</div>';
        revealEqResult(result); return;
    }
    displaySteps(buildNumericEqTutorSteps('trig', fn, p.left, p.right, '=', roots, [], trigVerifyFmt));
    var html='<div class="eq-answer">'+T('eqTrigTitle')+'</div>';
    roots.forEach(function(r,i){html+='<div class="eq-answer">'+KX((roots.length>1?'x_'+(i+1):'x')+' = '+fmtNumTex(r),true)+' rad ≈ '+parseFloat((r*180/Math.PI).toFixed(2))+'°</div>';});
    finishEqResult(result, html);
    plotEquation(p.left,p.right);
}

/* ── Exponential Method 2: isolate a single power & take logs ──
   Numerically recovers a,b,c in f(x) = a·bˣ + c by fitting 3 integer
   samples and validating against a 4th — same fit-then-validate
   spirit as extractCubicCoeffs/extractParamModel elsewhere in this
   file. Only when this genuinely fits (one clean power, nothing else
   depending on x) does taking a logarithm of both sides make sense as
   an independent second method; otherwise this gracefully defers to
   Method 1, exactly like Cubic's RRT does when coefficients aren't
   integers. A base recovered as ≤0 or ≈1 is rejected as a fit even if
   the 4th-sample check would technically pass — those aren't valid
   exponential bases, so accepting them would narrate nonsense. */
function extractExpModel(fn) {
    var f0=fn(0), f1=fn(1), f2=fn(2), f3=fn(3);
    if (![f0,f1,f2,f3].every(function(v){return isFinite(v);})) return {valid:false};
    var d1=f1-f0, d2=f2-f1;
    if (Math.abs(d1)<1e-9) return {valid:false};
    var base=d2/d1;
    if (!isFinite(base) || base<=0 || Math.abs(base-1)<1e-6) return {valid:false};
    var coef=d1/(base-1);
    var c=f0-coef;
    var pred3=coef*Math.pow(base,3)+c;
    var tol=1e-6*Math.max(1,Math.abs(f3));
    var valid=isFinite(pred3)&&Math.abs(pred3-f3)<tol;
    return {valid:valid, b:base, coef:coef, c:c};
}

function buildExpLogAltSteps(fn, knownRoots) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    var m=extractExpModel(fn);
    alt.push({ title:TT(NT('expalt_step1_title')), why:NT('expalt_step1_why'),
        work: m.valid ? fillTpl(NT('expalt_model_found'),{a:fmtNum(m.coef),b:fmtNum(m.b),c:fmtNum(m.c)}) : NT('expalt_not_applicable') });
    if (!m.valid) return alt;

    var target=-m.c/m.coef;
    alt.push({ title:TT(NT('expalt_step2_title')), why:NT('expalt_step2_why'),
        work: fmtNum(m.b)+'ˣ = '+fmtNum(target) });

    if (target<=0) {
        alt.push({ title:'', why:'', work: fillTpl(NT('expalt_no_real'),{val:fmtNum(target)}) });
        return alt;
    }

    var xSolved=Math.log(target)/Math.log(m.b);
    alt.push({ title:TT(NT('expalt_step3_title')), why:NT('expalt_step3_why'),
        work: 'x = ln('+fmtNum(target)+') / ln('+fmtNum(m.b)+') = '+fmtNum(xSolved) });

    var matchOk=knownRoots.some(function(r){return Math.abs(r-xSolved)<1e-3;});
    alt.push({ title:'', why:'', work: matchOk?NT('expalt_match_ok'):'' });
    return alt;
}

function solveExponential(input,result) {
    var p=splitOnOp(input); if(!p) throw new Error('bad_exp');
    var fn=function(x){try{var expr=p.left.replace(/e\^/g,'Math.E**').replace(/exp\(/g,'Math.exp(').replace(/\^/g,'**').replace(/(\d)\s*\*\*\s*x/g,'$1**(x)').replace(/x/g,'('+x+')');return Function('"use strict"; return ('+expr+')')()-safeEval(p.right,x);}catch(e){return NaN;}};

        var expIneqMain=buildGenericIneqTutorSteps('exp', fn, criticalE, p.op, p.left, p.right);

    }

    var dfn=makeNumericDeriv(fn);

/* ── Logarithmic Method 2: single log term & the definition of log ──
   Model: f(x) = A·ln(x) + c. Any log type (log10/ln) is proportional
   to ln, and a scaled argument like log(2x) collapses into this same
   linear-in-ln(x) form (ln(2x)=ln2+ln(x)) — so this catches more than
   a naive "argument is literally x" string check would, while still
   correctly rejecting a genuinely different argument shape such as
   ln(x+1) (not a pure scaling of x) or an equation where x also
   appears outside the log. */
function extractLogModel(fn) {
    var f1=fn(1), fe=fn(Math.E), fe2=fn(Math.E*Math.E), fe3=fn(Math.E*Math.E*Math.E);
    if (![f1,fe,fe2,fe3].every(function(v){return isFinite(v);})) return {valid:false};
    var A=fe-f1, c=f1;
    if (Math.abs(A)<1e-9) return {valid:false};
    var pred2=2*A+c, pred3=3*A+c;
    var tol2=1e-6*Math.max(1,Math.abs(fe2)), tol3=1e-6*Math.max(1,Math.abs(fe3));
    var valid=Math.abs(pred2-fe2)<tol2 && Math.abs(pred3-fe3)<tol3;
    return {valid:valid, A:A, c:c};
}

function buildLogExpAltSteps(fn, knownRoots) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    var m=extractLogModel(fn);
    alt.push({ title:TT(NT('logalt_step1_title')), why:NT('logalt_step1_why'),
        work: m.valid ? fillTpl(NT('logalt_model_found'),{A:fmtNum(m.A),c:fmtNum(m.c)}) : NT('logalt_not_applicable') });
    if (!m.valid) return alt;

    var k=-m.c/m.A;
    alt.push({ title:TT(NT('logalt_step2_title')), why:NT('logalt_step2_why'),
        work: 'ln(x) = '+fmtNum(k) });

    var xSolved=Math.exp(k);
    alt.push({ title:TT(NT('logalt_step3_title')), why:NT('logalt_step3_why'),
        work: 'x = e^('+fmtNum(k)+') = '+fmtNum(xSolved) });

    var matchOk=knownRoots.some(function(r){return Math.abs(r-xSolved)<1e-3;});
    alt.push({ title:'', why:'', work: matchOk?NT('logalt_match_ok'):'' });
    return alt;
}

function solveLogarithmic(input,result) {
