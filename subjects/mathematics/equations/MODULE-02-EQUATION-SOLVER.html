<style>
/* ── SHARED BASE CSS ── */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
html{background:#0f172a;min-height:100%;}
body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1a1f3a 100%);min-height:100dvh;min-height:100vh;color:white;overflow-x:hidden;}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
body::before{width:420px;height:420px;background:radial-gradient(circle,rgba(99,102,241,0.09) 0%,transparent 70%);top:-80px;left:-80px;}
body::after{width:360px;height:360px;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);bottom:40px;right:-60px;}
.screen{display:none;padding:20px;padding-bottom:170px;min-height:100dvh;min-height:100vh;position:relative;z-index:1;}
.screen.active{display:block;animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}
@keyframes screenIn{from{opacity:0;transform:scale3d(0.96,0.96,1) translateY(10px);}to{opacity:1;transform:scale3d(1,1,1) translateY(0);}}
.header{text-align:center;padding:40px 20px 20px;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;color:#fff;box-shadow:0 8px 24px rgba(99,102,241,0.3);position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);animation:shimmer 3s infinite;}
@keyframes shimmer{0%{transform:translate(-100%,-100%);}100%{transform:translate(100%,100%);}}
.logo-text{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#fff,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo span{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{color:#94a3b8;font-size:0.95rem;margin-top:5px;}
.back-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#94a3b8;font-size:0.95rem;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);}
.back-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.1);transform:translateX(-3px);}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:rgba(15,23,42,0.3);}::-webkit-scrollbar-thumb{background:rgba(71,85,105,0.5);border-radius:4px;}
/* Shared tool styles */
.unit-converter-container{max-width:520px;margin:0 auto;background:rgba(15,23,42,0.4);border:1px solid rgba(71,85,105,0.3);border-radius:25px;padding:30px;}
.unit-title{font-size:1.5rem;font-weight:600;margin-bottom:20px;}
.tool-input-group{margin-bottom:15px;}
.tool-label{color:#94a3b8;font-size:0.9rem;margin-bottom:8px;display:block;}
.tool-input{width:100%;background:rgba(30,41,59,0.6);border:1px solid rgba(71,85,105,0.3);border-radius:12px;padding:15px;font-size:1.05rem;color:white;outline:none;letter-spacing:0.5px;}
.tool-input:focus{border-color:rgba(99,102,241,0.7);box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
.tool-result{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:15px;padding:20px;margin-top:15px;}

/* ── Equation Solver CSS ── */
#eq-plot{border:1px solid rgba(99,102,241,0.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.03),0 18px 45px rgba(2,6,23,0.22);overflow:hidden!important;}
.graph-fullscreen-modal{position:fixed;inset:0;z-index:99000;background:rgba(2,6,23,0.93);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 240ms ease,visibility 240ms ease;touch-action:none;}
.graph-fullscreen-modal.active{opacity:1;visibility:visible;pointer-events:auto;}
body.graph-modal-open{overflow:hidden;}
.graph-fullscreen-shell{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.92);transition:transform 280ms cubic-bezier(0.22,1,0.36,1);z-index:99001;width:min(1400px,94vw);height:min(900px,92vh);display:flex;flex-direction:column;box-sizing:border-box;padding:12px;overflow:hidden;background:#000;border:1px solid rgba(129,140,248,0.3);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,0.85),0 0 0 1px rgba(99,102,241,0.12);}

#fullscreen-content{cursor:default;}

<script>
/* ── Light-theme contrast guard ─────────────────────────────
   Detects whether the currently active body background is a
   light color (any theme, present or future) and toggles
   body.theme-light so panels/text/back-btn switch to a closed,
   readable palette. getComputedStyle always normalizes colors
   to rgb()/rgba() — never hex — so we parse that, not hex.
   Fully-transparent stops (alpha 0, e.g. body's own unset
   background-color) are skipped so they don't drag the
   average down as if they were a real black stop.
   A MutationObserver on body's style attribute acts as the
   "signal": whenever ANYTHING changes the body background
   (theme picker, app boot, future code), every already-loaded
   module reacts instantly, with no fixed timing assumptions. */
function mcRelLuminanceRGB(r,g,b){
    const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
    return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function mcExtractRGB(str){
    const out=[];
    (str.match(/rgba?\([^)]+\)/g)||[]).forEach(m=>{
        const n=m.match(/[\d.]+/g).map(Number);
        if(n.length>=4 && n[3]===0) return;
        out.push([n[0],n[1],n[2]]);
    });
    (str.match(/#[0-9a-fA-F]{6}/g)||[]).forEach(h=>{
        out.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    });
    return out;
}
function mcCheckThemeLightness(){
    const cs=getComputedStyle(document.body);
    const str=(cs.backgroundImage&&cs.backgroundImage!=='none'?cs.backgroundImage:'')+' '+cs.backgroundColor;
    const colors=mcExtractRGB(str);
    if(!colors.length){document.body.classList.remove('theme-light');return;}
    const avg=colors.reduce((s,[r,g,b])=>s+mcRelLuminanceRGB(r,g,b),0)/colors.length;
    document.body.classList.toggle('theme-light',avg>0.18);
}
mcCheckThemeLightness();
window.addEventListener('load',mcCheckThemeLightness);
setTimeout(mcCheckThemeLightness,300);
try{
    new MutationObserver(mcCheckThemeLightness)
        .observe(document.body,{attributes:true,attributeFilter:['style','class']});
}catch(e){}

/* ── Minimal MultiCalc namespace stub ── */
var MultiCalc = {
    state: { currentLang:'el', eqMode:'linear', eqStepDepth:'full' },
    data: {}
};

/* ── KaTeX setup ──────────────────────────────────────────────
   1) Inject KaTeX's stylesheet via JS instead of a <link> tag in
      <head> — the app orchestrator's module loader only picks up
      <style> blocks and <script> tags from a module, so a <link>
      would silently never appear when this module runs in-app.
      This runs identically in standalone mode too (harmless
      no-op re-check via the data attribute guard).
   2) KX(tex, displayMode) renders one LaTeX string to an HTML
      string via katex.renderToString(). Falls back to the raw
      TeX source (still readable, just unstyled) if KaTeX hasn't
      finished loading yet (a real possibility in-app: dynamically
      inserted <script src> tags ignore `defer` and load async, so
      a click made in the first instant after opening this screen
      could in principle beat the download) or if a given string
      fails to parse for any reason — this NEVER throws upward
      into a solver function. ── */
(function injectKatexCss(){

/* ── T() — conditional definition to avoid clobbering the shared
   runtime T() when this module runs inside MULTICALC-APP.html.
   • Standalone mode (no global T yet): define local T() as before.
   • App mode (MODULE-01 already defined T()): MERGE these equation-
     specific keys into the shared MultiCalc.data.translations object
     instead, so the ONE global T() can serve them too. This prevents
     module load order from silently breaking other modules' T(). ── */
if (typeof window.T !== 'function') {
    window.T = function(key) {
        var lang = MultiCalc.state.currentLang || 'el';
        var t = _eqTranslations[lang] || _eqTranslations['en'];
        return (t && t[key] !== undefined) ? t[key] : (_eqTranslations['en'][key] || key);
    };
} else {
    Object.keys(_eqTranslations).forEach(function(lang) {
        MultiCalc.data.translations[lang] = MultiCalc.data.translations[lang] || {};
        var dst = MultiCalc.data.translations[lang];
        var src = _eqTranslations[lang];
        for (var k in src) { if (dst[k] === undefined) dst[k] = src[k]; }
    });
}

function PT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.paramTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}

/* ── S() step renderer ── */
function S(type, params) {
    params = params || {};
    var lang = MultiCalc.state.currentLang || 'el';
    var tpl = MultiCalc.data.stepTemplates;
    var fn = (tpl[lang] && tpl[lang][type]) || (tpl['en'] && tpl['en'][type]);
    return fn ? fn(params) : '['+type+']';
}

/* ── Math helpers ── */
/* None of this module's expression strings ever contain a real
   function call, so a closing paren directly followed by a digit or
   another opening paren — or a digit directly followed by an opening
   paren — always means implicit multiplication was left out (e.g.
   "(x-1)(x+2)", "2(x+1)", or, once x/λ are substituted with a
   parenthesized number, "(λ-2)x" and "λx"). Without this, JS reads
   ")(" as trying to call the left side as a function and throws
   "N is not a function" instead of evaluating — every eval helper
   below runs the substituted string through this before executing. */
function fixImplicitMult(s) {
    return s.replace(/\)(?=[\d(])/g,')*').replace(/(\d)(?=\()/g,'$1*');
}
/* Central-difference numerical derivative, used to Newton-refine a
   bracketed root once a sign change is found — the exact same 1e-7
   step was hand-repeated at every numeric root-scan in this file
   (rational/trig/exp/log/poly). Scan range, step, iteration cap, and
   dedup tolerance genuinely differ per solver, so only this shared
   piece — not the whole scan loop — is factored out. */
function makeNumericDeriv(fn) {
    return function(x){ return (fn(x+1e-7)-fn(x-1e-7))/2e-7; };
}
function safeEval(expr, xv, yv) {
    yv = yv === undefined ? 0 : yv;
    var s = expr
        .replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**')
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/(\d)(x)/g,'$1*$2').replace(/(\d)(y)/g,'$1*$2')
        .replace(/x/g,'('+xv+')').replace(/y/g,'('+yv+')');
    return Function('"use strict"; return (' + fixImplicitMult(s) + ')')();
}

function safeEval3(expr, xv, yv, zv) {
    var s = expr
        .replace(/²/g,'**2').replace(/³/g,'**3').replace(/\^/g,'**')
        .replace(/×/g,'*').replace(/÷/g,'/')
        .replace(/(\d)(x|y|z)/g,'$1*$2')
        .replace(/x/g,'('+xv+')').replace(/y/g,'('+yv+')').replace(/z/g,'('+zv+')');
    return Function('"use strict";return('+fixImplicitMult(s)+')')();
}

function mkFn(left, right) { return function(x){ return safeEval(left,x) - safeEval(right,x); }; }

function fmtNum(n) {
    if (!isFinite(n)) return '∞';
    var r = parseFloat(n.toFixed(6));
    if (Number.isInteger(r)) return String(r);
    for (var d=2; d<=20; d++) {
        var nd = Math.round(r*d);
        if (Math.abs(nd/d - r) < 1e-6) return nd+'/'+d;
    }
    return parseFloat(n.toFixed(6)).toString();
}

/* Same number → "nice fraction?" search as fmtNum (kept in exact sync
   deliberately, so the two never disagree on which numbers count as
   a clean fraction), but for use inside KX()-wrapped LaTeX: returns
   a proper \frac{}{} instead of a plain "n/d" string. Never call this
   for plain-text contexts (verification lines, step messages, graph
   titles, interval notation) — those must keep using fmtNum(), or the
   raw "\frac{...}" source would show up unrendered as literal text. */
function fmtNumTex(n) {
    if (!isFinite(n)) return n>0 ? '+\\infty' : '-\\infty';
    var r = parseFloat(n.toFixed(6));
    if (Number.isInteger(r)) return String(r);
    for (var d=2; d<=20; d++) {
        var nd = Math.round(r*d);
        if (Math.abs(nd/d - r) < 1e-6) return (nd<0?'-':'')+'\\frac{'+Math.abs(nd)+'}{'+d+'}';
    }
    return parseFloat(n.toFixed(6)).toString();
}

function verifyFmt(left, right, xv, yv) {
    yv = yv || 0;
    try {
        var lv = safeEval(left, xv, yv), rv = safeEval(right, xv, yv);
        var ok = Math.abs(lv-rv) < 1e-6;
        return '<span class="'+(ok?'eq-check':'eq-warn')+'">'+(ok?'✓':'≈')+' '+(T('verification')||'Verification')+': '+parseFloat(lv.toFixed(6))+' = '+parseFloat(rv.toFixed(6))+'</span>';
    } catch(e){ return ''; }
}

/* ── Quadratic tutor-mode helpers ── */
function QT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.quadTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}
function fmtSP(n) { var s=fmtNum(n); return n<0 ? '('+s+')' : s; }
function fmtPM(n) { return (n>=0?'+ ':'− ')+fmtNum(Math.abs(n)); }
/* tFn optionally overrides which tutor-text dictionary's verify_lead
   phrase to use (QT's quadTutorText by default, so every existing
   call site — quadratic — is unaffected; linear passes LT). */
function buildVerifyWork(left, right, x, subscript, tFn) {
    tFn = tFn || QT;
    var xLabel = 'x'+(subscript||'')+' = '+fmtNum(x);
    return tFn('verify_lead').replace('{x}', xLabel) + '<br>' + verifyFmt(left, right, x);
}
/* Tolerant comparison against a comparison-operator string as used
   throughout this file ('=','>','<','>=','<='), with the same 1e-6
   float tolerance convention used elsewhere. Used wherever a constant
   relation (no x term left to solve for) needs to be judged true or
   false — e.g. a linear equation/inequality whose x-term cancels out
   entirely, where "is it true" depends on the actual operator, not
   just on whether the remaining constant is exactly zero. */
function compareByOp(lv, rv, op) {
    if (op==='>') return lv > rv + 1e-6;
    if (op==='<') return lv < rv - 1e-6;
    if (op==='>=') return lv >= rv - 1e-6;
    if (op==='<=') return lv <= rv + 1e-6;
    return Math.abs(lv-rv) < 1e-6;
}
/* Display symbol for a raw comparison op (mirrors splitOnOp's own
   opDisplay mapping) — needed when an inequality's direction flips
   mid-solve and a fresh display symbol has to be derived for the
   flipped operator, which splitOnOp never sees directly. */
function opDispOf(o) { return {'>':'>','<':'<','>=':'≥','<=':'≤','=':'='}[o] || o; }

/* Builds the full "real tutor" step sequence for the discriminant method:
   numbered steps with title + why + fully-expanded work (no hidden
   intermediate arithmetic) + common-mistake warnings + explicit branch
   reasoning + visible verification. extra (optional) carries the
   inequality-interval data already computed by the caller, so this
   doesn't re-derive it. */
function buildQuadraticTutorSteps(sol, left, right, isInequality, extra) {
    var a=sol.a, b=sol.b, c=sol.c;
    var bSq=b*b, fourAC=4*a*c, disc=bSq-fourAC, twoA=2*a;
    var main=[];
    main.push({ title:QT('step1_title'), why:QT('step1_why'),
        work: fmtNum(a)+'x² '+(b>=0?'+ ':'− ')+fmtNum(Math.abs(b))+'x '+(c>=0?'+ ':'− ')+fmtNum(Math.abs(c))+' = 0' });
    main.push({ title:QT('step2_title'), why:QT('step2_why'), warning:QT('step2_warning'),
        work: 'a = '+fmtNum(a)+',&nbsp;&nbsp; b = '+fmtNum(b)+',&nbsp;&nbsp; c = '+fmtNum(c) });
    main.push({ title:QT('step3_title'), why:QT('step3_why'), warning:QT('step3_warning'),
        work: 'Δ = b² − 4ac = '+fmtSP(b)+'² − 4×'+fmtSP(a)+'×'+fmtSP(c)+' = '+fmtNum(bSq)+' − '+fmtSP(fourAC)+' = '+fmtNum(disc) });
    var branchText = disc>1e-9 ? QT('step4_pos') : (Math.abs(disc)<=1e-9 ? QT('step4_zero') : QT('step4_neg'));
    main.push({ title:QT('step4_title'), why:QT('step4_why'), work: branchText });

    if (sol.type==='complex') {
        var re=-b/(2*a), imAbs=Math.sqrt(-disc)/(2*a);
        main.push({ title:QT('step5_title'), why:QT('step5_why'),
            work: 'x = (−b ± √Δ) / 2a = (−'+fmtSP(b)+' ± √'+fmtSP(disc)+') / '+fmtSP(twoA)+' = ('+fmtNum(-b)+' ± i√'+fmtNum(Math.abs(disc))+') / '+fmtNum(twoA)
                +'<br>x₁ = '+fmtNum(re)+' + '+fmtNum(Math.abs(imAbs))+'i,&nbsp;&nbsp; x₂ = '+fmtNum(re)+' − '+fmtNum(Math.abs(imAbs))+'i' });
        main.push({ title:QT('step6_title'), why:QT('step6_why'), work: QT('verify_complex_note') });
    } else if (sol.type==='one') {
        main.push({ title:QT('step5_title'), why:QT('step5_why'),
            work: 'x = −b / 2a = −'+fmtSP(b)+' / '+fmtSP(twoA)+' = '+fmtNum(sol.x1) });
        main.push({ title:QT('step6_title'), why:QT('step6_why'), work: buildVerifyWork(left,right,sol.x1) });
    } else {
        var sq=Math.sqrt(disc);
        main.push({ title:QT('step5_title'), why:QT('step5_why'),
            work: 'x = (−b ± √Δ) / 2a = (−'+fmtSP(b)+' ± √'+fmtNum(disc)+') / '+fmtSP(twoA)+' = ('+fmtNum(-b)+' ± '+fmtNum(sq)+') / '+fmtNum(twoA)
                +'<br>x₁ = ('+fmtNum(-b)+' + '+fmtNum(sq)+') / '+fmtNum(twoA)+' = '+fmtNum(sol.x1)
                +'<br>x₂ = ('+fmtNum(-b)+' − '+fmtNum(sq)+') / '+fmtNum(twoA)+' = '+fmtNum(sol.x2) });
        main.push({ title:QT('step6_title'), why:QT('step6_why'),
            work: buildVerifyWork(left,right,sol.x1,'₁') + '<br>' + buildVerifyWork(left,right,sol.x2,'₂') });
        if (isInequality && extra) {
            main.push({ title:QT('step7_title'), why:QT('step7_why'), work: extra.work });
        }
    }
    return main;
}

/* Builds the "completing the square" alternative method — same a,b,c,
   independently walked through algebraically, ending at the same
   roots as the discriminant method (checked and flagged to the user). */
function buildCompletingSquareSteps(sol) {
    var a=sol.a, b=sol.b, c=sol.c;
    var alt=[];
    var bOverA=b/a, cOverA=c/a;
    alt.push({ title:QT('alt_step1_title'), why:QT('alt_step1_why'),
        work: 'x² + ('+fmtNum(bOverA)+')x + ('+fmtNum(cOverA)+') = 0' });
    alt.push({ title:QT('alt_step2_title'), why:QT('alt_step2_why'),
        work: 'x² + ('+fmtNum(bOverA)+')x = '+fmtNum(-cOverA) });
    var halfB=bOverA/2, halfBSq=halfB*halfB;
    alt.push({ title:QT('alt_step3_title'), why:QT('alt_step3_why'),
        work: 'x² + ('+fmtNum(bOverA)+')x + '+fmtNum(halfBSq)+' = '+fmtNum(-cOverA)+' + '+fmtNum(halfBSq)+' = '+fmtNum(-cOverA+halfBSq) });
    var rhs4=-cOverA+halfBSq;
    alt.push({ title:QT('alt_step4_title'), why:QT('alt_step4_why'),
        work: '(x '+fmtPM(halfB)+')² = '+fmtNum(rhs4)+'&nbsp;&nbsp;<small style="opacity:0.65;">('+QT('alt_match_note')+')</small>' });
    var altX1, altX2, matchOk;
    if (rhs4 < -1e-9) {
        var reAlt=-halfB, imAlt=Math.sqrt(-rhs4);
        alt.push({ title:QT('alt_step5_title'), why:QT('alt_step5_why'),
            work: 'x '+fmtPM(halfB)+' = ±√('+fmtNum(rhs4)+') = ±i'+fmtNum(imAlt)+'<br>x = '+fmtNum(reAlt)+' ± '+fmtNum(imAlt)+'i' });
        matchOk = sol.type==='complex' && Math.abs(reAlt-(-b/(2*a)))<1e-6 && Math.abs(imAlt-Math.sqrt(-sol.disc)/(2*a))<1e-6;
    } else {
        var sqrtRhs4=Math.sqrt(rhs4);
        altX1=-halfB+sqrtRhs4; altX2=-halfB-sqrtRhs4;
        if (Math.abs(sqrtRhs4)<1e-9) {
            alt.push({ title:QT('alt_step5_title'), why:QT('alt_step5_why'),
                work: 'x '+fmtPM(halfB)+' = 0&nbsp;&nbsp;→&nbsp;&nbsp; x = '+fmtNum(-halfB) });
            matchOk = sol.type==='one' && Math.abs(-halfB-sol.x1)<1e-6;
        } else {
            alt.push({ title:QT('alt_step5_title'), why:QT('alt_step5_why'),
                work: 'x '+fmtPM(halfB)+' = ±'+fmtNum(sqrtRhs4)+'<br>x₁ = '+fmtNum(altX1)+',&nbsp;&nbsp; x₂ = '+fmtNum(altX2) });
            matchOk = sol.type==='two' &&
                ((Math.abs(altX1-sol.x1)<1e-6 && Math.abs(altX2-sol.x2)<1e-6) ||
                 (Math.abs(altX1-sol.x2)<1e-6 && Math.abs(altX2-sol.x1)<1e-6));
        }
    }
    alt.push({ title:'', why:'', work: matchOk ? QT('alt_match_ok') : '' });
    return alt;
}

/* ── Linear tutor-mode helpers ── */
function LT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.linTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}

/* Decides, ONCE, the two branch questions every linear tutor step
   (and the visible answer/html itself) needs to agree on:
   - aZero / alwaysTrue: whether the x-term cancelled out entirely,
     and if so whether the remaining constant relation is true. This
     is judged with compareByOp against the ACTUAL operator (op), not
     by checking b≈0 — b≈0 only decides truth for op='='. An
     inequality like "x+5 < x+10" reduces to "5 < 10" (always true,
     every real x is a solution) even though b=−5 here is nowhere
     near 0 — the previous code conflated these and would have
     wrongly reported "no solution" for cases like this.
   - flipped/effectiveOp: whether dividing by a negative a flips an
     inequality's direction, and what the resulting operator is. */
function buildLinearCtx(sol, op, isInequality) {
    var aZero = (sol.type === 'infinite' || sol.type === 'none');
    var alwaysTrue = aZero ? compareByOp(sol.b, 0, op) : null;
    var flipMap = {'>':'<','<':'>','>=':'<=','<=':'>='};
    var flipped = !aZero && isInequality && sol.a < 0;
    var effectiveOp = flipped ? (flipMap[op]||op) : op;
    return {aZero:aZero, alwaysTrue:alwaysTrue, flipped:flipped, effectiveOp:effectiveOp};
}

/* Builds the full "real tutor" step sequence for Method 1 (collect
   everything into standard form ax+b {op} 0, then isolate x) —
   covers all 3 branches: a unique solution, "always true" (x cancels,
   remaining constant statement holds), and "always false" (remaining
   constant statement never holds). ctx is the shared decision from
   buildLinearCtx, so this never re-derives it independently. */
function buildLinearTutorSteps(sol, left, right, op, opDisplay, isInequality, ctx) {
    var a=sol.a, b=sol.b;
    var stdSymbol = isInequality ? opDisplay : '=';
    var main=[];
    main.push({ title:LT('step1_title'), why:LT('step1_why').replace('{op}', stdSymbol),
        work: fmtNum(a)+'x '+(b>=0?'+ ':'− ')+fmtNum(Math.abs(b))+' '+stdSymbol+' 0' });
    main.push({ title:LT('step2_title'), why:LT('step2_why'), warning:LT('step2_warning'),
        work: 'a = '+fmtNum(a)+',&nbsp;&nbsp; b = '+fmtNum(b) });
    main.push({ title:LT('step3_title'), why:LT('step3_why'),
        work: ctx.aZero ? LT('step3_azero_lead').replace('{expr}', fmtNum(b)+' '+stdSymbol+' 0') : LT('step3_nonzero') });

    if (ctx.aZero) {
        var verdictExpr = fmtNum(b)+' '+stdSymbol+' 0';
        main.push({ title:LT('step4_title'),
            why: ctx.alwaysTrue ? LT('step4_azero_true_why').replace('{expr}', verdictExpr) : LT('step4_azero_false_why').replace('{expr}', verdictExpr),
            work: verdictExpr+'&nbsp;&nbsp;→&nbsp;&nbsp;'+(ctx.alwaysTrue ? LT('step4_azero_true_verdict') : LT('step4_azero_false_verdict')) });
        return main;
    }

    if (!isInequality) {
        main.push({ title:LT('step4_isolate_title'), why:LT('step4_isolate_why_eq'),
            work: 'x = −b / a = −'+fmtSP(b)+' / '+fmtSP(a)+' = '+fmtNum(sol.x) });
        main.push({ title:LT('step5_title_eq'), why:LT('step5_why_eq'),
            work: buildVerifyWork(left,right,sol.x,'',LT) });
    } else {
        var flipText = ctx.flipped
            ? LT('step4_flip').replace('{a}',fmtNum(a)).replace('{op}',opDisplay).replace('{newOp}',opDispOf(ctx.effectiveOp))
            : LT('step4_noflip').replace('{a}',fmtNum(a));
        main.push({ title:LT('step4_isolate_title'), why:LT('step4_isolate_why_ineq'), warning: ctx.flipped?LT('step4_isolate_warning_ineq'):undefined,
            work: flipText+'<br>x = −b / a = −'+fmtSP(b)+' / '+fmtSP(a)+' = '+fmtNum(sol.x)+'&nbsp;&nbsp;→&nbsp;&nbsp;x '+opDispOf(ctx.effectiveOp)+' '+fmtNum(sol.x) });
        var di=describeInterval(ctx.effectiveOp, sol.x);
        main.push({ title:LT('step5_title_ineq'), why:LT('step5_why_ineq'), work: di.interval });
        var dirSign = (ctx.effectiveOp==='>'||ctx.effectiveOp==='>=') ? 1 : -1;
        var xIn=sol.x+dirSign, xOut=sol.x-dirSign;
        var lvIn=safeEval(left,xIn), rvIn=safeEval(right,xIn);
        var lvOut=safeEval(left,xOut), rvOut=safeEval(right,xOut);
        var holdsIn=compareByOp(lvIn,rvIn,op), holdsOut=compareByOp(lvOut,rvOut,op);
        main.push({ title:LT('step6_title_ineq'), why:LT('step6_why_ineq'),
            work: '<span class="'+(holdsIn?'eq-check':'eq-warn')+'">x = '+fmtNum(xIn)+' '+LT('check_inside_label')+': '+parseFloat(lvIn.toFixed(6))+' '+opDisplay+' '+parseFloat(rvIn.toFixed(6))+' → '+(holdsIn?LT('holds_true'):LT('holds_false'))+'</span>'
                +'<br><span class="'+(!holdsOut?'eq-check':'eq-warn')+'">x = '+fmtNum(xOut)+' '+LT('check_outside_label')+': '+parseFloat(lvOut.toFixed(6))+' '+opDisplay+' '+parseFloat(rvOut.toFixed(6))+' → '+(holdsOut?LT('holds_true'):LT('holds_false'))+'</span>' });
    }
    return main;
}

/* Builds the "balance method" alternative — instead of combining
   everything into standard form up front, keeps the two original
   sides separate and narrates one "do the same thing to both sides"
   operation per step (the way many schools first teach solving
   equations, before introducing the faster "collect terms" shortcut
   Method 1 uses). Always lands on the identical a, b, x as Method 1
   — same underlying arithmetic, different narration — which is
   exactly the point: showing two ways of thinking arrive at one
   answer. */
function buildLinearBalanceSteps(sol, left, right, op, opDisplay, isInequality, ctx) {
    var stdSymbol = isInequality ? opDisplay : '=';
    var leftB=safeEval(left,0), leftA=safeEval(left,1)-leftB;
    var rightB=safeEval(right,0), rightA=safeEval(right,1)-rightB;
    var alt=[];
    alt.push({ title:LT('alt_step1_title'), why:LT('alt_step1_why'),
        work: fmtNum(leftA)+'x '+(leftB>=0?'+ ':'− ')+fmtNum(Math.abs(leftB))+' '+stdSymbol+' '+fmtNum(rightA)+'x '+(rightB>=0?'+ ':'− ')+fmtNum(Math.abs(rightB)) });
    alt.push({ title:LT('alt_step2_title'), why:LT('alt_step2_why'),
        work: LT('alt_step2_lead').replace('{term}', fmtSP(rightA)+'x')+'<br>'
            + fmtNum(sol.a)+'x '+(leftB>=0?'+ ':'− ')+fmtNum(Math.abs(leftB))+' '+stdSymbol+' '+fmtNum(rightB) });
    alt.push({ title:LT('alt_step3_title'), why:LT('alt_step3_why'),
        work: LT('alt_step3_lead').replace('{term}', fmtSP(leftB))+'<br>'
            + fmtNum(sol.a)+'x '+stdSymbol+' '+fmtNum(-sol.b) });

    if (ctx.aZero) {
        var verdictExpr = fmtNum(sol.b)+' '+stdSymbol+' 0';
        alt.push({ title:LT('step4_title'),
            why: ctx.alwaysTrue ? LT('step4_azero_true_why').replace('{expr}', verdictExpr) : LT('step4_azero_false_why').replace('{expr}', verdictExpr),
            work: verdictExpr+'&nbsp;&nbsp;→&nbsp;&nbsp;'+(ctx.alwaysTrue?LT('step4_azero_true_verdict'):LT('step4_azero_false_verdict')) });
        alt.push({ title:'', why:'', work: LT('alt_match_ok') });
        return alt;
    }

    if (!isInequality) {
        alt.push({ title:LT('alt_step4_title'), why:LT('step4_isolate_why_eq'),
            work: 'x = '+fmtNum(-sol.b)+' / '+fmtSP(sol.a)+' = '+fmtNum(sol.x) });
    } else {
        var flipText = ctx.flipped
            ? LT('step4_flip').replace('{a}',fmtNum(sol.a)).replace('{op}',opDisplay).replace('{newOp}',opDispOf(ctx.effectiveOp))
            : LT('step4_noflip').replace('{a}',fmtNum(sol.a));
        alt.push({ title:LT('alt_step4_title'), why:LT('step4_isolate_why_ineq'), warning: ctx.flipped?LT('step4_isolate_warning_ineq'):undefined,
            work: flipText+'<br>x = '+fmtNum(-sol.b)+' / '+fmtSP(sol.a)+' = '+fmtNum(sol.x)+'&nbsp;&nbsp;→&nbsp;&nbsp;x '+opDispOf(ctx.effectiveOp)+' '+fmtNum(sol.x) });
    }
    alt.push({ title:'', why:'', work: LT('alt_match_ok') });
    return alt;
}

/* ── Cubic tutor-mode helpers ── */
function CT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.cubTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}
/* Fills every {placeholder} occurrence in a template string — unlike
   chained .replace('{x}',...) calls, which only replace the FIRST
   occurrence of each placeholder and silently leave any repeat
   unfilled (a real bug hit by step3_work below, where {lo} and {hi}
   each appear twice). */
function fillTpl(str, repl) {
    return str.replace(/\{(\w+)\}/g, function(m,k){ return (k in repl) ? repl[k] : m; });
}
function cubStdForm(a,b,c,d,relSymbol) {
    return fmtNum(a)+'x³ '+(b>=0?'+ ':'− ')+fmtNum(Math.abs(b))+'x² '+(c>=0?'+ ':'− ')+fmtNum(Math.abs(c))+'x '+(d>=0?'+ ':'− ')+fmtNum(Math.abs(d))+' '+relSymbol+' 0';
}
function quadStdForm(A,B,C,relSymbol) {
    return fmtNum(A)+'x² '+(B>=0?'+ ':'− ')+fmtNum(Math.abs(B))+'x '+(C>=0?'+ ':'− ')+fmtNum(Math.abs(C))+' '+relSymbol+' 0';
}
function cubSolveDeflatedQuadratic(A,B,C) {
    var discQ=B*B-4*A*C, realRoots=[], work='Δ = B² − 4AC = '+fmtSP(B)+'² − 4×'+fmtSP(A)+'×'+fmtSP(C)+' = '+fmtNum(discQ)+'<br>';
    if (discQ > 1e-6) {
        var s=Math.sqrt(discQ), r1=(-B+s)/(2*A), r2=(-B-s)/(2*A);
        realRoots=[r1,r2];
        work += CT('step6_two')+'<br>x = (−B ± √Δ) / 2A = '+fmtNum(r1)+', '+fmtNum(r2);
    } else if (discQ > -1e-6) {
        var r=-B/(2*A); realRoots=[r];
        work += CT('step6_double')+'<br>x = −B / 2A = '+fmtNum(r);
    } else {
        var re=-B/(2*A), im=Math.sqrt(-discQ)/(2*A);
        work += CT('step6_complex')+'<br>x = '+fmtNum(re)+' ± '+fmtNum(im)+'i';
    }
    return {realRoots:realRoots, discQ:discQ, work:work};
}

/* Method 1: the numerical method solveCubicEq actually uses (sign-
   change scan + Newton-Raphson), narrated honestly step by step, then
   completed with whichever of the 3 genuinely different follow-ups
   applies: synthetic division into a quadratic (scan found exactly 1
   root), Vieta's sum-of-roots shortcut (scan found exactly 2 — the
   3rd is immediate, no division needed), or nothing further (scan
   found all 3 directly). scanRoots is the pre-completion root list
   (see solveCubicEq) — this is what decides which of the 3 applies,
   NOT the final post-completion root count. */
function buildCubicTutorSteps(fn, left, right, scanRoots, completed) {
    var co=extractCubicCoeffs(fn), a=co.a,b=co.b,c=co.c,d=co.d;
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(CT('step1_title')), why:CT('step1_why'), work: cubStdForm(a,b,c,d,'=') });
    main.push({ title:TT(CT('step2_title')), why:CT('step2_why'),
        work: 'lim(x→−∞) f(x) = '+(a>0?'−∞':'+∞')+',&nbsp;&nbsp; lim(x→+∞) f(x) = '+(a>0?'+∞':'−∞') });

    var r0=scanRoots[0];
    var brk=findIntegerBracket(fn, r0);
    main.push({ title:TT(CT('step3_title')), why:CT('step3_why'),
        work: fillTpl(CT('step3_work'), {lo:fmtNum(brk.lo), flo:fmtNum(brk.flo), hi:fmtNum(brk.hi), fhi:fmtNum(brk.fhi)}) });

    var dfn=makeNumericDeriv(fn);
    var x0 = Math.abs(dfn(brk.hi))>1e-9 ? brk.hi : brk.lo;
    var iters=runNewtonDemo(fn,dfn,x0,r0);
    var iterLines=iters.map(function(it,i){ return 'x'+subIdx(i)+' = '+fmtNum(it.x)+',&nbsp; f(x'+subIdx(i)+') = '+fmtNum(it.fx); }).join('<br>');
    main.push({ title:TT(CT('step4_title')), why:CT('step4_why'),
        work: iterLines+'<br>'+fillTpl(CT('step4_converge'), {root:fmtNum(r0)}) });

    var localRoots=[r0];
    if (scanRoots.length===1) {
        var A=a, B=b+a*r0, C=c+(b+a*r0)*r0;
        main.push({ title:TT(CT('step5a_title')), why:CT('step5a_why'),
            work: 'A = '+fmtNum(A)+',&nbsp;&nbsp;B = '+fmtNum(B)+',&nbsp;&nbsp;C = '+fmtNum(C)+'<br>'+quadStdForm(A,B,C,'=') });
        var q=cubSolveDeflatedQuadratic(A,B,C);
        localRoots=localRoots.concat(q.realRoots);
        main.push({ title:TT(CT('step6_title')), why:CT('step6_why'), work:q.work });
    } else if (scanRoots.length===2) {
        var r1=scanRoots[0], r2=scanRoots[1], sum=-b/a, r3=sum-r1-r2;
        localRoots=[r1,r2,r3];
        main.push({ title:TT(CT('step5b_title')), why:CT('step5b_why'),
            work: 'x₁+x₂+x₃ = −b/a = '+fmtNum(sum)+'<br>x₃ = '+fmtNum(sum)+' − ('+fmtSP(r1)+') − ('+fmtSP(r2)+') = '+fmtNum(r3) });
    } else {
        localRoots=scanRoots.slice(0,3);
        main.push({ title:TT(CT('step5c_title')), why:CT('step5c_why'),
            work: localRoots.map(function(r,i){return 'x'+subIdx(i+1)+' = '+fmtNum(r);}).join(',&nbsp;&nbsp;') });
    }

    var realForVerify=localRoots.filter(function(v){return typeof v==='number'&&isFinite(v);});
    var verifyWork=realForVerify.map(function(r,i){ return buildVerifyWork(left,right,r,realForVerify.length>1?subIdx(i+1):'',CT); }).join('<br>');
    if (completed && completed.complex) verifyWork += (verifyWork?'<br>':'')+CT('verify_complex_note');
    main.push({ title:TT(CT('step7_title')), why:CT('step7_why'), work: verifyWork });
    return main;
}

/* Method 2 (Rational Root Theorem) — entirely self-contained: works
   straight from fn via extractCubicCoeffs, independent of whatever
   Method 1 already found. knownRealRoots is used ONLY for the final
   match-confirmation line, not for anything upstream of it — so this
   is a genuine second way of finding the roots, not a restatement of
   the first. Reused as-is for both the equation and inequality
   branches (an inequality's critical points are exactly the roots a
   root-finding method like this one would produce). */
function buildCubicRRTSteps(fn, knownRealRoots) {
    var co=extractCubicCoeffs(fn), a=co.a,b=co.b,c=co.c,d=co.d;
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    alt.push({ title:TT(CT('alt_step1_title')), why:CT('alt_step1_why'),
        work: 'p | '+fmtNum(Math.round(d))+',&nbsp;&nbsp; q | '+fmtNum(Math.round(a)) });

    if (!isNearInt(a) || !isNearInt(d) || Math.round(a)===0) {
        alt.push({ title:TT(CT('alt_step2_title')), why:'',
            work: fillTpl(CT('alt_not_applicable'), {a:fmtNum(a), d:fmtNum(d)}) });
        return alt;
    }

    var cands=rationalRootCandidates(Math.round(a), Math.round(d));
    var displayCands=cands.slice(0,10);
    var found=null;
    for (var i=0;i<cands.length;i++){ if (Math.abs(fn(cands[i]))<1e-4) { found=cands[i]; break; } }
    var candWork=fillTpl(CT('alt_candidates_lead'), {list: displayCands.map(fmtNum).join(', ')+(cands.length>displayCands.length?', …':'')});
    alt.push({ title:TT(CT('alt_step2_title')), why:CT('alt_step2_why'), work: candWork });

    if (found===null) {
        alt.push({ title:'', why:'', work: CT('alt_no_rational') });
        return alt;
    }

    var r0=found, A=a, B=b+a*r0, C=c+(b+a*r0)*r0;
    var q=cubSolveDeflatedQuadratic(A,B,C);
    var altRoots=[r0].concat(q.realRoots);
    alt.push({ title:TT(CT('alt_step3_title')), why:CT('alt_step3_why'),
        work: fillTpl(CT('alt_found_lead'), {r:fmtNum(r0)})+'<br>'+quadStdForm(A,B,C,'=')+'<br>'+q.work });

    var sortedAlt=altRoots.slice().sort(function(x,y){return x-y;});
    var sortedKnown=knownRealRoots.slice().sort(function(x,y){return x-y;});
    var matchOk = sortedAlt.length===sortedKnown.length && sortedAlt.every(function(v,i){return Math.abs(v-sortedKnown[i])<1e-3;});
    alt.push({ title:'', why:'', work: matchOk?CT('alt_match_ok'):'' });
    return alt;
}

/* Sign-chart narrative for a cubic inequality: same critical-point
   data solveCubicEq's inequality branch already computes (via
   findFunctionCriticalPoints), just walked through step by step
   instead of only used to compute the final answer silently. */
function buildCubicIneqTutorSteps(fn, critical, op) {
    var co=extractCubicCoeffs(fn), a=co.a,b=co.b,c=co.c,d=co.d;
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(CT('step1_title')), why:CT('ineq_step1_why'), work: cubStdForm(a,b,c,d,opDispOf(op)) });
    main.push({ title:TT(CT('ineq_step2_title')), why:CT('ineq_step2_why'), work:'' });

    var roots=critical.filter(function(cr){return cr.kind==='root';});
    var pointsWork = roots.length ? roots.map(function(r){return fmtNum(r.x);}).join(', ') : CT('ineq_no_roots');
    main.push({ title:TT(CT('ineq_step3_title')), why:CT('ineq_step3_why'), work: pointsWork });

    var nSeg=critical.length, rows=[];
    for (var k=0;k<=nSeg;k++){
        var lo=k===0?-Infinity:critical[k-1].x, hi=k===nSeg?Infinity:critical[k].x;
        var mid=(isFinite(lo)&&isFinite(hi))?(lo+hi)/2:(isFinite(lo)?lo+1:(isFinite(hi)?hi-1:0));
        var val=fn(mid);
        var sign=isFinite(val)?(val>0?'+':'−'):'?';
        var matches=isFinite(val)&&(((op==='>'||op==='>=')&&val>0)||((op==='<'||op==='<=')&&val<0));
        var lbl=(isFinite(lo)?fmtNum(lo):'−∞')+', '+(isFinite(hi)?fmtNum(hi):'+∞');
        rows.push('('+lbl+'):&nbsp; f('+fmtNum(mid)+') '+sign+(matches?'&nbsp;✓':''));
    }
    main.push({ title:TT(CT('ineq_step4_title')), why:CT('ineq_step4_why'), work: rows.join('<br>') });

    var segs=buildSignChartSegments(fn, critical, op);
    main.push({ title:TT(CT('ineq_step5_title')), why:CT('ineq_step5_why'), work: formatIntervalUnion(segs, T('eqNoSolutionSet')) });
    return main;
}

/* Minimal honest treatment for the rare case where the numerical
   scan found no real root at all within its range. Mathematically a
   cubic always has one (odd degree, IVT) — so this branch is really
   a numerical-range limitation, not a distinct mathematical case, and
   there is no second method worth demonstrating against it. */
function buildCubicNoRootSteps(fn) {
    var co=extractCubicCoeffs(fn), a=co.a,b=co.b,c=co.c,d=co.d;
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    return [
        { title:TT(CT('step1_title')), why:CT('step1_why'), work: cubStdForm(a,b,c,d,'=') },
        { title:TT(CT('noroot_title')), why:CT('noroot_why'), work:'' }
    ];
}

/* ── Absolute-value tutor-mode helpers ── */
function AT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.absTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}
function flipOp(op) { return {'>':'<','<':'>','>=':'<=','<=':'>='}[op] || op; }
function linSolved(sol) { return !!sol && sol.type==='linear'; }

/* Intersects two half-line constraints "x op1 b1" and "x op2 b2"
   (each op one of <,<=,>,>=) into a single result — empty, a bounded
   interval, or a half-line (the unbounded side is null). Two
   same-direction constraints keep whichever is tighter; two
   opposite-direction constraints bound an interval between them
   (empty if the bounds cross). */
function intersectHalfLines(op1, b1, op2, b2) {
    var dir1=(op1==='>'||op1==='>=')?1:-1, dir2=(op2==='>'||op2==='>=')?1:-1;
    var inc1=(op1==='>='||op1==='<='), inc2=(op2==='>='||op2==='<=');
    if (dir1===dir2) {
        var tight;
        if (dir1===1) tight = (b1>b2 || (b1===b2 && !inc1)) ? {b:b1,inc:inc1} : {b:b2,inc:inc2};
        else tight = (b1<b2 || (b1===b2 && !inc1)) ? {b:b1,inc:inc1} : {b:b2,inc:inc2};
        return dir1===1 ? {lo:tight.b,loInc:tight.inc,hi:null,hiInc:null,empty:false}
                         : {lo:null,loInc:null,hi:tight.b,hiInc:tight.inc,empty:false};
    }
    var loB=dir1===1?b1:b2, loInc=dir1===1?inc1:inc2, hiB=dir1===1?b2:b1, hiInc=dir1===1?inc2:inc1;
    if (loB>hiB || (loB===hiB && !(loInc&&hiInc))) return {empty:true};
    return {lo:loB, loInc:loInc, hi:hiB, hiInc:hiInc, empty:false};
}
function describeHalfLineResult(r) {
    if (r.empty) return AT('alt_empty_case');
    if (r.lo===null && r.hi===null) return '(−∞, +∞)';
    if (r.lo===null) return 'x '+(r.hiInc?'≤':'<')+' '+fmtNum(r.hi);
    if (r.hi===null) return 'x '+(r.loInc?'≥':'>')+' '+fmtNum(r.lo);
    return (r.loInc?'[':'(')+fmtNum(r.lo)+', '+fmtNum(r.hi)+(r.hiInc?']':')');
}
/* verifyFmt-style check for |inner| = c, since safeEval has no idea
   what pipe/abs-bar notation means — it only evaluates plain
   arithmetic expressions, so verification has to compute Math.abs()
   on the outside rather than passing '|...|' through as if it were
   an expression string. */
function absVerifyFmt(inner, c, xv) {
    try {
        var raw=safeEval(inner,xv), lv=Math.abs(raw);
        var ok=Math.abs(lv-c)<1e-6;
        return '<span class="'+(ok?'eq-check':'eq-warn')+'">'+(ok?'✓':'≈')+' '+(T('verification')||'Verification')+': |'+parseFloat(raw.toFixed(6))+'| = '+parseFloat(lv.toFixed(6))+'</span>';
    } catch(e){ return ''; }
}

/* Method 1: the "distance from 0" interpretation. The sign of c is
   handled EXPLICITLY here (unlike Method 2, see below) because that
   sign is the actual mathematical reason the answer takes one shape
   or another — hiding it would misrepresent why the method works. */
function buildAbsTutorSteps(inner, c, op, isInequality) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(AT('step1_title')), why:AT('step1_why'), work: '|'+inner+'| '+opDispOf(op)+' '+fmtNum(c) });

    if (!isInequality) {
        if (c<0) {
            main.push({ title:TT(AT('eq_step2_title')), why:AT('eq_step2_why'), work: fillTpl(AT('eq_neg'),{c:fmtNum(c)}) });
            return main;
        }
        if (c===0) {
            main.push({ title:TT(AT('eq_step2_title')), why:AT('eq_step2_why'), work: AT('eq_zero') });
            var sol0=solveLinearExpr(inner.trim(),'0');
            if (!linSolved(sol0)) { main.push({ title:TT(AT('step_final_title')), why:'', work:T('eqAbsCannotSolve') }); return main; }
            main.push({ title:TT(AT('step_boundary_title')), why:'', work: inner+' = 0 &nbsp;→&nbsp; x = '+fmtNum(sol0.x) });
            main.push({ title:TT(AT('step_verify_title')), why:AT('step_verify_why'), work: absVerifyFmt(inner,0,sol0.x) });
            return main;
        }
        main.push({ title:TT(AT('eq_step2_title')), why:AT('eq_step2_why'), work: fillTpl(AT('eq_pos'),{c:fmtNum(c)}) });
        var s1=solveLinearExpr(inner.trim(),c.toString()), s2=solveLinearExpr(inner.trim(),(-c).toString());
        if (!linSolved(s1) || !linSolved(s2)) { main.push({ title:TT(AT('step_final_title')), why:'', work:T('eqAbsCannotSolve') }); return main; }
        main.push({ title:TT(AT('step_boundary_title')), why:'',
            work: T('eqAbsCase1')(inner,c)+' &nbsp;→&nbsp; x₁ = '+fmtNum(s1.x)+'<br>'+T('eqAbsCase2')(inner,c)+' &nbsp;→&nbsp; x₂ = '+fmtNum(s2.x) });
        main.push({ title:TT(AT('step_verify_title')), why:AT('step_verify_why'),
            work: absVerifyFmt(inner,c,s1.x)+'<br>'+absVerifyFmt(inner,c,s2.x) });
        return main;
    }

    var lower=(op==='<'||op==='<='), strict=(op==='<'||op==='>');
    var cmpKey = lower ? (strict?'cmp_less':'cmp_less_eq') : (strict?'cmp_more':'cmp_more_eq');
    main.push({ title:TT(AT('ineq_step2_title')),
        why: fillTpl(AT(lower?'ineq_lower_why':'ineq_upper_why'), {opSym:opDispOf(op), cmpWord:AT(cmpKey)}), work: fmtNum(c) });

    if (c<0) {
        main.push({ title:TT(AT('step_final_title')), why:'', work: fillTpl(AT(lower?'ineq_neg_lower':'ineq_neg_upper'),{c:fmtNum(c)}) });
        return main;
    }
    if (c===0) {
        if (lower && strict) { main.push({ title:TT(AT('step_final_title')), why:'', work:AT('ineq_zero_strict_lower') }); return main; }
        if (!lower && !strict) { main.push({ title:TT(AT('step_final_title')), why:'', work:AT('ineq_zero_nonstrict_upper') }); return main; }
        var solZ=solveLinearExpr(inner.trim(),'0');
        if (!linSolved(solZ)) { main.push({ title:TT(AT('step_final_title')), why:'', work:T('eqAbsCannotSolve') }); return main; }
        if (lower) { // !strict: |A|<=0 -> A=0
            main.push({ title:TT(AT('step_boundary_title')), why:AT('ineq_zero_nonstrict_lower'), work: inner+' = 0 &nbsp;→&nbsp; x = '+fmtNum(solZ.x) });
            main.push({ title:TT(AT('step_final_title')), why:'', work: 'x = '+fmtNum(solZ.x) });
        } else { // strict upper: |A|>0 -> everywhere except A=0
            main.push({ title:TT(AT('step_boundary_title')), why:AT('ineq_zero_strict_upper'), work: inner+' = 0 &nbsp;→&nbsp; x = '+fmtNum(solZ.x) });
            main.push({ title:TT(AT('step_final_title')), why:'', work: '(−∞, '+fmtNum(solZ.x)+') ∪ ('+fmtNum(solZ.x)+', +∞)' });
        }
        return main;
    }

    var sol1=solveLinearExpr(inner.trim(),c.toString()), sol2=solveLinearExpr(inner.trim(),(-c).toString());
    if (!linSolved(sol1) || !linSolved(sol2)) { main.push({ title:TT(AT('step_final_title')), why:'', work:T('eqAbsCannotSolve') }); return main; }
    main.push({ title:TT(AT('step_boundary_title')), why: fillTpl(AT(lower?'ineq_pos_lower':'ineq_pos_upper'),{c:fmtNum(c)}),
        work: T('eqAbsCase1')(inner,c)+' &nbsp;→&nbsp; x = '+fmtNum(sol1.x)+'<br>'+T('eqAbsCase2')(inner,c)+' &nbsp;→&nbsp; x = '+fmtNum(sol2.x) });
    var xx1=Math.min(sol1.x,sol2.x), xx2=Math.max(sol1.x,sol2.x);
    var finalWork = lower
        ? (strict?'(':'[')+fmtNum(xx1)+', '+fmtNum(xx2)+(strict?')':']')
        : '(−∞, '+fmtNum(xx1)+(strict?')':']')+' ∪ '+(strict?'(':'[')+fmtNum(xx2)+', +∞)';
    main.push({ title:TT(AT('step_final_title')), why:'', work: finalWork });
    return main;
}

/* Method 2: the formal |A|=A / |A|=−A definition, with the assumed
   domain checked against every candidate. This is deliberately
   independent of Method 1's sign-of-c branching — the c<0 (and
   c=0-strict-lower) "no solution" cases fall out automatically here
   as BOTH cases failing their own domain check, with no special
   case needed, which is itself worth showing side-by-side with
   Method 1's explicit "distance can't be negative" reasoning. */
function buildAbsPiecewiseSteps(inner, c, op, isInequality) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var alt=[];
    alt.push({ title:TT(AT('alt_step1_title')), why:AT('alt_step1_why'), work:'' });

    var b0=solveLinearExpr(inner.trim(),'0');
    if (!linSolved(b0) || Math.abs(b0.a)<1e-9) {
        alt.push({ title:TT(AT('alt_step2_title')), why:'', work:AT('alt_not_applicable') });
        return alt;
    }
    var a=b0.a, b=b0.b, x0=b0.x;
    var dom1Op=a>0?'>=':'<=', dom2Op=a>0?'<':'>';
    alt.push({ title:TT(AT('alt_step2_title')), why:AT('alt_step2_why'), work: inner+' = 0 &nbsp;→&nbsp; x = '+fmtNum(x0) });

    if (!isInequality) {
        var cand1=(c-b)/a, ok1=compareByOp(cand1,x0,dom1Op);
        var cand2=(-c-b)/a, ok2=compareByOp(cand2,x0,dom2Op);
        alt.push({ title:TT(AT('alt_case1_title')), why:AT('alt_case1_why'),
            work: inner+' = '+fmtNum(c)+' &nbsp;→&nbsp; x = '+fmtNum(cand1)+'<br>'+(ok1?AT('alt_domain_ok'):AT('alt_domain_reject')) });
        alt.push({ title:TT(AT('alt_case2_title')), why:AT('alt_case2_why'),
            work: '−('+inner+') = '+fmtNum(c)+' &nbsp;→&nbsp; x = '+fmtNum(cand2)+'<br>'+(ok2?AT('alt_domain_ok'):AT('alt_domain_reject')) });
        var validRoots=[]; if(ok1) validRoots.push(cand1); if(ok2) validRoots.push(cand2);
        alt.push({ title:TT(AT('alt_combine_title')), why:AT('alt_combine_why'),
            work: validRoots.length ? validRoots.map(function(r,i){return 'x'+subIdx(i+1)+' = '+fmtNum(r);}).join(', ') : T('eqAbsNoSol') });

        var m1=[];
        if (c===0) { m1=[x0]; }
        else if (c>0) { var ms1=solveLinearExpr(inner.trim(),c.toString()), ms2=solveLinearExpr(inner.trim(),(-c).toString()); if(linSolved(ms1)&&linSolved(ms2)) m1=[ms1.x,ms2.x]; }
        var sA=validRoots.slice().sort(function(x,y){return x-y;}), sM=m1.slice().sort(function(x,y){return x-y;});
        var matchOk = sA.length===sM.length && sA.every(function(v,i){return Math.abs(v-sM[i])<1e-6;});
        alt.push({ title:'', why:'', work: matchOk?AT('alt_match_ok'):'' });
        return alt;
    }

    var caseOp1=a<0?flipOp(op):op, caseBound1=(c-b)/a;
    var r1=intersectHalfLines(dom1Op,x0,caseOp1,caseBound1);
    var caseOp2=a>0?flipOp(op):op, caseBound2=(-c-b)/a;
    var r2=intersectHalfLines(dom2Op,x0,caseOp2,caseBound2);

    alt.push({ title:TT(AT('alt_case1_title')), why:AT('alt_case1_why'),
        work: inner+' '+opDispOf(op)+' '+fmtNum(c)+' &nbsp;→&nbsp; x '+opDispOf(caseOp1)+' '+fmtNum(caseBound1)+'<br>'+describeHalfLineResult(r1) });
    alt.push({ title:TT(AT('alt_case2_title')), why:AT('alt_case2_why'),
        work: '−('+inner+') '+opDispOf(op)+' '+fmtNum(c)+' &nbsp;→&nbsp; x '+opDispOf(caseOp2)+' '+fmtNum(caseBound2)+'<br>'+describeHalfLineResult(r2) });
    alt.push({ title:TT(AT('alt_combine_title')), why:AT('alt_combine_why'),
        work: describeHalfLineResult(r1)+' ∪ '+describeHalfLineResult(r2) });
    return alt;
}

/* ── Rational / Trigonometric shared numeric-method helpers ── */
function NT(key) {
    var lang = MultiCalc.state.currentLang || 'el';
    var d = MultiCalc.data.numTutorText;
    return (d[lang] && d[lang][key] !== undefined) ? d[lang][key] : ((d['en'] && d['en'][key]) || '['+key+']');
}
/* safeEval has no notion of sin/cos/tan — trig needs its own eval
   (mirroring solveTrigonometric's own inline one) for verification
   display, since verifyFmt's safeEval-based check would silently
   misevaluate a "sin(x)" left-hand side as if sin were a variable. */
function trigEval(expr, xv) {
    var s = expr.replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/tan/g,'Math.tan').replace(/π/g,Math.PI).replace(/x/g,'('+xv+')');
    return Function('"use strict"; return '+s+';')();
}
function trigVerifyFmt(left, right, xv) {
    try {
        var lv=trigEval(left,xv), rv=safeEval(right,xv);
        var ok=Math.abs(lv-rv)<1e-6;
        return '<span class="'+(ok?'eq-check':'eq-warn')+'">'+(ok?'✓':'≈')+' '+(T('verification')||'Verification')+': '+parseFloat(lv.toFixed(6))+' = '+parseFloat(rv.toFixed(6))+'</span>';
    } catch(e){ return ''; }
}

/* Shared equation-branch tutor narrative for Rational and
   Trigonometric — both solve numerically via sign-scan + Newton-
   Raphson (see findFunctionCriticalPoints/runNewtonDemo), so one
   builder serves both; typeKey ('rat'|'trig') only switches the
   "why" text, domain-gap step, and degree/period extras. verifyFn is
   passed in because Rational can use the generic verifyFmt (its
   expressions are plain safeEval-compatible arithmetic) while Trig
   cannot (needs trigVerifyFmt). */
function buildNumericEqTutorSteps(typeKey, fn, left, right, op, roots, gaps, verifyFn) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(NT('step1_title')), why:NT(typeKey+'_step1_why'), work: left+' '+opDispOf(op)+' '+right });
    main.push({ title:TT(NT('step2_title')), why:NT(typeKey+'_step2_why'), work:'' });
    if (typeKey==='rat') {
        var gapWork = gaps.length ? fillTpl(NT('domain_found'),{list:gaps.map(function(g){return fmtNum(g.x);}).join(', ')}) : NT('domain_none');
        main.push({ title:TT(NT('domain_title')), why:NT('domain_why'), work: gapWork });
    } else if (typeKey==='log') {
        main.push({ title:TT(NT('domain_title')), why:NT('log_domain_why'), work: NT('log_domain_statement') });
    }
    var r0=roots[0];
    var brk=findIntegerBracket(fn, r0);
    main.push({ title:TT(NT('step3_title')), why:NT('step3_why'),
        work: fillTpl(NT('step3_work'), {lo:fmtNum(brk.lo), flo:fmtNum(brk.flo), hi:fmtNum(brk.hi), fhi:fmtNum(brk.fhi)}) });
    var dfn=makeNumericDeriv(fn);
    var x0 = Math.abs(dfn(brk.hi))>1e-9 ? brk.hi : brk.lo;
    var iters=runNewtonDemo(fn,dfn,x0,r0);
    var iterLines=iters.map(function(it,i){ return 'x'+subIdx(i)+' = '+fmtNum(it.x)+',&nbsp; f(x'+subIdx(i)+') = '+fmtNum(it.fx); }).join('<br>');
    main.push({ title:TT(NT('step4_title')), why:NT('step4_why'),
        work: iterLines+'<br>'+fillTpl(NT('step4_converge'),{root:fmtNum(r0)}) });

    var verifyLines = roots.map(function(r,i){
        var lbl = roots.length>1?subIdx(i+1):'';
        var base = 'x'+lbl+' = '+fmtNum(r);
        if (typeKey==='trig') base += ' rad ≈ '+parseFloat((r*180/Math.PI).toFixed(2))+'°';
        return base+'<br>'+verifyFn(left,right,r);
    }).join('<br>');
    if (typeKey==='trig') verifyLines += '<br>'+NT('trig_period_note');
    main.push({ title:TT(NT('step5_title')), why:NT('step5_why'), work: verifyLines });
    return main;
}

/* Shared inequality-branch (sign-chart) tutor narrative for Rational
   and Trigonometric — structurally the same as Cubic's, written
   fresh here (rather than refactoring buildCubicIneqTutorSteps) to
   avoid touching already-tested cubic code under time pressure. */
function buildGenericIneqTutorSteps(typeKey, fn, critical, op, left, right) {
    var n=0; function TT(suf){ n++; return stepTitle(n, suf); }
    var main=[];
    main.push({ title:TT(NT('step1_title')), why:NT(typeKey+'_step1_why'), work: left+' '+opDispOf(op)+' '+right });
    if (typeKey==='log') {
        main.push({ title:TT(NT('domain_title')), why:NT('log_domain_why'), work: NT('log_domain_statement') });
    }
    main.push({ title:TT(NT('ineq_step_title')), why:NT('ineq_step_why'), work:'' });

    var roots=critical.filter(function(c){return c.kind==='root';});
    var gaps=critical.filter(function(c){return c.kind==='gap';});
    var ptsWork = (roots.length ? roots.map(function(r){return fmtNum(r.x);}).join(', ') : '—');
    if (gaps.length) ptsWork += (roots.length?'<br>':'') + fillTpl(NT('domain_found'),{list:gaps.map(function(g){return fmtNum(g.x);}).join(', ')});
    main.push({ title:TT(NT('ineq_critical_title')), why:NT('ineq_critical_why'), work: ptsWork });

    var nSeg=critical.length, rows=[];
    for (var k=0;k<=nSeg;k++){
        var lo=k===0?-Infinity:critical[k-1].x, hi=k===nSeg?Infinity:critical[k].x;
        var mid=(isFinite(lo)&&isFinite(hi))?(lo+hi)/2:(isFinite(lo)?lo+1:(isFinite(hi)?hi-1:0));
        var val=fn(mid);
        var sign=isFinite(val)?(val>0?'+':'−'):'?';
        var matches=isFinite(val)&&(((op==='>'||op==='>=')&&val>0)||((op==='<'||op==='<=')&&val<0));
        var lbl=(isFinite(lo)?fmtNum(lo):'−∞')+', '+(isFinite(hi)?fmtNum(hi):'+∞');
        rows.push('('+lbl+'):&nbsp; f('+fmtNum(mid)+') '+sign+(matches?'&nbsp;✓':''));
    }
    main.push({ title:TT(NT('ineq_chart_title')), why:NT('ineq_chart_why'), work: rows.join('<br>') });

    var segs=buildSignChartSegments(fn, critical, op, typeKey==='log'?1:0);
    if (typeKey==='log') segs.forEach(function(s){ if (s.lo===-Infinity) s.lo=0; });
    var finalWork = formatIntervalUnion(segs, T('eqNoSolutionSet'));
    if (typeKey==='trig') finalWork += '<br>'+NT('trig_period_note');
    if (typeKey==='log') finalWork += '<br><small style="opacity:0.6;">'+NT('log_domain_statement')+'</small>';
    main.push({ title:TT(NT('ineq_final_title')), why:NT('ineq_final_why'), work: finalWork });
    return main;
}

function buildNumericNoRootSteps(typeKey, left, right, op) {
