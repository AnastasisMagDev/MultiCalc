<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chemical Formula Lab</title>
<style>
.fl-wrap{max-width:780px;margin:0 auto;padding:12px 12px 32px;color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.fl-wrap *{box-sizing:border-box}
.fl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fl-head h2{margin:0;font-size:1.15rem;color:inherit}
.fl-head small{display:block;opacity:.7;font-size:.78rem;margin-top:2px}
.fl-lang{margin-left:auto;display:flex;gap:4px}
.fl-lang button{background:#16203f;color:#cfe0ff;border:1px solid #2c3d73;border-radius:8px;padding:4px 8px;font-size:.75rem}
.fl-card{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(145deg,#0d1630,#140f31);border:1px solid rgba(140,170,255,.2);box-shadow:0 10px 36px rgba(15,25,70,.45)}
.fl-card::before{content:"";position:absolute;inset:-45%;pointer-events:none;background:radial-gradient(circle at 25% 25%,rgba(110,168,255,.2),transparent 40%),radial-gradient(circle at 78% 72%,rgba(177,140,255,.18),transparent 42%);animation:fl-drift 16s ease-in-out infinite alternate}
.fl-card>*{position:relative}
@keyframes fl-drift{to{transform:translate(6%,4%) rotate(8deg)}}
.fl-in{width:100%;font:600 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;color:#fff;background:rgba(5,9,25,.7);border:1.5px solid #34498f;border-radius:14px;padding:13px 14px;outline:0;transition:border-color .25s,box-shadow .25s}
.fl-in:focus{border-color:#6ea8ff;box-shadow:0 0 0 4px rgba(110,168,255,.18)}
.fl-keys,.fl-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fl-keys button,.fl-ex button{background:#18254f;color:#dce8ff;border:1px solid #2f4390;border-radius:10px;padding:7px 11px;font:600 .9rem ui-monospace,Menlo,monospace;transition:transform .15s,background .2s}
.fl-keys button:active,.fl-ex button:active{transform:scale(.94);background:#25377a}
.fl-lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-top:12px}
.fl-formula{font-size:1.9rem;font-weight:700;letter-spacing:.02em;animation:fl-up .5s both}
.fl-formula sub{font-size:.6em}
.fl-mass{font:700 2.6rem/1.1 ui-monospace,Menlo,monospace;background:linear-gradient(90deg,#7fb6ff,#c5a3ff,#7fb6ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl-shine 4s linear infinite}
@keyframes fl-shine{to{background-position:-200% 0}}
.fl-mass small{font-size:.9rem;opacity:.8;margin-left:6px;-webkit-text-fill-color:#aebfe8}
.fl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fl-tags span{font-size:.76rem;padding:4px 10px;border-radius:99px;background:rgba(110,168,255,.14);border:1px solid rgba(110,168,255,.3)}
.fl-note{font-size:.74rem;opacity:.65;margin-top:8px;line-height:1.35}
.fl-comp{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fl-donut{width:150px;height:150px;flex:none}
.fl-seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*110ms)}
.fl-leg{flex:1;min-width:190px;display:grid;gap:8px}
.fl-lr{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font-size:.85rem}
.fl-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.fl-bar i{display:block;height:100%;width:0;border-radius:5px;background:var(--c);transition:width 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*110ms)}
.fl-chip{font-style:normal;font-weight:800;text-align:center;border-radius:9px;padding:4px 0;color:#0a1022;background:var(--c)}
.fl-step{animation:fl-up .55s both;animation-delay:calc(var(--i)*130ms)}
.fl-step h3{margin:0 0 4px;font-size:.98rem;color:#cfe0ff}
.fl-step p{margin:0 0 10px;font-size:.78rem;opacity:.7;line-height:1.35}
.fl-row{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font:.92rem ui-monospace,Menlo,monospace;word-break:break-word}
.fl-eq{font:.92rem ui-monospace,Menlo,monospace;line-height:1.6;word-break:break-word}
.fl-eq b{color:#8fe9c4}
.fl-err{border-radius:16px;padding:14px;background:#2a1020;border:1px solid #7a2a4a;animation:fl-up .35s both}
.fl-err code{display:block;margin-top:8px;font-size:1.2rem;color:#ffd3df}
.fl-err u{color:#ff6b8f;text-decoration-thickness:3px}
.fl-src{font-size:.7rem;opacity:.5;line-height:1.4;margin-top:4px}
@keyframes fl-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl-mode{display:flex;gap:6px;margin-top:12px}.fl-mode button{flex:1;background:#18254f;color:#dce8ff;border:1px solid #2f4390;border-radius:10px;padding:8px;font-weight:700;transition:background .25s}
.fl-mode .on{background:#3a56c9;border-color:#6ea8ff;color:#fff}
.fl-why{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.8rem;line-height:1.45;background:rgba(143,233,196,.08);border:1px solid rgba(143,233,196,.25);animation:fl-up .4s both}
.fl-row em{opacity:.75;font-style:normal;font-size:.8rem}
.fl-mi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.fl-mi label{font-size:.72rem;opacity:.85}
.fl-mi input{width:100%;margin-top:4px;font:600 1.1rem ui-monospace,Menlo,monospace;color:#fff;background:rgba(5,9,25,.7);border:1.5px solid #34498f;border-radius:12px;padding:10px;outline:0}
.fl-hint{margin:0 0 10px;font-size:.78rem;opacity:.7}
.fl-er{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;margin-bottom:8px}
.fl-er input{width:100%;font:600 1rem ui-monospace,Menlo,monospace;color:#fff;background:rgba(5,9,25,.7);border:1.5px solid #34498f;border-radius:12px;padding:9px;outline:0}
.fl-er button{background:#2a1a3a;color:#ffb3c8;border:1px solid #6b3b6b;border-radius:10px}
.fl-formula sup{font-size:.6em}
.fl-irow{display:grid;grid-template-columns:48px 1fr auto;gap:4px 10px;align-items:center;font:.8rem ui-monospace,Menlo,monospace;padding:4px 0;word-break:break-all}
.fl-irow>span:first-child{color:var(--c);font-weight:800}
.fl-irow .fl-bar{grid-column:1/-1;height:5px}
.fl-stage{position:relative;border-radius:20px;margin-bottom:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16224a,#0a1022 75%);border:1px solid rgba(140,170,255,.2);box-shadow:0 10px 36px rgba(15,25,70,.45)}
.fl-stage canvas{display:block;margin:0 auto;touch-action:none}
.fl-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.fl-tools button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(140,170,255,.3);background:rgba(16,26,60,.72);color:#dce8ff;font-size:1.05rem;padding:0}
.fl-stage.fl-full{position:fixed;inset:0;z-index:9999;margin:0;border-radius:0}
.fl-stage.fl-full canvas{margin:0}
.fl-cap{position:absolute;left:12px;bottom:8px;font-size:.68rem;opacity:.55}
.fl-formula span{display:inline-block;animation:fl-pop .6s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--d)*65ms)}
@keyframes fl-pop{from{opacity:0;transform:translateY(12px) scale(.55)}to{opacity:1;transform:none}}
.fl-head .back-btn{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid rgba(140,170,255,.3);background:rgba(16,26,60,.78);color:#dce8ff;font-size:1.2rem;cursor:pointer;transition:transform .15s,background .2s}
.fl-head .back-btn:active{transform:scale(.92);background:#25377a}
body.theme-light .fl-head h2{color:#0f172a}
body.theme-light .fl-head small{color:#475569;opacity:1}
body.theme-light .fl-src{color:#334155;opacity:.85}
.fun-facts-slot{margin-top:14px}
@media (prefers-reduced-motion:reduce){.fl-wrap *,.fl-wrap *::before{animation:none!important;transition:none!important}}
</style></head>

  <div class="fun-facts-slot"></div>
</div></div>

      var ab=x.lo!==null?'['+pc(x.lo)+' – '+pc(x.hi)+']':pc(x.x)+(x.u?' ± '+pc(x.u):'');
      return '<div class="fl-irow" style="'+c+';--i:'+Math.min(n++,12)+'"><span><sup>'+x.A+'</sup>'+a.el+'</span><span>'+x.mass+'</span><b>'+ab+' %</b><div class="fl-bar"><i data-w="'+(x.mid/d.sum*100)+'"></i></div></div>';
    }).join('')+'</div></div>';
  });
  if(P&&P.ok){
    h+='<div class="fl-eq" style="margin-top:10px">'+FT('i_mono')+' = <b>'+P.mono.toFixed(6)+'</b> u · '+FT('i_avg')+' = <b>'+P.avg.toFixed(4)+'</b></div><div class="fl-lbl">'+FT('i_pat')+'</div>';
    h+=P.peaks.map(function(k){return '<div class="fl-irow" style="--c:#8fe9c4;--i:'+Math.min(n++,12)+'"><span>M'+(k.k>0?'+'+k.k:k.k<0?'−'+(-k.k):'')+'</span><span>'+k.mass.toFixed(5)+'</span><b>'+(k.rel>=0.1?k.rel.toFixed(1):k.rel.toPrecision(2))+' %</b><div class="fl-bar"><i data-w="'+k.rel+'"></i></div></div>';}).join('');
    if(P.approx)h+='<div class="fl-note">⚠ '+FT('i_mid')+'</div>';
  }else if(P)h+='<div class="fl-note">⚠ '+FT('i_'+P.reason).replace('{x}',P.el||'')+'</div>';
  return h+'<div class="fl-note">'+FT('i_src')+'</div>'+why('w6');
}
function ionBody(r){
  var E=window.FormulaEngine,o=E.ionic(r),h='',l=L();
  if(!o||(o.status!=='ok'&&!o.metal))return null;
  if(o.status==='ok'){
    h=o.ions.map(function(p){return '<div class="fl-row"><i class="fl-chip" style="--c:'+(p.q>0?'#7fb6ff':'#ffb86b')+'">'+(p.q>0?'+':'−')+'</i><span><b>'+p.n+' × '+E.pretty(esc(p.f))+chg(p.q)+'</b> <em>— '+esc(p.nm[l]||p.nm.en)+' · '+p.share.toFixed(2)+' %</em></span></div>';}).join('');
    h+=o.extra.map(function(s){return '<div class="fl-row"><i class="fl-chip" style="--c:#8fe9c4">0</i><span><b>'+E.pretty(esc(s))+'</b> <em>— '+FT('i7_neu')+'</em></span></div>';}).join('');
    h+='<div class="fl-eq" style="margin-top:8px">Σ = '+o.ions.map(function(p){return p.n+' × ('+(p.q>0?'+':'−')+Math.abs(p.q)+')';}).join(' + ')+' = <b>0</b> ✓</div>';
  }else h='<div class="fl-note">⚠ '+FT(o.status==='ambiguous'?'i7_amb':'i7_none')+'</div>';
  return h+why('w7');
}
function eRender(){
  var c=$('fl-erows');if(!c)return;
  c.innerHTML=eRows.map(function(r,i){return '<div class="fl-er"><input class="fl-es" data-i="'+i+'" value="'+esc(r[0])+'" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="fl-ev" data-i="'+i+'" value="'+esc(r[1])+'" inputmode="decimal" autocomplete="off"><button data-ed="'+i+'" type="button">✕</button></div>';}).join('');
}
function empRun(){
  var o=$('fl-eout'),E=window.FormulaEngine;if(!o||!E)return;
  var it=eRows.filter(function(r){return String(r[0]).trim()||String(r[1]).trim();}).map(function(r){return{el:r[0],val:r[1]};});
  var Mv=$('fl-eM')?pn($('fl-eM').value):null,res=E.empirical(it,Mv>0?Mv:null);
  if(!res.ok){o.innerHTML='<div class="fl-err">⚠ '+esc(FT('ee_'+res.error.code).replace('{x}',res.error.info||''))+'</div>';return;}
  var P=function(x,d){return String(+x.toPrecision(d));},i=0,b1='',b2='',b3='';
  function row(r,t){return '<div class="fl-row"><i class="fl-chip" style="--c:'+cc(r)+'">'+r.el+'</i><span>'+t+'</span></div>';}
  res.rows.forEach(function(r){
    b1+=row(r,P(r.val,6)+' ÷ '+r.ar+' = <b>'+P(r.mol,5)+'</b> mol');
    b2+=row(r,P(r.mol,5)+' ÷ '+P(res.minMol,5)+' = <b>'+P(r.ratio,4)+'</b>');
    b3+=row(r,P(r.ratio,4)+' × '+res.k+' = '+P(r.ratio*res.k,4)+' → <b>'+r.n+'</b>');
  });
  var w='';
  if(Math.abs(res.sum-100)>1)w+='<div class="fl-note">⚠ '+FT('ew_sum').replace('{x}',P(res.sum,5))+'</div>';
  if(!res.exact)w+='<div class="fl-note">⚠ '+FT('ew_apx')+'</div>';
  function c(t,b){return '<div class="fl-card fl-step" style="--i:'+(i++)+'"><h3>'+FT(t)+'</h3>'+b+'</div>';}
  var m=res.molecular,h=c('f1',b1)+c('f2',b2)+c('f3',b3+'<div class="fl-note">k = '+res.k+'</div>')+
    c('f4','<div class="fl-formula">'+window.FormulaEngine.pretty(res.formula)+'</div><div class="fl-eq">M<sub>emp</sub> = '+f(res.empMass)+' g/mol</div>'+w);
  if(m)h+=c('f5','<div class="fl-eq">n = M ÷ M<sub>emp</sub> = '+f(Mv)+' ÷ '+f(res.empMass)+' = <b>'+P(m.nn,5)+'</b>'+(m.ok?' ≈ '+m.n:'')+'</div>'+
    (m.ok?'<div class="fl-formula">'+window.FormulaEngine.pretty(m.formula)+'</div><div class="fl-eq">M = '+f(m.mass)+' g/mol</div>':'<div class="fl-note">⚠ '+FT('ew_mol').replace('{x}',P(m.nn,4))+'</div>'));
  o.innerHTML=h;
}
function pn(v){var x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>=0?x:null;}
function sci(x){return x!==0&&(x>=1e6||x<1e-3)?x.toExponential(4):String(+x.toPrecision(6));}
function mol(src){
  var c=$('fl-mol');if(!c)return;
  if(!curM){c.hidden=true;return;}
  c.hidden=false;
  var g=$('fl-g'),n=$('fl-n'),M=curM,v;
  if(src==='n'){v=pn(n.value);if(v!==null)g.value=sci(v*M);}
  else{v=pn(g.value);if(v!==null)n.value=sci(v/M);}
  var gg=pn(g.value),mm=pn(n.value),o=$('fl-mst');
  o.innerHTML=(gg===null||mm===null)?'':'n = m ÷ M = '+sci(gg)+' ÷ '+f(M)+' = <b>'+sci(mm)+'</b> mol<br>N = n × N<sub>A</sub> = '+sci(mm)+' × 6.02214076×10²³ = <b>'+(mm*window.FormulaEngine.NA).toExponential(4)+'</b> '+FT('np')+why('wm');
}
function run(){
  if(stExit)stExit();
  var inp=$('fl-in'),out=$('fl-out'),E=window.FormulaEngine;
  if(!inp||!out||!E)return;
  var r=E.analyze(inp.value);
  if(!r.ok){out.innerHTML=(r.error.code==='EMPTY'&&!inp.value.trim())?'':errHTML(r);curM=0;mol();return;}
  out.innerHTML=resHTML(r);curM=r.mass;mol();animate();stage(r);
}
function edit(k){
  var i=$('fl-in');if(!i)return;
  if(k==='clr')i.value='';
  else if(k==='del'){var p=i.selectionStart==null?i.value.length:i.selectionStart;if(p>0){i.value=i.value.slice(0,p-1)+i.value.slice(i.selectionEnd);i.setSelectionRange(p-1,p-1);}}
  else{var a=i.selectionStart==null?i.value.length:i.selectionStart,b=i.selectionEnd==null?a:i.selectionEnd;i.value=i.value.slice(0,a)+k+i.value.slice(b);i.setSelectionRange(a+1,a+1);}
  i.focus();run();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&stExit)stExit();});
document.addEventListener('input',function(e){var id=e.target&&e.target.id;if(id==='fl-in'){clearTimeout(tm);tm=setTimeout(run,200);}else if(id==='fl-g')mol('g');else if(id==='fl-n')mol('n');
  else if(e.target.classList&&(e.target.classList.contains('fl-es')||e.target.classList.contains('fl-ev')||id==='fl-eM')){
    var cl=e.target.classList,di=+e.target.getAttribute('data-i');
    if(cl.contains('fl-es'))eRows[di][0]=e.target.value;else if(cl.contains('fl-ev'))eRows[di][1]=e.target.value;
    clearTimeout(tm2);tm2=setTimeout(empRun,250);}
});
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('#scr-formula button,.fl-stage button'):null;if(!t)return;
  if(t.hasAttribute('data-k'))edit(t.getAttribute('data-k'));
  else if(t.hasAttribute('data-ex')){$('fl-in').value=t.getAttribute('data-ex');run();}
  else if(t.hasAttribute('data-l')){window.MultiCalc.state.currentLang=t.getAttribute('data-l');i18n();}
  else if(t.hasAttribute('data-t')){if(stCtl)stCtl(t.getAttribute('data-t'));}
  else if(t.hasAttribute('data-ea')){eRows.push(['','']);eRender();var ins=document.querySelectorAll('#fl-erows .fl-es');if(ins.length)ins[ins.length-1].focus();empRun();}
  else if(t.hasAttribute('data-eu')){if(curM){$('fl-eM').value=f(curM);empRun();}}
  else if(t.hasAttribute('data-ed')){if(eRows.length>1){eRows.splice(+t.getAttribute('data-ed'),1);eRender();empRun();}}
  else if(t.hasAttribute('data-m')){var m=t.getAttribute('data-m'),b=document.querySelectorAll('#fl-mode button');det=m==='1';for(var j=0;j<b.length;j++)b[j].classList.toggle('on',b[j].getAttribute('data-m')===m);run();}
});
var _nav=window.navTo;
if(typeof _nav==='function')window.navTo=function(id){var r=_nav.apply(this,arguments);if(id!=='scr-formula'&&stExit)stExit();if(id==='scr-formula'){if(shownLang!==L())i18n();else run();}return r;};
(function boot(n){if(chips()&&window.FormulaEngine)i18n(inApp);else if(n<40)setTimeout(function(){boot(n+1);},100);})(0);
})();
</script>
</body></html>
