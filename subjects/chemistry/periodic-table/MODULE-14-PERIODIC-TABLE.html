<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODULE 14 — Periodic Table</title>
<style>
/* ═══ MODULE-14 Periodic Table — every selector / keyframe / property is namespaced ptbl- (styles are global in-app) ═══ */
@property --ptbl-ta{syntax:'<color>';inherits:false;initial-value:#3a4a63;}
@property --ptbl-tb{syntax:'<color>';inherits:false;initial-value:#2a3850;}
@property --ptbl-tc{syntax:'<color>';inherits:false;initial-value:#0b1220;}

html.ptbl-standalone{background:#0f172a;}
html.ptbl-standalone body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(1200px 700px at 15% -10%,#1e2a52 0%,transparent 60%),linear-gradient(135deg,#0f172a,#1e293b 55%,#1a1f3a);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
html.ptbl-standalone .screen{display:none;padding:20px;}
html.ptbl-standalone .screen.active{display:block;}
html.ptbl-standalone .back-btn{background:rgba(30,41,59,.7);color:#fff;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:9px 14px;cursor:pointer;}

.ptbl-root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--morph:cubic-bezier(.45,.05,.25,1);--fg:#f1f5f9;--mut:#9fb0c7;--line:rgba(148,163,184,.22);--railbg:rgba(15,23,42,.9);
  --glass:linear-gradient(160deg,rgba(30,41,59,.84),rgba(15,23,42,.92));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--fg);}
body.theme-light .ptbl-root{--fg:#0f172a;--mut:#475569;--railbg:rgba(241,245,249,.92);}
.ptbl-root *{box-sizing:border-box;}
.ptbl-root button{font-family:inherit;}
.ptbl-wrap{max-width:1500px;margin:0 auto;}
#scr-ptbl.ptbl-root{padding-left:10px;padding-right:10px;}
@media(max-width:480px){#scr-ptbl.ptbl-root{padding-left:8px;padding-right:8px;}}

/* ── top bar & controls ── */
.ptbl-top{display:flex;align-items:center;gap:14px;margin:0 0 14px;}
.ptbl-titles{min-width:0;}
.ptbl-title{font-size:1.6rem;font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em;}
.ptbl-sub{color:var(--mut);font-size:.9rem;margin-top:3px;font-variant-numeric:tabular-nums;}
.ptbl-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;}
.ptbl-search{position:relative;flex:1 1 260px;max-width:420px;}
.ptbl-search svg{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);stroke:#94a3b8;fill:none;stroke-width:2;pointer-events:none;}
.ptbl-q{width:100%;padding:11px 38px 11px 40px;border-radius:999px;border:1px solid var(--line);background:rgba(15,23,42,.78);color:#f1f5f9;font-size:1rem;outline:none;transition:border-color .3s,box-shadow .3s;}
.ptbl-q:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(165,180,252,.22);}
.ptbl-qx{position:absolute;right:6px;top:50%;width:30px;height:30px;transform:translateY(-50%) scale(.6);opacity:0;pointer-events:none;border:0;border-radius:50%;background:rgba(148,163,184,.25);color:#e2e8f0;cursor:pointer;font-size:1rem;line-height:1;transition:opacity .25s,transform .35s var(--spring);}
.ptbl-q:not(:placeholder-shown)~.ptbl-qx{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto;}
.ptbl-seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(15,23,42,.85);border:1px solid var(--line);}
.ptbl-seg button{position:relative;z-index:1;padding:8px 16px;border:0;background:none;color:#cbd5e1;font-size:.86rem;font-weight:700;border-radius:999px;cursor:pointer;transition:color .35s;white-space:nowrap;}
.ptbl-seg button[aria-checked="true"]{color:#0b1220;}
.ptbl-seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,#a5b4fc,#f0abfc);box-shadow:0 4px 16px rgba(165,180,252,.45);transition:transform .55s var(--spring);}
.ptbl-seg[data-v="cpk"] .ptbl-seg-thumb{transform:translateX(100%);}
.ptbl-zoom{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(15,23,42,.85);border:1px solid var(--line);}
.ptbl-zoom button{width:34px;height:32px;border:0;border-radius:999px;background:none;color:#e2e8f0;font-size:1.1rem;cursor:pointer;transition:background .25s,transform .3s var(--spring),opacity .25s;}
.ptbl-zoom button:active{transform:scale(.88);background:rgba(148,163,184,.25);}
.ptbl-zoom button:disabled{opacity:.3;cursor:default;}
.ptbl-zoom span{min-width:38px;text-align:center;font-size:.78rem;color:#94a3b8;font-variant-numeric:tabular-nums;}
.ptbl-q:focus-visible,.ptbl-chip:focus-visible,.ptbl-cell:focus-visible,.ptbl-btn:focus-visible,.ptbl-seg button:focus-visible,.ptbl-zoom button:focus-visible,.ptbl-ph:focus-visible,.ptbl-xcard:focus-visible,.ptbl-bar-h:focus-visible,.ptbl-pillb:focus-visible{outline:2px solid #a5b4fc;outline-offset:2px;}

/* ── legend chips ── */
.ptbl-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ptbl-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 6px 6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(15,23,42,.78);color:#e2e8f0;font-size:.82rem;cursor:pointer;transition:background .35s,border-color .35s,color .35s,transform .3s var(--spring);}
.ptbl-chip:active{transform:scale(.94);}
.ptbl-chip i{width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,var(--a),var(--b));flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;}
.ptbl-chip em{font-style:normal;min-width:22px;padding:1px 6px;border-radius:999px;background:rgba(148,163,184,.2);font-size:.72rem;text-align:center;font-variant-numeric:tabular-nums;}
.ptbl-chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--a),var(--b));border-color:rgba(255,255,255,.7);color:var(--tc);}
.ptbl-chip[aria-pressed="true"] i{background:var(--tc);}
.ptbl-chip[aria-pressed="true"] em{background:rgba(0,0,0,.18);}
.ptbl-chip-clear{border-style:dashed;padding:6px 12px;opacity:0;pointer-events:none;transform:scale(.9);}
.ptbl-has-filter .ptbl-chip-clear{opacity:1;pointer-events:auto;transform:none;}
.ptbl-hint{min-height:1.2em;margin:2px 2px 8px;color:var(--mut);font-size:.8rem;line-height:1.4;max-width:900px;}
.ptbl-info-host:empty{display:none;}
.ptbl-info-host{margin:0;}
.ptbl-info-top{margin-bottom:12px;}
.ptbl-info-off{display:none;}

/* ── the table ── */
.ptbl-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 8px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.ptbl-grid{--cw:48px;--ch:60px;--gap:3px;--rail:22px;position:relative;display:grid;grid-template-columns:var(--rail) repeat(18,var(--cw));grid-template-rows:20px 18px repeat(7,var(--ch)) calc(var(--ch)*.28) repeat(2,var(--ch));gap:var(--gap);width:max-content;margin:0 auto;}
.ptbl-band{border-radius:calc(var(--cw)*.2);margin:-5px -3px;background:linear-gradient(180deg,rgba(148,163,184,.10),rgba(148,163,184,.03));border:1px solid rgba(148,163,184,.14);pointer-events:none;}
.ptbl-bl{grid-row:1;align-self:end;margin:0 2px;padding-bottom:3px;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.16em;color:var(--mut);border-bottom:2px solid var(--bc);}
.ptbl-gh{grid-row:2;text-align:center;font-size:.7rem;color:var(--mut);font-variant-numeric:tabular-nums;align-self:center;cursor:default;}
.ptbl-gh b{font-weight:600;}
.ptbl-rl{grid-column:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;position:sticky;left:0;z-index:4;background:var(--railbg);border-radius:8px;}
.ptbl-ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;position:relative;z-index:1;border:1.5px solid var(--bc);border-radius:calc(var(--cw)*.14);background:rgba(15,23,42,.55);color:#e2e8f0;font-size:max(8px,calc(var(--cw)*.19));font-weight:700;cursor:pointer;padding:0;transition:background .35s,transform .3s var(--spring);}
.ptbl-ph:active{transform:scale(.94);}
.ptbl-ph:hover{background:rgba(15,23,42,.8);}
/* Group <-> CPK colour change: a cross-fade of STATIC layers using only `opacity`, which the GPU compositor runs by itself.
   The main thread paints each layer once and then does no per-frame work (the old version re-painted 118 gradients every frame). */
.ptbl-cell{--bw:1px;position:relative;z-index:1;display:block;border:var(--bw) solid transparent;border-radius:calc(var(--cw)*.14);background:none;cursor:pointer;
  box-shadow:0 8px 16px -8px rgba(0,0,0,.6);
  transition:transform .38s var(--spring),opacity .4s ease,filter .4s ease,box-shadow .35s ease;-webkit-tap-highlight-color:transparent;}
.ptbl-cell::before,.ptbl-cell::after,.ptbl-lk{content:"";display:block;position:absolute;inset:calc(var(--bw)*-1);border-radius:inherit;pointer-events:none;box-sizing:border-box;}
.ptbl-cell::before{z-index:0;background:linear-gradient(155deg,var(--ga),var(--gb));}
.ptbl-lk{z-index:0;opacity:0;will-change:opacity;transition:opacity .75s var(--morph) calc(var(--d,0)*1ms);
  background-image:linear-gradient(90deg,var(--ca),var(--cb)),linear-gradient(155deg,var(--ka),var(--kb));background-repeat:no-repeat;background-position:0 100%,0 0;
  background-size:100% calc(max(4px,var(--cw)*.09) + var(--bw)),100% 100%;}
.ptbl-mode-cpk .ptbl-lk{opacity:1;}
.ptbl-cell::after{z-index:2;border:var(--bw) solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 48%);background-origin:border-box;box-shadow:0 1px 0 rgba(255,255,255,.4) inset;transition:box-shadow .35s ease;}
.ptbl-tg,.ptbl-tk{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 1px 5px;pointer-events:none;}
.ptbl-tg{color:var(--gt);}
.ptbl-tk{color:var(--kt);opacity:0;}
.ptbl-x{will-change:opacity;transition:opacity .75s var(--morph) calc(var(--d,0)*1ms);}
.ptbl-mode-cpk .ptbl-tg.ptbl-x{opacity:0;}
.ptbl-mode-cpk .ptbl-tk{opacity:1;}
.ptbl-cell:active{transform:scale(.93);}
.ptbl-an{position:absolute;top:calc(var(--cw)*.07);left:calc(var(--cw)*.1);font-size:max(8px,calc(var(--cw)*.2));font-weight:700;opacity:.78;font-variant-numeric:tabular-nums;line-height:1;}
.ptbl-sy{font-size:calc(var(--cw)*.46);font-weight:800;line-height:1;letter-spacing:-.01em;margin-top:calc(var(--cw)*.12);}
.ptbl-nm{display:none;max-width:100%;padding:0 2px;font-size:max(7.5px,calc(var(--cw)*.165));font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--cw)*.05);}
.ptbl-ms{display:none;font-size:max(7px,calc(var(--cw)*.15));opacity:.7;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:1px;}
.ptbl-s2 .ptbl-nm,.ptbl-s3 .ptbl-nm{display:block;}
.ptbl-s3 .ptbl-ms,.ptbl-s2.ptbl-tall .ptbl-ms{display:block;}
.ptbl-pred{--bw:1.5px;}
.ptbl-pred::after{border-style:dashed;border-color:rgba(255,255,255,.9);}
.ptbl-dim{opacity:.12;filter:saturate(.3);transform:scale(.93);}
@media(hover:hover){.ptbl-cell:hover,.ptbl-cell:focus-visible{transform:translateY(-3px) scale(1.14);z-index:5;box-shadow:0 16px 28px -8px rgba(0,0,0,.7);}.ptbl-cell:hover::after,.ptbl-cell:focus-visible::after{box-shadow:0 1px 0 rgba(255,255,255,.5) inset;}.ptbl-dim:hover{opacity:.4;}}
.ptbl-enter .ptbl-cell{animation:ptbl-in .7s var(--ease) both;animation-delay:calc(var(--d,0)*1ms);}
@keyframes ptbl-in{from{opacity:0;transform:translateY(10px) scale(.55);}to{opacity:1;transform:none;}}

/* ── preview / overview panel (fills the gap of the table) ── */
.ptbl-info{position:relative;z-index:2;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:var(--glass);color:#f1f5f9;padding:14px 16px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8);}
.ptbl-info::before{content:"";position:absolute;inset:-40% -10% auto auto;width:70%;height:140%;background:radial-gradient(closest-side,var(--ia,rgba(165,180,252,.22)),transparent);transition:background .6s ease;pointer-events:none;}
.ptbl-info-grid{grid-column:4/14;grid-row:3/6;margin:0 4px;display:flex;flex-direction:column;justify-content:center;}
.ptbl-info-in{position:relative;animation:ptbl-swap .45s var(--ease) both;}
@keyframes ptbl-swap{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.ptbl-ip{display:flex;gap:14px;align-items:center;}
.ptbl-ip-tile{transition:--ptbl-ta .75s var(--morph),--ptbl-tb .75s var(--morph),--ptbl-tc .5s var(--morph);flex:none;position:relative;width:76px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,var(--ptbl-ta),var(--ptbl-tb));color:var(--ptbl-tc);border:1px solid rgba(255,255,255,.35);box-shadow:0 10px 24px -10px rgba(0,0,0,.7);}
.ptbl-ip-tile small{position:absolute;top:6px;left:8px;font-size:.7rem;font-weight:700;opacity:.8;}
.ptbl-ip-tile b{font-size:2rem;font-weight:800;}
.ptbl-ip h3{margin:0;font-size:1.25rem;line-height:1.15;}
.ptbl-ip-alt{color:#94a3b8;font-size:.82rem;}
.ptbl-ip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 16px;margin-top:8px;font-size:.8rem;}
.ptbl-ip-grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(148,163,184,.14);padding:2px 0;}
.ptbl-ip-grid span{color:#94a3b8;}
.ptbl-ip-grid b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.ptbl-ov{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.ptbl-ov-n{font-size:3rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#a5b4fc,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ptbl-ov p{margin:0;color:#cbd5e1;font-size:.86rem;line-height:1.45;max-width:420px;}
.ptbl-ov-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.ptbl-ov-stats span{padding:4px 10px;border-radius:999px;background:rgba(148,163,184,.16);font-size:.76rem;color:#e2e8f0;}
.ptbl-ov-stats b{font-variant-numeric:tabular-nums;}
.ptbl-info-top .ptbl-info-in{max-width:760px;}

/* ── below-the-table sections ── */
.ptbl-extras{margin-top:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));}
.ptbl-xsec{padding:16px 18px;border-radius:22px;border:1px solid var(--line);background:var(--glass);color:#f1f5f9;box-shadow:0 18px 40px -22px rgba(0,0,0,.85);}
.ptbl-xsec.ptbl-wide{grid-column:1/-1;}
.ptbl-xsec h2{margin:0 0 12px;font-size:1rem;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
.ptbl-xsec h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#a5b4fc,#f0abfc);}
.ptbl-xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;}
.ptbl-xcard{position:relative;text-align:left;padding:12px 14px 12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(15,23,42,.55);color:#e2e8f0;cursor:pointer;overflow:hidden;transition:transform .4s var(--spring),border-color .3s,background .3s;animation:ptbl-rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms);}
.ptbl-xcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--a),var(--b));}
.ptbl-xcard:active{transform:scale(.97);}
.ptbl-xcard[aria-pressed="true"]{border-color:var(--a);background:rgba(30,41,59,.9);}
.ptbl-xcard h4{margin:0 0 3px;font-size:.92rem;display:flex;justify-content:space-between;gap:8px;}
.ptbl-xcard h4 em{font-style:normal;color:var(--a);font-variant-numeric:tabular-nums;}
.ptbl-xcard p{margin:0 0 7px;font-size:.78rem;line-height:1.4;color:#a9b7cb;}
.ptbl-xcard div{display:flex;flex-wrap:wrap;gap:4px;}
.ptbl-xcard div span{padding:1px 7px;border-radius:7px;background:rgba(148,163,184,.16);font-size:.72rem;font-weight:700;}
.ptbl-stack{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:3px;}
.ptbl-stack button{flex:var(--w) 1 0;min-width:0;border:0;padding:0;border-radius:6px;background:var(--k);color:#0b1220;font-size:.78rem;font-weight:800;cursor:pointer;transform-origin:left;animation:ptbl-grow .9s var(--ease) both;animation-delay:calc(var(--i,0)*90ms);transition:filter .3s,opacity .3s;}
.ptbl-stack button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff inset;}
.ptbl-stack button.ptbl-zero{display:none;}
.ptbl-legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:#cbd5e1;}
.ptbl-legend2 span{display:inline-flex;align-items:center;gap:6px;}
.ptbl-legend2 i{width:10px;height:10px;border-radius:3px;background:var(--k);}
.ptbl-note-s{margin:8px 0 0;font-size:.74rem;color:#8ea0b8;line-height:1.4;}
.ptbl-hist{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px;}
.ptbl-bar-h{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;border:0;background:none;padding:0;color:#cbd5e1;cursor:pointer;min-width:0;}
.ptbl-bar-h i{display:block;width:100%;height:calc(var(--h) * .86px);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#a5b4fc,#7c6ff0 60%,#f0abfc);transform-origin:bottom;animation:ptbl-up .9s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);transition:filter .3s,opacity .3s;}
.ptbl-bar-h b{font-size:.8rem;font-variant-numeric:tabular-nums;}
.ptbl-bar-h span{font-size:.68rem;color:#94a3b8;text-align:center;line-height:1.15;min-height:2.3em;}
.ptbl-bar-h[aria-pressed="true"] i{filter:brightness(1.3);box-shadow:0 0 0 2px #fff inset;}
.ptbl-has-era .ptbl-bar-h[aria-pressed="false"]{opacity:.55;}
.ptbl-pills{display:flex;flex-wrap:wrap;gap:8px;}
.ptbl-pillb{flex:1 1 90px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(15,23,42,.55);color:#e2e8f0;text-align:left;cursor:pointer;transition:transform .35s var(--spring),border-color .3s;animation:ptbl-rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms);}
.ptbl-pillb:active{transform:scale(.96);}
.ptbl-pillb[aria-pressed="true"]{border-color:#a5b4fc;background:rgba(49,46,129,.55);}
.ptbl-pillb b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;}
.ptbl-pillb span{font-size:.74rem;color:#94a3b8;}
@keyframes ptbl-grow{from{transform:scaleX(.01);opacity:0;}to{transform:none;opacity:1;}}
@keyframes ptbl-up{from{transform:scaleY(.02);opacity:0;}to{transform:none;opacity:1;}}
@keyframes ptbl-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ── element screen ── */
.ptbl-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:820px;margin:0 auto 14px;}
.ptbl-nav-r{display:flex;gap:8px;align-items:center;}
.ptbl-count{color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums;margin-right:2px;}
.ptbl-btn{min-width:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(30,41,59,.78);color:#f1f5f9;font-size:.95rem;cursor:pointer;transition:transform .35s var(--spring),background .3s;}
.ptbl-btn:active{transform:scale(.92);background:rgba(51,65,85,.9);}
.ptbl-narrow{max-width:820px;margin:0 auto;overflow-x:clip;}
.ptbl-slide-r{animation:ptbl-sr .5s var(--ease) both;}
.ptbl-slide-l{animation:ptbl-sl .5s var(--ease) both;}
@keyframes ptbl-sr{from{opacity:0;transform:translateX(34px);}to{opacity:1;transform:none;}}
@keyframes ptbl-sl{from{opacity:0;transform:translateX(-34px);}to{opacity:1;transform:none;}}
.ptbl-card{position:relative;margin-top:14px;padding:18px;border-radius:24px;border:1px solid var(--line);background:var(--glass);color:#f1f5f9;box-shadow:0 22px 44px -24px rgba(0,0,0,.85);animation:ptbl-rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*80ms);}
.ptbl-card:first-child{margin-top:0;}

.ptbl-tact{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:11px;}
